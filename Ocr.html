<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindee Passport OCR بۆ Excel</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family: Tahoma, Arial, sans-serif;
  background:#eef3f0;
  padding:15px;
}
.card{
  max-width:1200px;
  margin:auto;
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 5px 20px #0002;
}
h2{text-align:center;color:#075c3b}
input,button,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
}
button{
  background:#087046;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{background:#888;cursor:not-allowed}
textarea{
  height:170px;
  direction:ltr;
}
.status{
  color:#075c3b;
  font-weight:bold;
}
.table-wrap{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  min-width:900px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
  font-size:14px;
}
th{
  background:#087046;
  color:white;
}
td input{
  border:0;
  padding:6px;
  text-align:center;
  width:95%;
}
</style>
</head>

<body>

<div class="card">
  <h2>نظام OCR خوێندنەوەی پاسپۆرت بە Mindee و دابەشکردن بۆ Excel</h2>

  <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png">

  <button id="ocrBtn" onclick="processPassport()">خوێندنەوەی پاسپۆرت و زیادکردن بۆ خشتە</button>
  <button onclick="downloadExcel()">داونلۆدکردنی Excel</button>

  <p class="status" id="status">پاسپۆرت JPG/PNG یان PDF دیاری بکە...</p>

  <h3>JSON / زانیارییەکانی Mindee</h3>
  <textarea id="rawText" placeholder="JSON لێرە دەردەکەوێت..."></textarea>

  <h3>النتيجة / خشتەی کۆکراوەی حاجیان</h3>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>ناو / الاسم</th>
          <th>ساڵا / التولد</th>
          <th>ڕەگەز / الجنس</th>
          <th>سیفەت / الصفة</th>
          <th>رقم الجواز</th>
          <th>Name En</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>
</div>

<script>
const MINDEE_API_KEY = "md_mmyB-FkHjLYtqwr-";
const MINDEE_ENDPOINT = "https://api.mindee.net/v1/products/mindee/passport/v1/predict";

let rows = [];

async function processPassport(){
  const file = document.getElementById("fileInput").files[0];
  const status = document.getElementById("status");
  const btn = document.getElementById("ocrBtn");

  if(!file){
    alert("تکایە پاسپۆرت JPG/PNG یان PDF دیاری بکە");
    return;
  }

  if(MINDEE_API_KEY === "API_KEY_md_mmyB-FkHjLYtqwr-"){
    alert("AiTWoA7VEKc7wPlo6EBGOj7yv2k");
    return;
  }

  btn.disabled = true;
  status.style.color = "#075c3b";
  status.innerText = "Mindee OCR کار دەکات... چاوەڕێ بکە";

  try{
    const data = await callMindee(file);

    document.getElementById("rawText").value = JSON.stringify(data, null, 2);

    const fields = getFields(data);

    const givenNames = getValue(fields.given_names);
    const surnames = getValue(fields.surnames);
    const passportNumber = getValue(fields.passport_number);
    const dateOfBirth = formatDate(getValue(fields.date_of_birth));
    const sexRaw = getValue(fields.sex);
    const gender = convertGender(sexRaw);

    const nameEn = cleanSpaces((givenNames + " " + surnames).trim());

    rows.push({
      "الاسم": "پێویستی بە چاککردنە ✏️",
      "التولد": dateOfBirth || "پێویستی بە چاککردنە ✏️",
      "الجنس": gender || "پێویستی بە چاککردنە ✏️",
      "الصفة": "معتمر",
      "رقم الجواز": passportNumber || "پێویستی بە چاککردنە ✏️",
      "Name En": nameEn || "پێویستی بە چاککردنە ✏️"
    });

    renderTable();

    status.innerText = "پاسپۆرت بە سەرکەوتوویی خوێندرایەوە ✅";
    document.getElementById("fileInput").value = "";

  }catch(err){
    console.error(err);
    status.style.color = "red";
    status.innerText = "هەڵە ڕوویدا: " + err.message;
  }

  btn.disabled = false;
}

async function callMindee(file){
  const formData = new FormData();
  formData.append("document", file);

  const res = await fetch(MINDEE_ENDPOINT, {
    method: "POST",
    headers: {
      "Authorization": "Token " + MINDEE_API_KEY
    },
    body: formData
  });

  const text = await res.text();

  let data;
  try{
    data = JSON.parse(text);
  }catch(e){
    throw new Error(text);
  }

  if(!res.ok){
    throw new Error(data.message || data.error || "Mindee API Error");
  }

  return data;
}

function getFields(data){
  if(data.fields) return data.fields;

  if(
    data.document &&
    data.document.inference &&
    data.document.inference.prediction
  ){
    return data.document.inference.prediction;
  }

  if(
    data.inference &&
    data.inference.prediction
  ){
    return data.inference.prediction;
  }

  return {};
}

function getValue(field){
  if(!field) return "";

  if(typeof field === "string") return field;

  if(field.value !== undefined && field.value !== null){
    return String(field.value);
  }

  if(Array.isArray(field.values)){
    return field.values.map(x => x.value || "").join(" ");
  }

  return "";
}

function formatDate(date){
  if(!date) return "";

  if(date.includes("-")){
    const parts = date.split("-");
    if(parts.length === 3){
      return parts[2] + "/" + parts[1] + "/" + parts[0];
    }
  }

  return date;
}

function convertGender(sex){
  sex = String(sex || "").toLowerCase();

  if(sex.includes("female") || sex === "f"){
    return "أنثى";
  }

  if(sex.includes("male") || sex === "m"){
    return "ذكر";
  }

  return sex || "";
}

function cleanSpaces(text){
  return String(text || "").replace(/\s+/g, " ").trim();
}

function updateCell(index, field, value){
  if(rows[index]){
    rows[index][field] = value;
  }
}

function renderTable(){
  const body = document.getElementById("resultBody");
  body.innerHTML = "";

  rows.forEach((r, index)=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${index + 1}</td>
      <td><input type="text" value="${safe(r["الاسم"])}" oninput="updateCell(${index}, 'الاسم', this.value)"></td>
      <td><input type="text" value="${safe(r["التولد"])}" oninput="updateCell(${index}, 'التولد', this.value)"></td>
      <td><input type="text" value="${safe(r["الجنس"])}" oninput="updateCell(${index}, 'الجنس', this.value)"></td>
      <td><input type="text" value="${safe(r["الصفة"])}" oninput="updateCell(${index}, 'الصفة', this.value)"></td>
      <td><input type="text" value="${safe(r["رقم الجواز"])}" oninput="updateCell(${index}, 'رقم الجواز', this.value)"></td>
      <td><input type="text" value="${safe(r["Name En"])}" oninput="updateCell(${index}, 'Name En', this.value)" style="direction:ltr;text-align:left;"></td>
    `;

    body.appendChild(tr);
  });
}

function safe(v){
  return String(v || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function downloadExcel(){
  if(rows.length === 0){
    alert("هیچ زانیارییەک لە خشتەکەدا نییە");
    return;
  }

  const finalRows = rows.map((r, i)=>({
    "#": i + 1,
    "ناو / الاسم": r["الاسم"],
    "ساڵا / التولد": r["التولد"],
    "ڕەگەز / الجنس": r["الجنس"],
    "سیفەت / الصفة": r["الصفة"],
    "ژمارەی پاسپۆرت / رقم الجواز": r["رقم الجواز"],
    "Name En": r["Name En"]
  }));

  const ws = XLSX.utils.json_to_sheet(finalRows);

  ws["!views"] = [{RTL:true}];
  ws["!cols"] = [
    {wch:5},
    {wch:30},
    {wch:15},
    {wch:12},
    {wch:12},
    {wch:20},
    {wch:35}
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Umrah List");
  XLSX.writeFile(wb, "umrah_passports_list.xlsx");
}
</script>

</body>
</html>
