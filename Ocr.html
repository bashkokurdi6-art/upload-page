<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سیستەمی OCR فۆرمی عەمرە</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family: Tahoma, Arial, sans-serif;
  background:#eef3f0;
  padding:15px;
}
.card{
  max-width:1200px;
  margin:auto;
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 5px 20px #0002;
}
h2{text-align:center;color:#075c3b}
input,button,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}
button{
  background:#087046;
  color:white;
  border:0;
  font-weight:bold;
  cursor: pointer;
}
button:disabled{background:#888; cursor:not-allowed;}
textarea{
  height:120px;
  direction:ltr;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
  font-size:14px;
}
th{
  background:#087046;
  color:white;
}
td input{
  border:0;
  padding:6px;
  text-align:center;
  width:95%;
}
.status{
  color:#075c3b;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <h2>نظام OCR خوێندنەوەی لیستی عەمرەکاران</h2>

  <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,image/jpeg,image/png,application/pdf">

  <button id="ocrBtn" onclick="runOCR()">قۆناغی خوێندنەوە (OCR)</button>
  <button onclick="downloadExcel()">داونلۆدکردنی Excel</button>

  <p class="status" id="status">وێنەی خشتەکە یان فایلی PDF دیاری بکە...</p>

  <h3>دەقی خاو (Raw Text)</h3>
  <textarea id="rawText"></textarea>

  <h3>النتيجة / خشتەی کۆتایی</h3>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>ناو / الاسم</th>
        <th>ساڵا / التولد</th>
        <th>ڕەگەز / الجنس</th>
        <th>سیفەت / الصفة</th>
        <th>رقم الجواز</th>
        <th>Name En - ئینگلیزی</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>
</div>

<script>
const OCR_API_KEY = "K88841321188957";
let rows = [];

async function runOCR(){
  const file = document.getElementById("fileInput").files[0];
  const status = document.getElementById("status");
  const btn = document.getElementById("ocrBtn");

  if(!file){
    alert("تکایە سەرەتا فایلێک دیاری بکە");
    return;
  }

  rows = [];
  renderTable();
  status.innerText = "جاری خوێندنەوە و شیکردنەوەی خشتەکە...";
  btn.disabled = true;

  try{
    const formData = new FormData();
    formData.append("apikey", OCR_API_KEY);
    formData.append("file", file);
    
    // لێرەدا کێشەکە بە تەواوی چارەسەر کراوە بە بەکارهێنانی Engine 3 ی گونجاو بۆ عەرەبی
    formData.append("language", "ara"); 
    formData.append("OCREngine", "3"); 
    
    formData.append("scale", "true");
    formData.append("detectOrientation", "true");

    const res = await fetch("https://api.ocr.space/parse/image", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if(data.IsErroredOnProcessing){
      status.innerText = "هەڵە لە OCR: " + JSON.stringify(data.ErrorMessage);
      btn.disabled = false;
      return;
    }

    if(!data.ParsedResults || data.ParsedResults.length === 0){
      status.innerText = "هیچ دەقێک نەخوێندرایەوە، دڵنیابەرەوە لە ڕوونی وێنەکە.";
      btn.disabled = false;
      return;
    }

    const text = data.ParsedResults.map(x => x.ParsedText || "").join("\n");
    document.getElementById("rawText").value = text;

    rows = parseMinistryTable(text);
    renderTable();
    status.innerText = "سەرکەوتوو بوو! " + rows.length + " دێڕ دۆزرایەوە. ✅";

  }catch(e){
    console.error(e);
    status.innerText = "کێشە لە خوێندنەوەی فایل: " + e.message;
  }
  btn.disabled = false;
}

function parseMinistryTable(text){
  const lines = text.split("\n").map(x => x.trim()).filter(x => x.length > 5);
  const result = [];

  for(let i = 0; i < lines.length; i++){
    let line = lines[i].replace(/[||\t]+/g, " ").replace(/\s+/g, " ").trim();

    // ١. دۆزینەوەی ژمارەی پاسپۆرت
    const passportMatch = line.match(/\b[A-Z][0-9]{7,8}\b/i);
    if(!passportMatch) continue; 
    const passport = passportMatch[0].toUpperCase();

    // ٢. ڕێکەوتی لەدایکبوون
    const birthMatch = line.match(/\b\d{1,2}[-\/ ][A-Za-z]{3}[-\/ ]\d{2,4}\b/) || 
                       line.match(/\b\d{1,2}[-\/ ]\d{1,2}[-\/ ]\d{2,4}\b/);
    const birth = birthMatch ? birthMatch[0] : "";

    // ٣. ڕەگەز
    let gender = "";
    if(/\b(نکر|نكر|ذكر|ذكر|M|Male)\b/i.test(line)) gender = "نكر";
    else if(/\b(انثى|أنثى|مێ|F|Female)\b/i.test(line)) gender = "أنثى";

    // ٤. سیفەت
    let role = "معتمر"; 
    if(/سائق|سایق/i.test(line)) role = "سائق";
    else if(/متعهد/i.test(line)) role = "متعهد";

    // ٥. ناوی ئینگلیزی
    const enMatch = line.match(/[A-Z]{3,}(?:\s+[A-Z]{2,}){2,6}/);
    const nameEn = enMatch ? enMatch[0].trim() : "";

    // ٦. ناوی کوردی/عەرەبی
    let arabicName = line
      .replace(passport, "")
      .replace(birth, "")
      .replace(nameEn, "")
      .replace(/(نکر|نكر|انثى|أنثى|معتمر|سائق|متعهد|سایق)/g, "")
      .replace(/[0-9]/g, "")
      .replace(/[A-Za-z]/g, "")
      .replace(/[^\u0600-\u06FF\s]/g, "") 
      .replace(/\s+/g, " ")
      .trim();

    if(/^\d+\s/.test(arabicName)){
      arabicName = arabicName.replace(/^\d+\s/, "");
    }

    result.push({
      "الاسم": arabicName,
      "التولد": birth,
      "الجنس": gender,
      "الصفة": role,
      "رقم الجواز": passport,
      "Name En": nameEn
    });
  }
  return result;
}

function updateCell(index, field, value) {
  if(rows[index]) {
    rows[index][field] = value;
  }
}

function renderTable(){
  const body = document.getElementById("resultBody");
  body.innerHTML = "";

  rows.forEach((r, index)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td>${index + 1}</td>
        <td><input type="text" value="${safe(r["الاسم"])}" oninput="updateCell(${index}, 'الاسم', this.value)"></td>
        <td><input type="text" value="${safe(r["التولد"])}" oninput="updateCell(${index}, 'التولد', this.value)"></td>
        <td><input type="text" value="${safe(r["الجنس"])}" oninput="updateCell(${index}, 'الجنس', this.value)"></td>
        <td><input type="text" value="${safe(r["الصفة"])}" oninput="updateCell(${index}, 'الصفة', this.value)"></td>
        <td><input type="text" value="${safe(r["رقم الجواز"])}" oninput="updateCell(${index}, 'رقم الجواز', this.value)"></td>
        <td><input type="text" value="${safe(r["Name En"])}" oninput="updateCell(${index}, 'Name En', this.value)" style="direction:ltr; text-align:left;"></td>
    `;
    body.appendChild(tr);
  });
}

function safe(v){
  return String(v || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function downloadExcel(){
  if(rows.length === 0){
    alert("تکایە سەرەتا پرۆسەی OCR بکە");
    return;
  }

  const finalRows = rows.map((r, i)=>({
    "#": i + 1,
    "ناو / الاسم": r["الاسم"],
    "ساڵا / التولد": r["التولد"],
    "ڕەگەز / الجنس": r["الجنس"],
    "سیفەت / الصفة": r["الصفة"],
    "ژمارەی پاسپۆرت / رقم الجواز": r["رقم الجواز"],
    "Name En": r["Name En"]
  }));

  const ws = XLSX.utils.json_to_sheet(finalRows);
  ws['!views'] = [{RTL: true}]; 

  ws["!cols"] = [
    {wch:5}, {wch:30}, {wch:15}, {wch:12}, {wch:12}, {wch:18}, {wch:35}
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Umrah List");
  XLSX.writeFile(wb, "umrah_list.xlsx");
}
</script>

</body>
</html>
