<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR وزارة الأوقاف - Excel</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family: Tahoma, Arial, sans-serif;
  background:#eef3f0;
  padding:15px;
}
.card{
  max-width:1100px;
  margin:auto;
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 5px 20px #0002;
}
h2{text-align:center;color:#075c3b}
input,button,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}
button{
  background:#087046;
  color:white;
  border:0;
  font-weight:bold;
}
button:disabled{background:#888}
textarea{
  height:180px;
  direction:ltr;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
  font-size:14px;
}
th{
  background:#087046;
  color:white;
}
td input{
  border:0;
  padding:6px;
  text-align:center;
}
.status{
  color:#075c3b;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <h2>نظام OCR لاستمارة وزارة الأوقاف - العمرة</h2>

  <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,image/jpeg,image/png,application/pdf">

  <button id="ocrBtn" onclick="runOCR()">قراءة الملف OCR</button>
  <button onclick="downloadExcel()">تحميل Excel</button>

  <p class="status" id="status">اختر PDF أو JPG...</p>

  <h3>النص المستخرج</h3>
  <textarea id="rawText"></textarea>

  <h3>النتيجة</h3>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>الاسم</th>
        <th>التولد</th>
        <th>الجنس</th>
        <th>رقم الجواز</th>
        <th>Name En</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>
</div>

<script>
const OCR_API_KEY = "K88841321188957";

let rows = [];

async function runOCR(){
  const file = document.getElementById("fileInput").files[0];
  const status = document.getElementById("status");
  const btn = document.getElementById("ocrBtn");

  if(!file){
    alert("يرجى اختيار PDF أو JPG");
    return;
  }

  rows = [];
  renderTable();

  status.innerText = "جاري قراءة الملف...";
  btn.disabled = true;

  try{
    const formData = new FormData();

    formData.append("apikey", OCR_API_KEY);
    formData.append("file", file);
    formData.append("language", "ara");
    formData.append("OCREngine", "2");
    formData.append("isTable", "true");
    formData.append("scale", "true");
    formData.append("detectOrientation", "true");
    formData.append("isOverlayRequired", "false");

    if(file.type === "application/pdf"){
      formData.append("filetype", "PDF");
    }else{
      formData.append("filetype", "JPG");
    }

    const res = await fetch("https://api.ocr.space/parse/image", {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    console.log(data);

    if(data.IsErroredOnProcessing){
      status.innerText = "هەڵەی OCR: " + JSON.stringify(data.ErrorMessage);
      btn.disabled = false;
      return;
    }

    if(!data.ParsedResults || data.ParsedResults.length === 0){
      status.innerText = "هیچ دەقێک نەخوێندرایەوە";
      btn.disabled = false;
      return;
    }

    const text = data.ParsedResults
      .map(x => x.ParsedText || "")
      .join("\n");

    document.getElementById("rawText").value = text;

    rows = parseMinistryForm(text);
    renderTable();

    status.innerText = "تم استخراج " + rows.length + " صف ✅";

  }catch(e){
    console.error(e);
    status.innerText = "کێشە لە خوێندنەوەی فایل: " + e.message;
  }

  btn.disabled = false;
}

function parseMinistryForm(text){
  const lines = text
    .replace(/\r/g,"\n")
    .split("\n")
    .map(x => x.trim())
    .filter(x => x.length > 2);

  const result = [];

  for(let i=0; i<lines.length; i++){
    let line = lines[i]
      .replace(/[|]+/g, " ")
      .replace(/\t/g, " ")
      .replace(/\s+/g, " ")
      .trim();

    const passportMatch =
      line.match(/\b[A-Z][0-9]{7,10}\b/i) ||
      line.match(/\b[A-Z]{1,2}[0-9]{6,10}\b/i);

    if(!passportMatch) continue;

    const passport = passportMatch[0].toUpperCase();

    const birthMatch =
      line.match(/\b\d{1,2}[-\/][A-Za-z]{3}[-\/]\d{2,4}\b/) ||
      line.match(/\b\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}\b/) ||
      line.match(/\b\d{4}[-\/]\d{1,2}[-\/]\d{1,2}\b/);

    const birth = birthMatch ? birthMatch[0] : "";

    let gender = "";
    if(/ذكر|نر|male|\bM\b/i.test(line)) gender = "ذكر";
    if(/انثى|أنثى|مێ|female|\bF\b/i.test(line)) gender = "أنثى";

    const enMatch = line.match(/[A-Z]{2,}(?:\s+[A-Z]{2,}){1,6}/);
    const nameEn = enMatch ? enMatch[0].trim() : "";

    let arabicName = line
      .replace(passport, " ")
      .replace(birth, " ")
      .replace(nameEn, " ")
      .replace(/ذكر|أنثى|انثى|نر|مێ|male|female/gi, " ")
      .replace(/[0-9]/g, " ")
      .replace(/[A-Z]/gi, " ")
      .replace(/[^\u0600-\u06FF\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();

    if(arabicName.length < 3){
      arabicName = findArabicNear(lines, i);
    }

    result.push({
      "#": result.length + 1,
      "الاسم": arabicName,
      "التولد": birth,
      "الجنس": gender,
      "رقم الجواز": passport,
      "Name En": nameEn
    });
  }

  return result;
}

function findArabicNear(lines, index){
  for(let j=index; j>=Math.max(0,index-2); j--){
    const m = lines[j].match(/[\u0600-\u06FF]+(?:\s+[\u0600-\u06FF]+){1,6}/);
    if(m) return m[0].trim();
  }
  return "";
}

function renderTable(){
  const body = document.getElementById("resultBody");
  body.innerHTML = "";

  rows.forEach((r, index)=>{
    body.innerHTML += `
      <tr>
        <td>${index + 1}</td>
        <td><input value="${safe(r["الاسم"])}" onchange="rows[${index}]['الاسم']=this.value"></td>
        <td><input value="${safe(r["التولد"])}" onchange="rows[${index}]['التولد']=this.value"></td>
        <td><input value="${safe(r["الجنس"])}" onchange="rows[${index}]['الجنس']=this.value"></td>
        <td><input value="${safe(r["رقم الجواز"])}" onchange="rows[${index}]['رقم الجواز']=this.value"></td>
        <td><input value="${safe(r["Name En"])}" onchange="rows[${index}]['Name En']=this.value"></td>
      </tr>
    `;
  });
}

function safe(v){
  return String(v || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function downloadExcel(){
  if(rows.length === 0){
    alert("يرجى تشغيل OCR أولاً");
    return;
  }

  const finalRows = rows.map((r, i)=>({
    "#": i + 1,
    "الاسم": r["الاسم"],
    "التولد": r["التولد"],
    "الجنس": r["الجنس"],
    "رقم الجواز": r["رقم الجواز"],
    "Name En": r["Name En"]
  }));

  const ws = XLSX.utils.json_to_sheet(finalRows, {
    header:["#","الاسم","التولد","الجنس","رقم الجواز","Name En"]
  });

  ws["!cols"] = [
    {wch:5},
    {wch:32},
    {wch:16},
    {wch:10},
    {wch:18},
    {wch:35}
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Umrah");

  XLSX.writeFile(wb, "umrah-ministry-form.xlsx");
}
</script>

</body>
</html>
