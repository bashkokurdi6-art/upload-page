<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام OCR خوێندنەوەی پاسپۆرت بۆ خشتە</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family: Tahoma, Arial, sans-serif;
  background:#eef3f0;
  padding:15px;
}
.card{
  max-width:1200px;
  margin:auto;
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 5px 20px #0002;
}
h2{text-align:center;color:#075c3b}
input,button,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}
button{
  background:#087046;
  color:white;
  border:0;
  font-weight:bold;
  cursor: pointer;
}
button:disabled{background:#888; cursor:not-allowed;}
textarea{
  height:120px;
  direction:ltr;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
  font-size:14px;
}
th{
  background:#087046;
  color:white;
}
td input{
  border:0;
  padding:6px;
  text-align:center;
  width:95%;
}
.status{
  color:#075c3b;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <h2>نظام OCR خوێندنەوەی پاسپۆرت و دابەشکردنی سەر خشتە (نوێکراوە)</h2>

  <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png">

  <button id="ocrBtn" onclick="processPassport()">خوێندنەوەی پاسپۆرت و زیادکردن بۆ خشتە</button>
  <button onclick="downloadExcel()">داونلۆدکردنی Excel</button>

  <p class="status" id="status">وێنەی پاسپۆرت (JPG/PNG) یان فایلی PDF دیاری بکە...</p>

  <h3>دەقی خاوێنکراوەی پاسپۆرتی کۆتا کەس</h3>
  <textarea id="rawText" placeholder="دەقی دۆزراوە لێرە پیشان دەدرێت..."></textarea>

  <h3>النتيجة / خشتەی کۆکراوەی حاجیان</h3>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>ناو / الاسم (عەرەبی)</th>
        <th>ساڵا / التولد</th>
        <th>ڕەگەز / الجنس</th>
        <th>سیفەت / الصفة</th>
        <th>رقم الجواز</th>
        <th>Name En - ئینگلیزی</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>
</div>

<script>
const OCR_API_KEY = "K88841321188957"; 
let rows = []; // لێرەدا هەموو پاسپۆرتەکان یەک لە دوای یەک خەزن دەبن و ڕیز دەبن

// فانکشن بۆ گۆڕینی فایل بۆ جۆری Base64 تا سێرڤەر بە ۱۰۰٪ بیخوێنێتەوە
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });
}

async function processPassport(){
  const file = document.getElementById("fileInput").files[0];
  const status = document.getElementById("status");
  const btn = document.getElementById("ocrBtn");

  if(!file){
    alert("تکایە سەرەتا وێنەی پاسپۆرتەکە دیاری بکە");
    return;
  }

  btn.disabled = true;
  status.style.color = "#075c3b";
  
  try {
    status.innerText = "ئامادەکردنی فایل و گۆڕینی فۆرمات...";
    const base64Data = await fileToBase64(file);

    // قۆناغی ١: خوێندنەوە بە زمانی ئینگلیزی (بۆ ناوی ئینگلیزی، پاسپۆرت، تەمەن)
    status.innerText = "قۆناغی ١: خوێندنەوەی دەقە ئینگلیزییەکانی پاسپۆرت...";
    const engText = await callOCR(base64Data, "eng", "2");

    // قۆناغی ٢: خوێندنەوە بە زمانی عەرەبی (بۆ ناوی عەرەبی)
    status.innerText = "قۆناغی ٢: خوێندنەوەی ناوی عەرەبی...";
    const araText = await callOCR(base64Data, "ara", "1");

    document.getElementById("rawText").value = "--- ENGLISH DATA ---\n" + engText + "\n\n--- ARABIC DATA ---\n" + araText;

    // لێکدانەوەی دەقەکان و زیادکردنی بۆ خشتەکە بەبێ سڕینەوەی دێڕەکانی پێشوو
    extractAndAddPassport(engText, araText);
    renderTable();
    
    status.innerText = "پاسپۆرتەکە بە سەرکەوتوویی خوێندرایەوە و زیادکرا بۆ خشتەکە! ✅";
    document.getElementById("fileInput").value = ""; // خاوێنکردنەوەی شوێنی فایل بۆ پاسپۆرتی داهاتوو

  } catch(e) {
    console.error(e);
    status.style.color = "red";
    status.innerText = "هەڵەیەک ڕوویدا: " + e.message;
  }
  btn.disabled = false;
}

async function callOCR(base64Data, lang, engine) {
  const formData = new FormData();
  formData.append("apikey", OCR_API_KEY);
  formData.append("base64Image", base64Data); // بەکارهێنانی مۆدێلی پارێزراوی Base64
  formData.append("language", lang);
  formData.append("OCREngine", engine);
  formData.append("scale", "true");

  const res = await fetch("https://api.ocr.space/parse/image", {
    method: "POST",
    body: formData
  });
  const data = await res.json();
  if(data.IsErroredOnProcessing) {
    throw new Error(data.ErrorMessage);
  }
  return data.ParsedResults && data.ParsedResults.length > 0 ? data.ParsedResults[0].ParsedText : "";
}

function extractAndAddPassport(engText, araText) {
  // ١. دۆزینەوەی ژمارەی پاسپۆرت
  const passportMatch = engText.match(/\b[A-Z][0-9]{7,8}\b/i);
  const passport = passportMatch ? passportMatch[0].toUpperCase() : "";

  // ٢. دۆزینەوەی ساڵی لەدایکبوون لەسەر بنەمای کۆدی نێودەوڵەتی پاسپۆرت (MRZ)
  const birthMatch = engText.match(/\b\d{2}[01]\d[0-3]\d\b/); 
  let birth = "";
  if(birthMatch) {
      let rawBirth = birthMatch[0];
      let yearPrefix = parseInt(rawBirth.substring(0,2)) > 26 ? "19" : "20"; // بۆ دیاریکردنی سەدە
      birth = rawBirth.substring(4,6) + "/" + rawBirth.substring(2,4) + "/" + yearPrefix + rawBirth.substring(0,2);
  } else {
      const altBirth = engText.match(/\b\d{1,2}[-\/ ]\d{1,2}[-\/ ]\d{2,4}\b/);
      birth = altBirth ? altBirth[0] : "";
  }

  // ٣. دەرهێنانی ناوی ئینگلیزی سیانی یان چواری لە هێڵەکانی خوارەوەی پاسپۆرت
  let nameEn = "";
  const mrzLines = engText.split("\n").filter(l => l.includes("<<"));
  if(mrzLines.length > 0) {
      nameEn = mrzLines[0].replace(/P<[A-Z]{3}/g, "").replace(/</g, " ").replace(/\s+/g, " ").trim();
  } else {
      const altEn = engText.match(/[A-Z]{3,}(?:\s+[A-Z]{2,}){2,4}/);
      nameEn = altEn ? altEn[0] : "";
  }

  // ٤. دەرهێنانی ناوی عەرەبی لە بەشە عەرەبییەکەوە
  let nameAr = "";
  const araLines = araText.split("\n").map(x => x.trim());
  for(let line of araLines) {
      if (/[\u0600-\u06FF]/.test(line) && line.split(" ").length >= 3 && !line.includes("جمهورية") && !line.includes("جواز")) {
          nameAr = line.replace(/[^\u0600-\u06FF\s]/g, "").trim();
          break;
      }
  }

  // ٥. دیاریکردنی ڕەگەز
  let gender = "نكر";
  if (engText.includes("<F<") || engText.includes(" F ") || araText.includes("أنثى") || araText.includes("انثى")) {
      gender = "أنثى";
  }

  // زانیارییەکان دەخرێنە ناو خشتەکەوە
  rows.push({
    "الاسم": nameAr || "پێویستی بە نووسینە ✏️",
    "التولد": birth || "پێویستی بە نووسینە ✏️",
    "الجنس": gender,
    "الصفة": "معتمر",
    "رقم الجواز": passport || "پێویستی بە نووسینە ✏️",
    "Name En": nameEn || "پێویستی بە نووسینە ✏️"
  });
}

function updateCell(index, field, value) {
  if(rows[index]) {
    rows[index][field] = value;
  }
}

function renderTable(){
  const body = document.getElementById("resultBody");
  body.innerHTML = "";

  rows.forEach((r, index)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td>${index + 1}</td>
        <td><input type="text" value="${safe(r["الاسم"])}" oninput="updateCell(${index}, 'الاسم', this.value)"></td>
        <td><input type="text" value="${safe(r["التولد"])}" oninput="updateCell(${index}, 'التولد', this.value)"></td>
        <td><input type="text" value="${safe(r["الجنس"])}" oninput="updateCell(${index}, 'الجنس', this.value)"></td>
        <td><input type="text" value="${safe(r["الصفة"])}" oninput="updateCell(${index}, 'الصفة', this.value)"></td>
        <td><input type="text" value="${safe(r["رقم الجواز"])}" oninput="updateCell(${index}, 'رقم الجواز', this.value)"></td>
        <td><input type="text" value="${safe(r["Name En"])}" oninput="updateCell(${index}, 'Name En', this.value)" style="direction:ltr; text-align:left;"></td>
    `;
    body.appendChild(tr);
  });
}

function safe(v){
  return String(v || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function downloadExcel(){
  if(rows.length === 0){
    alert("هیچ زانیارییەک لە خشتەکەدا نییە بۆ داونلۆدکردن");
    return;
  }

  const finalRows = rows.map((r, i)=>({
    "#": i + 1,
    "ناو / الاسم": r["الاسم"],
    "ساڵا / التولد": r["التولد"],
    "ڕەگەز / الجنس": r["الجنس"],
    "سیفەت / الصفة": r["الصفة"],
    "ژمارەی پاسپۆرت / رقم الجواز": r["رقم الجواز"],
    "Name En": r["Name En"]
  }));

  const ws = XLSX.utils.json_to_sheet(finalRows);
  ws['!views'] = [{RTL: true}]; 
  ws["!cols"] = [{wch:5}, {wch:30}, {wch:15}, {wch:12}, {wch:12}, {wch:18}, {wch:35}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Umrah List");
  XLSX.writeFile(wb, "umrah_passports_list.xlsx");
}
</script>

</body>
</html>
