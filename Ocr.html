<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قێنەری پاسپۆرت بۆ ئێکسڵ - OCR</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family: Tahoma, Arial, sans-serif;
  background:#f0f4f8;
  padding:15px;
}
.card{
  max-width:1100px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 5px 20px #0001;
}
h2{text-align:center;color:#1e3a8a}
input,button,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}
button{
  background:#2563eb;
  color:white;
  border:0;
  font-weight:bold;
  cursor: pointer;
}
button:disabled{background:#888; cursor: not-allowed;}
textarea{
  height:150px;
  direction:ltr;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
  font-size:14px;
}
th{
  background:#1e3a8a;
  color:white;
}
td input{
  border:0;
  padding:6px;
  text-align:center;
  width: 90%;
  font-size: 14px;
}
.status{
  color:#2563eb;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <h2>سیستەمی OCR بۆ خوێندنەوەی پاسپۆرت و گۆڕینی بۆ Excel</h2>

  <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,image/jpeg,image/png,application/pdf">

  <button id="ocrBtn" onclick="runOCR()">قراءەی پاسپۆرت OCR</button>
  <button onclick="downloadExcel()">داونلۆدکردنی Excel</button>

  <p class="status" id="status">وێنەی پاسپۆرتەکە دیاری بکە (JPG یان PDF)...</p>

  <h3>دەقی خاو (Raw Text)</h3>
  <textarea id="rawText"></textarea>

  <h3>زانیارییە دۆزراوەکان</h3>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>ناو (عەرەبی/کوردی)</th>
        <th>Name (En)</th>
        <th>رقم الجواز (Passport No)</th>
        <th>التولد (DOB)</th>
        <th>الجنس (Sex)</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>
</div>

<script>
const OCR_API_KEY = "K88841321188957";
let rows = [];

async function runOCR(){
  const file = document.getElementById("fileInput").files[0];
  const status = document.getElementById("status");
  const btn = document.getElementById("ocrBtn");

  if(!file){
    alert("تکایه وێنەیەک یان فایلی پاسپۆرت دیاری بکە");
    return;
  }

  rows = [];
  renderTable();

  status.innerText = "جاری خوێندنەوەی پاسپۆرت...";
  btn.disabled = true;

  try{
    const formData = new FormData();
    formData.append("apikey", OCR_API_KEY);
    formData.append("file", file);
    formData.append("language", "ara"); // بۆ ئەوەی ناوی عەرەبیش بخوێنێتەوە
    formData.append("OCREngine", "2");
    formData.append("scale", "true");
    formData.append("detectOrientation", "true");

    if(file.type === "application/pdf") formData.append("filetype", "PDF");
    else formData.append("filetype", "JPG");

    const res = await fetch("https://api.ocr.space/parse/image", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if(data.IsErroredOnProcessing){
      status.innerText = "هەڵە لە سیستەم: " + JSON.stringify(data.ErrorMessage);
      btn.disabled = false;
      return;
    }

    const text = data.ParsedResults.map(x => x.ParsedText || "").join("\n");
    document.getElementById("rawText").value = text;

    // لێرەدا پرۆسەی دەرهێنانی زانیاری پاسپۆرتەکە دەکەین
    const passportData = parsePassport(text);
    if(passportData) {
      rows.push(passportData);
      renderTable();
      status.innerText = "پاسپۆرتەکە بە سەرکەوتوویی خوێندرایەوە! ✅";
    } else {
      status.innerText = "هیچ زانیارییەک نەدۆزرایەوە، دڵنیابەرەوە لە ڕوونی وێنەکە.";
    }

  }catch(e){
    console.error(e);
    status.innerText = "کێشەیەک ڕوویدا: " + e.message;
  }
  btn.disabled = false;
}

function parsePassport(text){
  const lines = text.split("\n").map(x => x.trim());
  let fullText = lines.join(" ");

  // ١. دۆزینەوەی ژمارەی پاسپۆرت (پاسپۆرتی عێراقی بە گشتی بە A یان G دەستپێدەکات لەگەڵ ٧ ژمارە)
  const passportMatch = fullText.match(/\b([A-Z][0-9]{7})\b/i);
  const passportNo = passportMatch ? passportMatch[0].toUpperCase() : "";

  // ٢. دۆزینەوەی ناوی ئینگلیزی لە ڕێگەی دێڕی MRZ (دێڕی خوارەوەی پاسپۆرت کە << تێدایە)
  let nameEn = "";
  const mrzLine = lines.find(l => l.includes("<<") && (l.startsWith("P<") || l.length > 20));
  if(mrzLine){
    // لادانی نیشانە زیادەکان بۆ دەرهێنانی ناوەکە
    let cleanMrz = mrzLine.replace(/^P<[A-Z]{3}/, ""); // لادانی جۆری پاسپۆرت و کۆدی دەوڵەت
    let parts = cleanMrz.split("<<")[0].split("<").filter(x => x.length > 0);
    if(parts.length >= 2){
      nameEn = parts[0] + " " + parts.slice(1).join(" ");
    }
  }

  // ئەگەر لە رێگەی MRZ نەدۆزرایەوە، بە شێوازی ئاسایی دەیدۆزینەوە
  if(!nameEn){
    const enMatch = fullText.match(/[A-Z]{3,}(?:\s+[A-Z]{3,}){2,5}/g);
    if(enMatch) nameEn = enMatch[0];
  }

  // ٣. دۆزینەوەی ناوی عەرەبی (گەڕان بەدوای ٣ یان ٤ ناوی عەرەبی یەکتری بڕاو)
  const arabicMatch = fullText.match(/[\u0600-\u06FF]{3,}(?:\s+[\u0600-\u06FF]{3,}){2,5}/);
  const nameAr = arabicMatch ? arabicMatch[0].trim() : "";

  // ٤. ڕێکەوتی لەدایکبوون (DOB) - گەڕان بەدوای فۆرماتی ڕێکەوتی پاسپۆرت
  const dobMatch = fullText.match(/\b\d{2}[-\/ ]\d{2}[-\/ ]\d{4}\b/) || 
                   fullText.match(/\b\d{2}[A-Za-z]{3}[-\/ ]\d{4}\b/);
  const dob = dobMatch ? dobMatch[0] : "";

  // ٥. دیاریکردنی ڕەگەز
  let gender = "";
  if(/\b(M|MALE|ذكر|نير)\b/i.test(fullText)) gender = "ذكر";
  else if(/\b(F|FEMALE|أنثى|انثى|مێ)\b/i.test(fullText)) gender = "أنثى";

  if(!passportNo && !nameAr && !nameEn) return null;

  return {
    "الاسم": nameAr,
    "Name En": nameEn,
    "رقم الجواز": passportNo,
    "التولد": dob,
    "الجنس": gender
  };
}

function updateCell(index, field, value) {
  if(rows[index]) {
    rows[index][field] = value;
  }
}

function renderTable(){
  const body = document.getElementById("resultBody");
  body.innerHTML = "";

  rows.forEach((r, index)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td>${index + 1}</td>
        <td><input type="text" value="${safe(r["الاسم"])}" oninput="updateCell(${index}, 'الاسم', this.value)"></td>
        <td><input type="text" value="${safe(r["Name En"])}" oninput="updateCell(${index}, 'Name En', this.value)"></td>
        <td><input type="text" value="${safe(r["رقم الجواز"])}" oninput="updateCell(${index}, 'رقم الجواز', this.value)"></td>
        <td><input type="text" value="${safe(r["التولد"])}" oninput="updateCell(${index}, 'التولد', this.value)"></td>
        <td><input type="text" value="${safe(r["الجنس"])}" oninput="updateCell(${index}, 'الجنس', this.value)"></td>
    `;
    body.appendChild(tr);
  });
}

function safe(v){
  return String(v || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function downloadExcel(){
  if(rows.length === 0){
    alert("تکایە سەرەتا پاسپۆرتێک لۆد بکە");
    return;
  }

  const finalRows = rows.map((r, i)=>({
    "#": i + 1,
    "الاسم العربي": r["الاسم"],
    "English Name": r["Name En"],
    "رقم الجواز": r["رقم الجواز"],
    "التولد": r["التولد"],
    "الجنس": r["الجنس"]
  }));

  const ws = XLSX.utils.json_to_sheet(finalRows);
  ws['!views'] = [{RTL: true}]; // پاڵپشتی ڕاست بۆ چەپ

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Passport Data");
  XLSX.writeFile(wb, "passport-data.xlsx");
}
</script>

</body>
</html>
