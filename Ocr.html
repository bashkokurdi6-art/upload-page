<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR بۆ Excel</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f3f5f4;
  padding:20px;
  direction:rtl;
}
.box{
  max-width:900px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 4px 15px #0002;
}
input,button,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:16px;
}
button{
  background:#0b6b3a;
  color:white;
  border:0;
  border-radius:10px;
}
textarea{
  height:220px;
  direction:ltr;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  direction:rtl;
}
th,td{
  border:1px solid #999;
  padding:8px;
  text-align:center;
}
th{
  background:#e9e1c5;
}
</style>
</head>
<body>

<div class="box">
  <h2>خوێندنەوەی سکان و گۆڕین بۆ Excel</h2>

  <input type="file" id="fileInput" accept="image/*,.pdf">

  <button onclick="runOCR()">١- دەقەکە دەربهێنە</button>

  <p id="status">ئامادەیە</p>

  <textarea id="ocrText" placeholder="دەقی OCR لێرە دەردەکەوێت..."></textarea>

  <button onclick="extractData()">٢- جیاکردنەوەی زانیارییەکان</button>
  <button onclick="downloadExcel()">٣- دابەزاندنی Excel</button>

  <table id="dataTable">
    <thead>
      <tr>
        <th>#</th>
        <th>ناوی عەرەبی</th>
        <th>ناوی ئینگلیزی</th>
        <th>پاسپۆرت</th>
        <th>ڕەگەز</th>
        <th>بەرواری لەدایکبوون</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const API_KEY = "K88841321188957";
let extractedRows = [];

async function runOCR(){
  const file = document.getElementById("fileInput").files[0];
  if(!file){
    alert("تکایە وێنە یان PDF هەڵبژێرە");
    return;
  }

  document.getElementById("status").innerText = "چاوەڕێ بکە... OCR کاردەکات";

  const formData = new FormData();
  formData.append("apikey", API_KEY);
  formData.append("language", "ara");
  formData.append("isOverlayRequired", "false");
  formData.append("OCREngine", "2");
  formData.append("file", file);

  try{
    const res = await fetch("https://api.ocr.space/parse/image", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if(data.IsErroredOnProcessing){
      alert("هەڵە: " + data.ErrorMessage);
      document.getElementById("status").innerText = "هەڵە ڕوویدا";
      return;
    }

    const text = data.ParsedResults[0].ParsedText;
    document.getElementById("ocrText").value = text;
    document.getElementById("status").innerText = "OCR تەواو بوو ✅";

  }catch(err){
    console.error(err);
    alert("کێشەیەک ڕوویدا");
    document.getElementById("status").innerText = "هەڵە";
  }
}

function extractData(){
  const text = document.getElementById("ocrText").value;
  const lines = text.split(/\n/).map(x => x.trim()).filter(x => x);

  extractedRows = [];

  let passportRegex = /[A-Z][0-9]{7,9}/g;
  let dateRegex = /\d{1,2}[-\/][A-Za-z]{3}[-\/]\d{2,4}|\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}/g;

  for(let i = 0; i < lines.length; i++){
    let line = lines[i];

    let passportMatch = line.match(passportRegex);
    let dateMatch = line.match(dateRegex);

    if(passportMatch){
      let passport = passportMatch[0];
      let birth = dateMatch ? dateMatch[0] : "";

      let englishName = "";
      let arabicName = "";
      let gender = "";

      for(let j = Math.max(0, i-3); j <= Math.min(lines.length-1, i+3); j++){
        if(/[A-Z]{3,}/.test(lines[j]) && !lines[j].match(passportRegex)){
          englishName = lines[j];
        }
        if(/[\u0600-\u06FF]/.test(lines[j])){
          arabicName = lines[j];
        }
      }

      if(line.includes("ذكر") || line.includes("نكر")) gender = "ذكر";
      if(line.includes("انثى") || line.includes("أنثى")) gender = "أنثى";

      extractedRows.push({
        "#": extractedRows.length + 1,
        "ناوی عەرەبی": arabicName,
        "ناوی ئینگلیزی": englishName,
        "پاسپۆرت": passport,
        "ڕەگەز": gender,
        "بەرواری لەدایکبوون": birth
      });
    }
  }

  renderTable();
}

function renderTable(){
  const tbody = document.querySelector("#dataTable tbody");
  tbody.innerHTML = "";

  extractedRows.forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row["#"]}</td>
      <td>${row["ناوی عەرەبی"]}</td>
      <td>${row["ناوی ئینگلیزی"]}</td>
      <td>${row["پاسپۆرت"]}</td>
      <td>${row["ڕەگەز"]}</td>
      <td>${row["بەرواری لەدایکبوون"]}</td>
    `;
    tbody.appendChild(tr);
  });

  if(extractedRows.length === 0){
    alert("هیچ زانیارییەک جیا نەکرایەوە. دەقی OCR پێویستی بە چاککردنەوە هەیە.");
  }
}

function downloadExcel(){
  if(extractedRows.length === 0){
    alert("سەرەتا زانیارییەکان جیا بکەوە");
    return;
  }

  const ws = XLSX.utils.json_to_sheet(extractedRows);
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "Manifest");

  XLSX.writeFile(wb, "manifest.xlsx");
}
</script>

</body>
</html>
