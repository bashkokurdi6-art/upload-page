<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام OCR خوێندنەوەی پاسپۆرت بۆ خشتە</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family: Tahoma, Arial, sans-serif;
  background:#eef3f0;
  padding:15px;
}
.card{
  max-width:1200px;
  margin:auto;
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 5px 20px #0002;
}
h2{text-align:center;color:#075c3b}
input,button,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
}
button{
  background:#087046;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  background:#888;
  cursor:not-allowed;
}
textarea{
  height:130px;
  direction:ltr;
}
.table-wrap{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  min-width:900px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
  font-size:14px;
}
th{
  background:#087046;
  color:white;
}
td input{
  border:0;
  padding:6px;
  text-align:center;
  width:95%;
}
.status{
  color:#075c3b;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <h2>نظام OCR خوێندنەوەی پاسپۆرت و دابەشکردنی سەر خشتە</h2>

  <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png">

  <button id="ocrBtn" onclick="processPassport()">خوێندنەوەی پاسپۆرت و زیادکردن بۆ خشتە</button>
  <button onclick="downloadExcel()">داونلۆدکردنی Excel</button>

  <p class="status" id="status">وێنەی پاسپۆرت JPG/PNG یان فایلی PDF دیاری بکە...</p>

  <h3>دەقی خاوێنکراوەی پاسپۆرتی کۆتا کەس</h3>
  <textarea id="rawText" placeholder="دەقی دۆزراوە لێرە پیشان دەدرێت..."></textarea>

  <h3>النتيجة / خشتەی کۆکراوەی حاجیان</h3>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>ناو / الاسم عەرەبی</th>
          <th>ساڵا / التولد</th>
          <th>ڕەگەز / الجنس</th>
          <th>سیفەت / الصفة</th>
          <th>رقم الجواز</th>
          <th>Name En</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>
</div>

<script>
const OCR_API_KEY = "K88841321188957";
let rows = [];

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = ()=>{
      const base64String = reader.result.split(",")[1];
      resolve(base64String);
    };
    reader.onerror = error => reject(error);
  });
}

async function processPassport(){
  const file = document.getElementById("fileInput").files[0];
  const status = document.getElementById("status");
  const btn = document.getElementById("ocrBtn");

  if(!file){
    alert("تکایە سەرەتا وێنە یان PDF دیاری بکە");
    return;
  }

  btn.disabled = true;
  status.style.color = "#075c3b";

  try{
    status.innerText = "پرۆسێس کردنی فایل...";
    const base64Raw = await fileToBase64(file);

    status.innerText = "خوێندنەوەی زانیارییە ئینگلیزییەکان...";
    const engText = await callOCR(base64Raw, "eng", "2", file.type);

    status.innerText = "خوێندنەوەی زانیارییە عەرەبییەکان...";
    const araText = await callOCR(base64Raw, "ara", "1", file.type);

    document.getElementById("rawText").value =
      "--- ENGLISH DATA ---\n" + engText +
      "\n\n--- ARABIC DATA ---\n" + araText;

    extractAndAddPassport(engText, araText);
    renderTable();

    status.innerText = "پاسپۆرت/PDF بە سەرکەوتوویی خوێندرایەوە ✅";
    document.getElementById("fileInput").value = "";

  }catch(e){
    console.error(e);
    status.style.color = "red";
    status.innerText = "هەڵە ڕوویدا: " + e.message;
  }

  btn.disabled = false;
}

async function callOCR(base64Raw, lang, engine, fileType){
  const formData = new FormData();

  let mime = "image/jpeg";
  if(fileType === "application/pdf") mime = "application/pdf";
  if(fileType === "image/png") mime = "image/png";
  if(fileType === "image/jpeg" || fileType === "image/jpg") mime = "image/jpeg";

  formData.append("apikey", OCR_API_KEY);
  formData.append("base64Image", `data:${mime};base64,${base64Raw}`);
  formData.append("language", lang);
  formData.append("OCREngine", engine);
  formData.append("scale", "true");
  formData.append("isTable", "false");

  const res = await fetch("https://api.ocr.space/parse/image", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  if(data.IsErroredOnProcessing){
    let msg = data.ErrorMessage || data.ErrorDetails || "OCR API Error";
    if(Array.isArray(msg)) msg = msg.join(" - ");
    throw new Error(msg);
  }

  return data.ParsedResults && data.ParsedResults.length > 0
    ? data.ParsedResults[0].ParsedText
    : "";
}

function extractAndAddPassport(engText, araText){

  const allText = engText + "\n" + araText;

  let passport = "";
  const passportMatch = allText.match(/\b[A-Z][0-9]{7,8}\b/i);
  if(passportMatch){
    passport = passportMatch[0].toUpperCase();
  }

  let birth = "";
  const mrzDateMatch = engText.match(/\b\d{6}\b/g);

  if(mrzDateMatch && mrzDateMatch.length > 0){
    for(let d of mrzDateMatch){
      const yy = parseInt(d.substring(0,2));
      const mm = parseInt(d.substring(2,4));
      const dd = parseInt(d.substring(4,6));

      if(mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31){
        const yearPrefix = yy > 26 ? "19" : "20";
        birth =
          String(dd).padStart(2,"0") + "/" +
          String(mm).padStart(2,"0") + "/" +
          yearPrefix + String(yy).padStart(2,"0");
        break;
      }
    }
  }

  if(!birth){
    const altBirth = allText.match(/\b\d{1,2}[-\/ ]\d{1,2}[-\/ ]\d{2,4}\b/);
    birth = altBirth ? altBirth[0] : "";
  }

  let nameEn = "";
  const lines = engText.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const mrzLine = lines.find(l => l.includes("<<"));

  if(mrzLine){
    nameEn = mrzLine
      .replace(/^P<+[A-Z]{3}/, "")
      .replace(/</g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  if(!nameEn){
    const altEn = engText.match(/[A-Z]{3,}(?:\s+[A-Z]{2,}){1,5}/);
    nameEn = altEn ? altEn[0].trim() : "";
  }

  let nameAr = "";
  const araLines = araText.split(/\r?\n/).map(x => x.trim()).filter(Boolean);

  for(let line of araLines){
    if(
      /[\u0600-\u06FF]/.test(line) &&
      line.split(/\s+/).length >= 2 &&
      !line.includes("جمهورية") &&
      !line.includes("جواز") &&
      !line.includes("العراق") &&
      !line.includes("Passport") &&
      !line.includes("تاريخ") &&
      !line.includes("مكان") &&
      !line.includes("الجنس")
    ){
      nameAr = line.replace(/[^\u0600-\u06FF\s]/g, "").replace(/\s+/g," ").trim();
      break;
    }
  }

  let gender = "ذكر";

  if(
    engText.includes("<F<") ||
    engText.includes(" F ") ||
    engText.includes("FEMALE") ||
    araText.includes("أنثى") ||
    araText.includes("انثى")
  ){
    gender = "أنثى";
  }

  if(
    engText.includes("<M<") ||
    engText.includes(" M ") ||
    engText.includes("MALE") ||
    araText.includes("ذكر")
  ){
    gender = "ذكر";
  }

  rows.push({
    "الاسم": nameAr || "پێویستی بە چاککردنە ✏️",
    "التولد": birth || "پێویستی بە چاککردنە ✏️",
    "الجنس": gender,
    "الصفة": "معتمر",
    "رقم الجواز": passport || "پێویستی بە چاککردنە ✏️",
    "Name En": nameEn || "پێویستی بە چاککردنە ✏️"
  });
}

function updateCell(index, field, value){
  if(rows[index]){
    rows[index][field] = value;
  }
}

function renderTable(){
  const body = document.getElementById("resultBody");
  body.innerHTML = "";

  rows.forEach((r, index)=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${index + 1}</td>
      <td><input type="text" value="${safe(r["الاسم"])}" oninput="updateCell(${index}, 'الاسم', this.value)"></td>
      <td><input type="text" value="${safe(r["التولد"])}" oninput="updateCell(${index}, 'التولد', this.value)"></td>
      <td><input type="text" value="${safe(r["الجنس"])}" oninput="updateCell(${index}, 'الجنس', this.value)"></td>
      <td><input type="text" value="${safe(r["الصفة"])}" oninput="updateCell(${index}, 'الصفة', this.value)"></td>
      <td><input type="text" value="${safe(r["رقم الجواز"])}" oninput="updateCell(${index}, 'رقم الجواز', this.value)"></td>
      <td><input type="text" value="${safe(r["Name En"])}" oninput="updateCell(${index}, 'Name En', this.value)" style="direction:ltr;text-align:left;"></td>
    `;

    body.appendChild(tr);
  });
}

function safe(v){
  return String(v || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function downloadExcel(){
  if(rows.length === 0){
    alert("هیچ زانیارییەک لە خشتەکەدا نییە");
    return;
  }

  const finalRows = rows.map((r, i)=>({
    "#": i + 1,
    "ناو / الاسم": r["الاسم"],
    "ساڵا / التولد": r["التولد"],
    "ڕەگەز / الجنس": r["الجنس"],
    "سیفەت / الصفة": r["الصفة"],
    "ژمارەی پاسپۆرت / رقم الجواز": r["رقم الجواز"],
    "Name En": r["Name En"]
  }));

  const ws = XLSX.utils.json_to_sheet(finalRows);

  ws["!views"] = [{RTL:true}];
  ws["!cols"] = [
    {wch:5},
    {wch:30},
    {wch:15},
    {wch:12},
    {wch:12},
    {wch:20},
    {wch:35}
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Umrah List");
  XLSX.writeFile(wb, "umrah_passports_list.xlsx");
}
</script>

</body>
</html>
