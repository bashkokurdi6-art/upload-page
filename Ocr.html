<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR خوێندنەوەی سکان</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f3f5f4;
  padding:20px;
  direction:rtl;
}
.box{
  max-width:700px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 4px 15px #0002;
}
button,input{
  width:100%;
  padding:14px;
  margin:10px 0;
  font-size:18px;
}
button{
  background:#0b6b3a;
  color:white;
  border:0;
  border-radius:10px;
}
#preview{
  width:100%;
  max-height:400px;
  object-fit:contain;
  border:1px solid #ddd;
  margin-top:10px;
}
textarea{
  width:100%;
  height:300px;
  margin-top:15px;
  font-size:16px;
  direction:ltr;
}
</style>
</head>

<body>

<div class="box">
  <h2>خوێندنەوەی سکان بە OCR</h2>

  <input type="file" id="imageInput" accept="image/*">
  <img id="preview" style="display:none">

  <button onclick="readImage()">دەقەکە دەربهێنە</button>

  <p id="status">ئامادەیە</p>

  <textarea id="result" placeholder="دەقەکە لێرە دەردەکەوێت..."></textarea>
</div>

<script>
let selectedImage = null;

document.getElementById("imageInput").addEventListener("change", function(e){
  selectedImage = e.target.files[0];

  if(selectedImage){
    const url = URL.createObjectURL(selectedImage);
    const preview = document.getElementById("preview");
    preview.src = url;
    preview.style.display = "block";
  }
});

async function readImage(){
  if(!selectedImage){
    alert("تکایە وێنەیەک هەڵبژێرە");
    return;
  }

  document.getElementById("status").innerText = "چاوەڕێ بکە... OCR کاردەکات";
  document.getElementById("result").value = "";

  try{
    const worker = await Tesseract.createWorker(["eng","ara"]);

    const ret = await worker.recognize(selectedImage);

    document.getElementById("result").value = ret.data.text;
    document.getElementById("status").innerText = "تەواو بوو ✅";

    await worker.terminate();
  }catch(err){
    console.error(err);
    document.getElementById("status").innerText = "هەڵە ڕوویدا";
    alert("کێشەیەک ڕوویدا، وێنەکە ڕوونتر بکە یان دوبارە هەوڵبدە");
  }
}
</script>

</body>
</html>
