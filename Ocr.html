<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سیستەمی خوێندنەوەی پاسپۆرت بۆ خشتە</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family: Tahoma, Arial, sans-serif;
  background:#eef3f0;
  padding:15px;
}
.card{
  max-width:1200px;
  margin:auto;
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 5px 20px #0002;
}
h2{text-align:center;color:#075c3b}
input,button,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}
button{
  background:#087046;
  color:white;
  border:0;
  font-weight:bold;
  cursor: pointer;
}
button:disabled{background:#888; cursor:not-allowed;}
textarea{
  height:100px;
  direction:ltr;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
  font-size:14px;
}
th{
  background:#087046;
  color:white;
}
td input{
  border:0;
  padding:6px;
  text-align:center;
  width:95%;
}
.status{
  color:#075c3b;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <h2>نظام OCR خوێندنەوەی پاسپۆرت و دابەشکردنی سەر خشتە</h2>

  <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png">

  <button id="ocrBtn" onclick="processPassport()">خوێندنەوەی پاسپۆرت (OCR)</button>
  <button onclick="downloadExcel()">داونلۆدکردنی Excel</button>

  <p class="status" id="status">وێنەی پاسپۆرت (JPG/PNG) یان فایلی PDF دیاری بکە...</p>

  <h3>دەقی خوێندراوەی پاسپۆرت</h3>
  <textarea id="rawText" placeholder="دەقی دۆزراوە لێرە پیشان دەدرێت..."></textarea>

  <h3>النتيجة / خشتەی دابەشکراو</h3>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>ناو / الاسم (عەرەبی)</th>
        <th>ساڵا / التولد</th>
        <th>ڕەگەز / الجنس</th>
        <th>سیفەت / الصفة</th>
        <th>رقم الجواز</th>
        <th>Name En - ئینگلیزی</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>
</div>

<script>
const OCR_API_KEY = "K88841321188957"; 
let rows = [];

async function processPassport(){
  const file = document.getElementById("fileInput").files[0];
  const status = document.getElementById("status");
  const btn = document.getElementById("ocrBtn");

  if(!file){
    alert("تکایە سەرەتا وێنەی پاسپۆرتەکە دیاری بکە");
    return;
  }

  rows = [];
  renderTable();
  btn.disabled = true;
  
  try {
    // قۆناغی ١: خوێندنەوەی بەشە ئینگلیزییەکە (بۆ پاسپۆرت، ناوی ئینگلیزی و تەمەن)
    status.innerText = "قۆناغی ١: خوێندنەوەی بەشە ئینگلیزییەکەی پاسپۆرت...";
    const engText = await callOCR(file, "eng", "2");

    // قۆناغی ٢: خوێندنەوەی بەشە عەرەبییەکە (بۆ ناوی عەرەبی)
    status.innerText = "قۆناغی ٢: خوێندنەوەی بەشە عەرەبییەکەی پاسپۆرت...";
    const araText = await callOCR(file, "ara", "1");

    document.getElementById("rawText").value = "--- ENGLISH DATA ---\n" + engText + "\n\n--- ARABIC DATA ---\n" + araText;

    // لێکدانەوە و دابەشکردنی زانیارییەکان بۆ ناو خشتە
    extractPassportData(engText, araText);
    renderTable();
    
    if(rows.length > 0) {
        status.innerText = "پاسپۆرتەکە بە سەرکەوتوویی خوێندرایەوە و زانیارییەکان دابەشکران! ✅";
    } else {
        status.innerText = "پاسپۆرتەکە خوێندرایەوە بەڵام زانیارییەکان جیا نەکراونەوە. دڵنیابەرەوە لە ڕوونی وێنەکە.";
    }

  } catch(e) {
    console.error(e);
    status.innerText = "هەڵەیەک ڕوویدا: " + e.message;
  }
  btn.disabled = false;
}

async function callOCR(file, lang, engine) {
  const formData = new FormData();
  formData.append("apikey", OCR_API_KEY);
  formData.append("file", file);
  formData.append("language", lang);
  formData.append("OCREngine", engine);
  formData.append("scale", "true");

  const res = await fetch("https://api.ocr.space/parse/image", {
    method: "POST",
    body: formData
  });
  const data = await res.json();
  if(data.IsErroredOnProcessing) {
    throw new Error(data.ErrorMessage);
  }
  return data.ParsedResults && data.ParsedResults.length > 0 ? data.ParsedResults[0].ParsedText : "";
}

function extractPassportData(engText, araText) {
  // ١. دەرهێنانی ژمارەی پاسپۆرت (پیتێک و ۷ یان ۸ ژمارە)
  const passportMatch = engText.match(/\b[A-Z][0-9]{7,8}\b/i);
  const passport = passportMatch ? passportMatch[0].toUpperCase() : "نەبستراو";

  // ٢. دەرهێنانی ڕێکەوتی لەدایکبوون (کۆدی پاسپۆرتی نێودەوڵەتی لە خوارەوە)
  const birthMatch = engText.match(/\b\d{2}[01]\d[0-3]\d\b/); 
  let birth = "";
  if(birthMatch) {
      let rawBirth = birthMatch[0];
      birth = "19" + rawBirth.substring(0,2) + "/" + rawBirth.substring(2,4) + "/" + rawBirth.substring(4,6);
  } else {
      // ئەگەر لە دەقەکەدا ئاسایی دۆزرایەوە
      const altBirth = engText.match(/\b\d{1,2}[-\/ ]\d{1,2}[-\/ ]\d{2,4}\b/);
      birth = altBirth ? altBirth[0] : "";
  }

  // ٣. دەرهێنانی ناوی ئینگلیزی (پاسپۆرت هێڵی خوارەوەی هەیە وەک P<IRQ...)
  let nameEn = "";
  const mrzLines = engText.split("\n").filter(l => l.includes("<<"));
  if(mrzLines.length > 0) {
      let cleanLine = mrzLines[0].replace(/P<[A-Z]{3}/g, "").replace(/</g, " ").trim();
      nameEn = cleanLine.replace(/\s+/g, " ").trim();
  } else {
      const altEn = engText.match(/[A-Z]{3,}(?:\s+[A-Z]{2,}){1,4}/);
      nameEn = altEn ? altEn[0] : "";
  }

  // ٤. دەرهێنانی ناوی عەرەبی لە دەقە عەرەبییەکەوە
  let nameAr = "";
  const araLines = araText.split("\n").map(x => x.trim()).filter(x => x.length > 5);
  for(let line of araLines) {
      // فلتەرکردنی دێڕێک کە تەنها ناوی سیانی یان چواری عەرەبی تێدایە
      if (/[\u0600-\u06FF]/.test(line) && !line.includes("الجمهورية") && !line.includes("جواز")) {
          nameAr = line.replace(/[^\u0600-\u06FF\s]/g, "").trim();
          if(nameAr.split(" ").length >= 3) break;
      }
  }

  // ٥. ڕەگەز
  let gender = "نكر";
  if (engText.includes(" F ") || engText.includes("<F<") || araText.includes("أنثى") || araText.includes("انثى")) {
      gender = "أنثى";
  }

  rows.push({
    "الاسم": nameAr || "پێویستی بە نووسینە",
    "التولد": birth || "پێویستی بە نووسینە",
    "الجنس": gender,
    "الصفة": "معتمر",
    "رقم الجواز": passport,
    "Name En": nameEn || "پێویستی بە نووسینە"
  });
}

function updateCell(index, field, value) {
  if(rows[index]) {
    rows[index][field] = value;
  }
}

function renderTable(){
  const body = document.getElementById("resultBody");
  body.innerHTML = "";

  rows.forEach((r, index)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td>${index + 1}</td>
        <td><input type="text" value="${safe(r["الاسم"])}" oninput="updateCell(${index}, 'الاسم', this.value)"></td>
        <td><input type="text" value="${safe(r["التولد"])}" oninput="updateCell(${index}, 'التولد', this.value)"></td>
        <td><input type="text" value="${safe(r["الجنس"])}" oninput="updateCell(${index}, 'الجنس', this.value)"></td>
        <td><input type="text" value="${safe(r["الصفة"])}" oninput="updateCell(${index}, 'الصفة', this.value)"></td>
        <td><input type="text" value="${safe(r["رقم الجواز"])}" oninput="updateCell(${index}, 'رقم الجواز', this.value)"></td>
        <td><input type="text" value="${safe(r["Name En"])}" oninput="updateCell(${index}, 'Name En', this.value)" style="direction:ltr; text-align:left;"></td>
    `;
    body.appendChild(tr);
  });
}

function safe(v){
  return String(v || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function downloadExcel(){
  if(rows.length === 0){
    alert("تکایە سەرەتا پرۆسەی OCR بکە");
    return;
  }

  const finalRows = rows.map((r, i)=>({
    "#": i + 1,
    "ناو / الاسم": r["الاسم"],
    "ساڵا / التولد": r["التولد"],
    "ڕەگەز / الجنس": r["الجنس"],
    "سیفەت / الصفة": r["الصفة"],
    "ژمارەی پاسپۆرت / رقم الجواز": r["رقم الجواز"],
    "Name En": r["Name En"]
  }));

  const ws = XLSX.utils.json_to_sheet(finalRows);
  ws['!views'] = [{RTL: true}]; 
  ws["!cols"] = [{wch:5}, {wch:30}, {wch:15}, {wch:12}, {wch:12}, {wch:18}, {wch:35}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Umrah Passport");
  XLSX.writeFile(wb, "passport_detected.xlsx");
}
</script>

</body>
</html>
