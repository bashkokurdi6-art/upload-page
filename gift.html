<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>🎁 دیاری مانگانە</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{

background:
linear-gradient(to bottom,
#07140c,
#0f5132);

color:white;

min-height:100vh;

padding:20px;

padding-bottom:100px;
}

.title{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(212,175,55,.3);

padding:25px;

border-radius:20px;

text-align:center;

font-size:32px;

font-weight:bold;

color:#d4af37;

margin-bottom:20px;

backdrop-filter:blur(10px);

box-shadow:
0 0 20px rgba(212,175,55,.1);
}

.board{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(212,175,55,.2);

padding:20px;

border-radius:18px;

margin-bottom:20px;

backdrop-filter:blur(10px);
}

.board h2{

color:#d4af37;

margin-bottom:15px;

font-size:22px;
}

input{

width:100%;

padding:15px;

margin-bottom:12px;

border:none;

border-radius:14px;

background:#123524;

color:white;

font-size:16px;

outline:none;
}

input::placeholder{

color:#ccc;
}

button{

width:100%;

padding:15px;

border:none;

border-radius:14px;

background:#d4af37;

color:black;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;
}

button:hover{

transform:scale(1.02);
}

.user{

background:#123524;

padding:15px;

border-radius:14px;

margin-bottom:10px;

border:
1px solid rgba(212,175,55,.1);
}

.status{

margin-top:15px;

text-align:center;

color:#d4af37;

font-size:15px;
}

.winner{

font-size:20px;

text-align:center;

line-height:2;
}

</style>

</head>

<body>

<div class="title">

🎁 دیاری مانگانە

</div>

<div class="board">

<h2>
🏆 دەرچووی مانگانە
</h2>

<div id="winnerBox"
class="winner">

هیچ براوەیەک نییە

</div>

</div>

<div class="board">

<h2>
📝 بەشداربوون
</h2>

<input type="text"
id="name"
placeholder="ناوی سیانێت">

<input type="text"
id="city"
placeholder="شار">

<input type="number"
id="age"
placeholder="تەمەن">

<input type="text"
id="phone"
placeholder="ژمارە مۆبایل">

<button onclick="sendGift()">

بەشداربە

</button>

<div class="status"
id="status"></div>

</div>

<div class="board">

<h2>
✅ بەشداربووان
</h2>

<div id="users"></div>

</div>

<script>

const SUPABASE_URL =
"https://slllcibigutjivauryvc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function sendGift(){

const name =
document.getElementById("name").value;

const city =
document.getElementById("city").value;

const age =
document.getElementById("age").value;

const phone =
document.getElementById("phone").value;

if(!name || !city || !age || !phone){

alert("هەموو خانەکان پڕبکەرەوە");

return;
}

const { error } =
await client
.from("gift_requests")
.insert([{

full_name:name,

city:city,

age:age,

phone:phone,

status:"pending"

}]);

if(error){

alert("هەڵەیەک ڕوویدا");

console.log(error);

return;
}

document.getElementById("status")
.innerHTML =
"⏳ داواکارییەکەت نێردرا، چاوەڕوانی قبوڵکردنی ئەدمین بکە";

document.getElementById("name").value = "";
document.getElementById("city").value = "";
document.getElementById("age").value = "";
document.getElementById("phone").value = "";

loadUsers();

}

async function loadUsers(){

const { data } =
await client
.from("gift_requests")
.select("*")
.eq("status","approved")
.order("id",{ascending:false});

const users =
document.getElementById("users");

users.innerHTML = "";

if(data.length === 0){

users.innerHTML =
"هیچ بەشداربووێک نییە";

return;
}

data.forEach(user=>{

users.innerHTML += `

<div class="user">

👤
${user.full_name}

<br><br>

📍
${user.city}

<br><br>

🎂
${user.age}

</div>

`;

});

}

async function loadWinner(){

const { data } =
await client
.from("gift_requests")
.select("*")
.eq("status","winner")
.limit(1);

if(data.length > 0){

document.getElementById("winnerBox")
.innerHTML = `

🏆
${data[0].full_name}

<br>

📍
${data[0].city}

<br>

🎂
${data[0].age}

`;

}

}

loadUsers();

loadWinner();

</script>

</body>
</html>
