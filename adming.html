<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>🎁 Admin Gift</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{

background:
linear-gradient(to bottom,
#07140c,
#0f5132);

color:white;

min-height:100vh;

padding:20px;
}

.title{

text-align:center;

font-size:32px;

font-weight:bold;

color:#d4af37;

margin-bottom:25px;
}

.card{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(212,175,55,.2);

padding:20px;

border-radius:18px;

margin-bottom:15px;

backdrop-filter:blur(10px);

box-shadow:
0 0 10px rgba(212,175,55,.08);
}

.name{

font-size:22px;

font-weight:bold;

margin-bottom:12px;

color:#d4af37;
}

.info{

margin-bottom:8px;

font-size:16px;
}

.status{

margin-top:10px;

margin-bottom:15px;

color:#ccc;
}

.buttons{

display:flex;

gap:10px;
}

button{

flex:1;

padding:14px;

border:none;

border-radius:14px;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;
}

button:hover{

transform:scale(1.03);
}

.approve{

background:#d4af37;

color:black;
}

.winner{

background:#198754;

color:white;
}

.delete{

background:#dc3545;

color:white;
}

</style>

</head>

<body>

<div class="title">

🎁 ئەدمینی دیاری مانگانە

</div>

<div id="requests"></div>

<script>

const SUPABASE_URL =
"https://slllcibigutjivauryvc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function loadRequests(){

const { data,error } =
await client
.from("gift_requests")
.select("*")
.order("id",{ascending:false});

if(error){

console.log(error);

return;
}

const box =
document.getElementById("requests");

box.innerHTML = "";

if(data.length === 0){

box.innerHTML =
"هیچ داواکارییەک نییە";

return;
}

data.forEach(user=>{

box.innerHTML += `

<div class="card">

<div class="name">

👤
${user.full_name}

</div>

<div class="info">

📍 شار:
${user.city}

</div>

<div class="info">

🎂 تەمەن:
${user.age}

</div>

<div class="info">

📞 مۆبایل:
${user.phone}

</div>

<div class="status">

📌 دۆخ:
${user.status}

</div>

<div class="buttons">

<button class="approve"
onclick="approveUser(${user.id})">

قبوڵکردن

</button>

<button class="winner"
onclick="winnerUser(${user.id})">

براوە

</button>

<button class="delete"
onclick="deleteUser(${user.id})">

سڕینەوە

</button>

</div>

</div>

`;

});

}

async function approveUser(id){

const { error } =
await client
.from("gift_requests")
.update({

status:"approved"

})
.eq("id",id);

if(error){

alert("هەڵەیەک ڕوویدا");

return;
}

loadRequests();

}

async function winnerUser(id){

await client
.from("gift_requests")
.update({

status:"winner"

})
.eq("id",id);

loadRequests();

}

async function deleteUser(id){

const ok =
confirm("دڵنیایت لە سڕینەوە؟");

if(!ok) return;

await client
.from("gift_requests")
.delete()
.eq("id",id);

loadRequests();

}

loadRequests();

</script>

</body>
</html>
