<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <style>
    body{
      font-family:sans-serif;
      background:#f5f7fa;
      margin:0;
      padding:20px;
      direction:rtl;
    }
    .card{
      background:#fff;
      border-radius:16px;
      padding:18px;
      margin-bottom:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.08);
    }
    h2{ margin:0 0 12px; }
    input{
      width:100%;
      box-sizing:border-box;
      padding:12px;
      margin-top:10px;
      border:1px solid #ddd;
      border-radius:12px;
      outline:none;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:12px;
      border:none;
      border-radius:12px;
      background:#111827;
      color:#fff;
      font-size:16px;
      cursor:pointer;
    }
    .muted{ color:#666; font-size:14px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>زیادکردنی کۆمپانیا</h2>
    <input id="company_name" placeholder="ناوی کۆمپانیا" />
    <input id="umrah_count" placeholder="ژمارەی عمرەی هدیە" type="number" />
    <input id="company_phone" placeholder="ژمارە مۆبایل" />
    <button onclick="addCompany()">زیادکردن</button>
    <div id="msg1" class="muted" style="margin-top:10px;"></div>
  </div>

  <div class="card">
    <h2>زیادکردنی بەشداربوو</h2>
    <input id="person_name" placeholder="ناوی سیانی" />
    <input id="person_phone" placeholder="ژمارە مۆبایل" />
    <button onclick="addPerson()">زیادکردن</button>
    <div id="msg2" class="muted" style="margin-top:10px;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://slllcibigutjivauryvc.supabase.co";
    const supabaseKey = "sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function addCompany() {
      const company_name = document.getElementById("company_name").value.trim();
      const umrah_count = document.getElementById("umrah_count").value.trim();
      const phone = document.getElementById("company_phone").value.trim();

      if (!company_name || !umrah_count || !phone) {
        document.getElementById("msg1").textContent = "هەموو خانەکان پڕ بکە.";
        return;
      }

      const { error } = await supabaseClient
        .from("companies")
        .insert([{ company_name, umrah_count: Number(umrah_count), phone }]);

      document.getElementById("msg1").textContent = error ? "هەڵە: " + error.message : "بە سەرکەوتوویی زیادکرا.";
    }

    async function addPerson() {
      const full_name = document.getElementById("person_name").value.trim();
      const phone = document.getElementById("person_phone").value.trim();

      if (!full_name || !phone) {
        document.getElementById("msg2").textContent = "هەموو خانەکان پڕ بکە.";
        return;
      }

      const { error } = await supabaseClient
        .from("participants")
        .insert([{ full_name, phone }]);

      document.getElementById("msg2").textContent = error ? "هەڵە: " + error.message : "بە سەرکەوتوویی زیادکرا.";
    }
  </script>
</body>
</html>
