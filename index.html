<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پڕۆژەی دیاری عمرە حاجی کاروان ستونی</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans Arabic',sans-serif;
}

body{
background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
url('https://images.unsplash.com/photo-1564769662533-4f00a87b4056?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;
background-attachment:fixed;
min-height:100vh;
color:white;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.glass{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
border:1px solid rgba(255,215,0,0.25);
box-shadow:0 8px 32px rgba(0,0,0,.4);
border-radius:25px;
}

.hero{
padding:40px;
text-align:center;
margin-bottom:25px;
}

.hero h1{
font-size:40px;
color:#FFD700;
margin-bottom:10px;
font-weight:800;
}

.hero p{
font-size:18px;
color:#d8d8d8;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}

.card{
padding:25px;
}

.card-title{
font-size:22px;
font-weight:700;
margin-bottom:20px;
color:#FFD700;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:8px;
font-size:15px;
}

input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,.1);
color:white;
font-size:16px;
border:1px solid rgba(255,255,255,.15);
}

input::placeholder{
color:#cccccc;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#0f9d58,#FFD700);
color:black;
font-weight:bold;
font-size:17px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

.stats{
display:flex;
justify-content:center;
align-items:center;
height:150px;
flex-direction:column;
}

.stats-number{
font-size:50px;
font-weight:800;
color:#FFD700;
}

.stats-text{
font-size:18px;
}

.names-box{
max-height:450px;
overflow-y:auto;
}

.name-item{
padding:12px;
margin-bottom:10px;
border-radius:10px;
background:rgba(255,255,255,.07);
border-right:4px solid #FFD700;
}

.name-item span{
color:#FFD700;
font-weight:bold;
margin-left:10px;
}

.footer{
margin-top:25px;
text-align:center;
padding:20px;
font-size:14px;
color:#ddd;
}

.success{
background:#0f9d58;
padding:12px;
border-radius:10px;
margin-bottom:15px;
display:none;
}

.error{
background:#b00020;
padding:12px;
border-radius:10px;
margin-bottom:15px;
display:none;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}

.hero h1{
font-size:28px;
}
}
</style>
</head>

<body>

<div class="container">

<div class="glass hero">
<h1>🕋 پڕۆژەی دیاری عمرە حاجی کاروان ستونی</h1>
<p>بەشداری بکە و ناوت تۆمار بکە بۆ بەدەستهێنانی هەدیەی عمرە</p>
</div>

<div class="grid">

<div class="glass card">

<div class="card-title">
📋 فۆڕمی تۆمارکردن
</div>

<div id="success" class="success">
تۆمارکردن بە سەرکەوتوویی ئەنجامدرا
</div>

<div id="error" class="error">
هەڵەیەک ڕوویدا
</div>

<form id="registerForm">

<div class="form-group">
<label>ناوی سیانی</label>
<input
type="text"
id="fullName"
placeholder="ناوی تەواو"
required>
</div>

<div class="form-group">
<label>ژمارەی مۆبایل</label>
<input
type="tel"
id="phone"
placeholder="0750xxxxxxx"
required>
</div>

<button type="submit">
تۆمارکردن
</button>

</form>

</div>

<div class="glass card">

<div class="stats">
<div id="totalCount" class="stats-number">
0
</div>

<div class="stats-text">
ڕێژەی تۆمارکراوەکان
</div>
</div>

</div>

</div>

<div class="glass card" style="margin-top:20px;">

<div class="card-title">
👥 لیستی تۆمارکراوەکان
</div>

<div id="namesList" class="names-box">

<div class="name-item">
<span>1</span>
شعبان قادر
</div>

<div class="name-item">
<span>2</span>
سلێمان بێغڵی
</div>

<div class="name-item">
<span>3</span>
کوردستان تەسە
</div>

</div>

</div>

<div class="footer glass">
پڕۆژەی دیاری عمرە حاجی کاروان ستونی © 2026
</div>

</div>

<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl =
'https://slllcibigutjivauryvc.supabase.co'

const supabaseKey =
'sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH'

const supabase =
createClient(
supabaseUrl,
supabaseKey
)

const form =
document.getElementById('registerForm')

const namesList =
document.getElementById('namesList')

const totalCount =
document.getElementById('totalCount')

async function loadRegistrations(){

const { data,error } =
await supabase
.from('registrations')
.select('*')
.order('id',{ascending:false})

if(error) return

totalCount.innerText = data.length

namesList.innerHTML=''

data.forEach((item,index)=>{

namesList.innerHTML += `
<div class="name-item">
<span>${index+1}</span>
${item.full_name}
</div>
`

})

}

form.addEventListener(
'submit',
async(e)=>{

e.preventDefault()

const fullName =
document.getElementById('fullName').value

const phone =
document.getElementById('phone').value

const { error } =
await supabase
.from('registrations')
.insert([
{
full_name:fullName,
phone:phone
}
])

if(error){

document.getElementById('error').style.display='block'

setTimeout(()=>{
document.getElementById('error').style.display='none'
},3000)

return
}

document.getElementById('success').style.display='block'

setTimeout(()=>{
document.getElementById('success').style.display='none'
},3000)

form.reset()

loadRegistrations()

})

loadRegistrations()

</script>

</body>
</html>
