<!DOCTYPE html>

<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پڕۆژەی دیاری عومرە حاجی کاروان ستونی</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#0f1115;
color:white;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.box{
background:#161b22;
border:2px solid #0ea35a;
border-radius:18px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 15px rgba(14,163,90,.25);
}

.title{
text-align:center;
font-size:28px;
font-weight:bold;
color:#fff;
}

.subtitle{
text-align:center;
margin-top:10px;
color:#8be0b4;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:12px;
background:#0ea35a;
border:none;
color:white;
font-size:18px;
border-radius:10px;
cursor:pointer;
}

.counter{
font-size:34px;
font-weight:bold;
text-align:center;
color:#8be0b4;
}

#participantsList div{
padding:8px;
border-bottom:1px solid rgba(255,255,255,.1);
}
</style>

</head>

<body>

<div class="container">

<div class="box">
<div class="title">
پڕۆژەی دیاری عومرە حاجی کاروان ستونی
</div>
<div class="subtitle">
بەخێربێن بۆ تۆمارکردنی بەژداربووان
</div>
</div>

<div class="box">
<h2>زانیاری کۆمپانیا</h2>
<br>
<p><strong>ناوی کۆمپانیا:</strong> <span id="companyName">...</span></p>
<p><strong>ژمارەی هەدیە:</strong> <span id="giftCount">...</span></p>
<p><strong>ژمارەی مۆبایل:</strong> <span id="companyPhone">...</span></p>
</div>

<div class="box">
<h2>فۆڕمی تۆمارکردن</h2>

<input
type="text"
id="fullName"
placeholder="ناوی سیانی"
/>

<input
type="text"
id="phone"
placeholder="ژمارەی مۆبایل"
/>

<button onclick="saveParticipant()">
تۆمارکردن
</button>
</div>

<div class="box">
<h2 style="text-align:center;">ژمارەی بەژداربووان</h2>
<div class="counter" id="count">0</div>
</div>

<div class="box">
<h2>ناوی تۆمارکراوەکان</h2>
<br>
<div id="participantsList"></div>
</div>

</div>

<script>

const supabase = window.supabase.createClient(
'https://slllcibigutjivauryvc.supabase.co',
'sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH'
);

async function loadCompanies(){
const {data} = await supabase
.from('companies')
.select('*')
.limit(1);

if(data && data.length){

document.getElementById('companyName').textContent =
data[0].company_name || '';

document.getElementById('giftCount').textContent =
data[0].umrah_count || '';

document.getElementById('companyPhone').textContent =
data[0].phone || '';
}
}

async function loadParticipants(){

const {data} = await supabase
.from('participants')
.select('*')
.order('id',{ascending:true});

const list =
document.getElementById('participantsList');

list.innerHTML='';

document.getElementById('count').innerText =
data ? data.length : 0;

if(data){

data.forEach((item,index)=>{

list.innerHTML += `
<div>
${index+1} - ${item.full_name}
</div>
`;

});

}
}

async function saveParticipant(){

const full_name =
document.getElementById('fullName').value.trim();

const phone =
document.getElementById('phone').value.trim();

if(!full_name || !phone){
alert('تکایە هەموو خانەکان پڕ بکەرەوە');
return;
}

const {error} = await supabase
.from('participants')
.insert([
{
full_name,
phone
}
]);

if(error){
alert('هەڵەیەک ڕوویدا');
return;
}

alert('بە سەرکەوتوویی تۆمار کرا');

document.getElementById('fullName').value='';
document.getElementById('phone').value='';

loadParticipants();
}

loadCompanies();
loadParticipants();

</script>

</body>
</html>
