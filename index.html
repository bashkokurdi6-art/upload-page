<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پڕۆژەی دیاری عمرە</title>

<style>
body{
font-family:sans-serif;
background:#f5f7fa;
padding:20px;
direction:rtl;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 0 15px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:bold;
text-align:center;
color:#0f766e;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#0f766e;
color:white;
font-size:18px;
cursor:pointer;
margin-top:10px;
}
</style>
</head>

<body>

<div class="card">
<div class="title">
پڕۆژەی دیاری عمرە حاجی کاروان ستونی
</div>
</div>

<div class="card">
<h3>کۆمپانیا بەشداربووەکان</h3>
<div id="companies"></div>
</div>

<div class="card">
<h3>ناوە تۆمارکراوەکان</h3>
<div id="participants"></div>
</div>

<div class="card">
<h3>فۆڕمی تۆمارکردن</h3>

<input id="name" placeholder="ناوی سیانی">

<input id="phone" placeholder="ژمارە مۆبایل">

<button onclick="saveParticipant()">
ناردن
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabase = window.supabase.createClient(
"https://slllcibigutjivauryvc.supabase.co",
"sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH"
);

async function loadCompanies(){

let {data}=await supabase
.from("companies")
.select("*");

let html="";

data.forEach(x=>{
html+=`
<div style="padding:10px;border-bottom:1px solid #eee">
<b>${x.company_name}</b><br>
عمرە: ${x.umrah_count}<br>
${x.phone}
</div>`;
});

document.getElementById("companies").innerHTML=html;

}

async function loadParticipants(){

let {data}=await supabase
.from("participants")
.select("*");

let html="";

data.forEach(x=>{
html+=`
<div style="padding:10px;border-bottom:1px solid #eee">
${x.full_name}
</div>`;
});

document.getElementById("participants").innerHTML=html;

}

async function saveParticipant(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;

await supabase
.from("participants")
.insert([{
full_name:name,
phone:phone
}]);

alert("بە سەرکەوتوویی تۆمارکرا");

location.reload();

}

loadCompanies();
loadParticipants();

</script>

</body>
</html>
