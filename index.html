<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پڕۆژەی دیاری عمرە</title>
  <style>
    body{
      font-family: sans-serif;
      background:#f5f7fa;
      margin:0;
      padding:20px;
      direction:rtl;
    }
    .card{
      background:#fff;
      border-radius:16px;
      padding:18px;
      margin-bottom:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.08);
    }
    .title{
      font-size:22px;
      font-weight:700;
      text-align:center;
      color:#0f766e;
    }
    h3{ margin:0 0 12px; }
    input{
      width:100%;
      box-sizing:border-box;
      padding:12px;
      margin-top:10px;
      border:1px solid #ddd;
      border-radius:12px;
      outline:none;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:12px;
      border:none;
      border-radius:12px;
      background:#0f766e;
      color:#fff;
      font-size:16px;
      cursor:pointer;
    }
    .item{
      padding:10px 0;
      border-bottom:1px solid #eee;
    }
    .muted{ color:#666; font-size:14px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">پڕۆژەی دیاری عمرە حاجی کاروان ستونی</div>
  </div>

  <div class="card">
    <h3>کۆمپانیاکان</h3>
    <div id="companies" class="muted">چاوەڕێ...</div>
  </div>

  <div class="card">
    <h3>ناوە تۆمارکراوەکان</h3>
    <div id="participants" class="muted">چاوەڕێ...</div>
  </div>

  <div class="card">
    <h3>فۆڕمی پڕکردنەوە</h3>
    <input id="full_name" type="text" placeholder="ناوی سیانی" />
    <input id="phone" type="text" placeholder="ژمارە مۆبایل" />
    <button onclick="saveParticipant()">ناردن</button>
    <div id="msg" class="muted" style="margin-top:10px;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://slllcibigutjivauryvc.supabase.co";
    const supabaseKey = "sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const msg = document.getElementById("msg");

    async function loadCompanies() {
      const box = document.getElementById("companies");
      const { data, error } = await supabaseClient
        .from("companies")
        .select("id, company_name, umrah_count, phone")
        .order("id", { ascending: false });

      if (error) {
        box.innerHTML = `<span class="muted">هەڵە: ${error.message}</span>`;
        return;
      }

      if (!data || data.length === 0) {
        box.innerHTML = `<span class="muted">هیچ کۆمپانیایەک نیە</span>`;
        return;
      }

      box.innerHTML = data.map(x => `
        <div class="item">
          <b>${x.company_name ?? ""}</b><br>
          عمرە: ${x.umrah_count ?? ""}<br>
          مۆبایل: ${x.phone ?? ""}
        </div>
      `).join("");
    }

    async function loadParticipants() {
      const box = document.getElementById("participants");
      const { data, error } = await supabaseClient
        .from("participants")
        .select("id, full_name, phone")
        .order("id", { ascending: false });

      if (error) {
        box.innerHTML = `<span class="muted">هەڵە: ${error.message}</span>`;
        return;
      }

      if (!data || data.length === 0) {
        box.innerHTML = `<span class="muted">هیچ کەسێک تۆمار نەکراوە</span>`;
        return;
      }

      box.innerHTML = data.map(x => `
        <div class="item">
          <b>${x.full_name ?? ""}</b><br>
          مۆبایل: ${x.phone ?? ""}
        </div>
      `).join("");
    }

    async function saveParticipant() {
      const full_name = document.getElementById("full_name").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!full_name || !phone) {
        msg.textContent = "تکایە ناو و ژمارە مۆبایل بنووسە.";
        return;
      }

      msg.textContent = "چاوەڕێ...";

      const { error } = await supabaseClient
        .from("participants")
        .insert([{ full_name, phone }]);

      if (error) {
        msg.textContent = "هەڵە: " + error.message;
        return;
      }

      msg.textContent = "بە سەرکەوتوویی تۆمارکرا.";
      document.getElementById("full_name").value = "";
      document.getElementById("phone").value = "";
      await loadParticipants();
    }

    loadCompanies();
    loadParticipants();
  </script>
</body>
</html>
