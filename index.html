function cvHtml(d){const c=d.cv||{},r=(a,b)=>b?`<tr><th>${a}</th><td>${e(b)}</td></tr>`:'';
 const ls=(c.langs||[]).map(l=>`${e(l[0])} — ${en(l[1])}`).join('<br>');
 return `<div class="cvp"><div class="cvh"><div><h1 dir="auto">${e(d.full_name)}</h1><h2 dir="auto">${e(d.job_title)}</h2><p>${e(d.phone)}</p><p>${e(d.email)}</p><p dir="auto">${e(c.addr||'')}</p></div><img crossorigin="anonymous" src="${e(d.selfie)}"></div>
<h4>Personal details</h4><table>${r('Nationality',d.nationality)}${r('Gender',en(c.gender))}${r('Date of birth',c.dob)}${r('Place of birth',c.pob)}${r('Marital status',en(c.marital))}${r('Passport no.',c.pass)}${r('Passport expiry',c.pexp)}${r('Driving licence',en(c.lic))}</table>
<h4>Education</h4><table>${r('Level',en(c.edu))}${c.edu!='none'?r('School / University',c.school)+r('Field of study',c.field)+r('Graduation year',c.gyear):''}</table>
<h4>Languages</h4><div class="cvl">${ls||'—'}</div>
<h4>Experience</h4><table>${r('Years of experience',c.exp)}${r('Last employer',c.emp)}${r('Job title',c.role)}</table>
${c.skills?`<h4>Skills</h4><div class="cvl" dir="auto">${e(c.skills)}</div>`:''}
<div class="cvf"><img crossorigin="anonymous" src="${e(S.logo||'Logo-amal.png')}" onerror="this.remove()"><span>${e($('ti').textContent)}</span></div></div>`}
async function dlCV(){const w=document.createElement('div');w.id='cvw';w.innerHTML=cvHtml(CVD);document.body.appendChild(w);
 await Promise.all([...w.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
 try{await html2pdf().set({margin:0,filename:'CV-'+String(CVD.full_name).replace(/\s+/g,'_')+'.pdf',image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4'}}).from(w.firstChild).save()}catch(x){alert(t('err'))}
 w.remove()}
let CID=localStorage.chatid,CL=0,cpt;
const cname=()=>localStorage.chatname||'';
function chatOpen(){$('cw').classList.add('on');$('ct').textContent=t('chat');$('cn').hidden=true;cform();if(!CID&&!$('cm').children.length)$('cm').innerHTML=`<p class="hint">${t('chatempty')}</p>`;pollChat();clearInterval(cpt);cpt=setInterval(pollChat,3000)}
function chatClose(){$('cw').classList.remove('on');clearInterval(cpt)}
$('cb').onclick=()=>$('cw').classList.contains('on')?chatClose():chatOpen();
function cform(){$('cf').innerHTML=cname()?`<input id="ci" placeholder="${t('msgph')}" maxlength="1000" onkeydown="if(event.key=='Enter')sendChat()"><button class="btn" onclick="sendChat()">${t('sendm')}</button>`:`<input id="cnm" placeholder="${t('yourname')}" maxlength="60"><button class="btn" onclick="setCName()">${t('start')}</button>`}
function setCName(){const v=$('cnm').value.trim();if(!v)return;localStorage.chatname=v;cform();$('ci').focus()}
function addMsg(m){const h=$('cm').querySelector('.hint');if(h)h.remove();const d=document.createElement('div');d.className='mg '+m.sender;d.textContent=m.body;$('cm').appendChild(d);$('cm').scrollTop=1e9}
async function pollChat(){if(!CID)return;const r=await sb.rpc('get_msgs',{p_chat:CID,p_after:CL});(r.data||[]).forEach(m=>{CL=Math.max(CL,m.id);addMsg(m)})}
async function sendChat(){const i=$('ci'),v=i.value.trim();if(!v)return;i.value='';if(!CID)CID=localStorage.chatid=crypto.randomUUID();
 const r=await sb.rpc('send_msg',{p_chat:CID,p_name:cname(),p_body:v});if(r.error){alert(t('err'));i.value=v;return}pollChat()}
setInterval(async()=>{if(!CID||$('cw').classList.contains('on'))return;const r=await sb.rpc('get_msgs',{p_chat:CID,p_after:CL}),n=(r.data||[]).filter(m=>m.sender=='admin').length;$('cn').hidden=!n;$('cn').textContent=n},10000);
load();
</script></body></html>
