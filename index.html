<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پڕۆژەی دیاری عمرە حاجی کاروان ستونی</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#f5f7fa;
padding:15px;
}

.card{
background:#fff;
border-radius:15px;
padding:20px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:bold;
text-align:center;
color:#0f766e;
}

.subtitle{
margin-top:8px;
text-align:center;
color:#666;
font-size:14px;
}

h3{
margin-bottom:15px;
color:#0f766e;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:10px;
font-size:16px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#0f766e;
color:#fff;
font-size:17px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.company-item{
padding:12px;
border-bottom:1px solid #eee;
line-height:1.8;
}

.participant-item{
padding:10px;
border-bottom:1px solid #eee;
}

.counter{
background:#ecfeff;
border:1px solid #a5f3fc;
padding:12px;
border-radius:10px;
margin-bottom:15px;
text-align:center;
font-weight:bold;
color:#0f766e;
}

.empty{
text-align:center;
color:#888;
padding:15px;
}

</style>
</head>

<body>

<div class="card">

<div class="title">
پڕۆژەی دیاری عمرە حاجی کاروان ستونی
</div>

<div class="subtitle">
تۆمارکردنی بەشداربووانی دیاری عمرە
</div>

</div>

<div class="card">

<h3>
کۆمپانیا بەشداربووەکان
</h3>

<div id="companies">

<div class="empty">
چاوەڕێی داتا...
</div>

</div>

</div>

<div class="card">

<h3>
فۆڕمی تۆمارکردن
</h3>

<input
type="text"
id="name"
placeholder="ناوی سیانی"
/>

<input
type="text"
id="phone"
placeholder="ژمارە مۆبایل"
/>

<button onclick="saveParticipant()">
ناردن
</button>

</div>

<div class="card">

<div class="counter">

کۆی بەشداربووان:
<span id="participantsCount">
0
</span>

</div>

<h3>
ناوە تۆمارکراوەکان
</h3>

<div id="participants">

<div class="empty">
چاوەڕێی داتا...
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabase = window.supabase.createClient(
"https://slllcibigutjivauryvc.supabase.co",
"sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH"
);

async function loadCompanies(){

const { data, error } = await supabase
.from("companies")
.select("*")
.order("id");

if(error){
document.getElementById("companies").innerHTML =
'<div class="empty">هەڵە لە وەرگرتنی داتا</div>';
return;
}

let html = "";

if(data && data.length){

data.forEach(item=>{

html += `
<div class="company-item">

<b>${item.company_name || ""}</b>
<br>

🎁 ${item.umrah_count || 0} عمرە

<br>

📞 ${item.phone || ""}

</div>
`;

});

}else{

html = `
<div class="empty">
هیچ کۆمپانیایەک تۆمار نەکراوە
</div>
`;

}

document.getElementById("companies").innerHTML = html;

}

async function loadParticipants(){

const { data, error } = await supabase
.from("participants")
.select("*")
.order("id");

if(error){

document.getElementById("participants").innerHTML =
'<div class="empty">هەڵە لە وەرگرتنی داتا</div>';

return;

}

document.getElementById("participantsCount").innerText =
data ? data.length : 0;

let html = "";

if(data && data.length){

data.forEach(item=>{

html += `
<div class="participant-item">
${item.full_name || ""}
</div>
`;

});

}else{

html = `
<div class="empty">
هیچ ناوێک تۆمار نەکراوە
</div>
`;

}

document.getElementById("participants").innerHTML = html;

}

async function saveParticipant(){

const name =
document.getElementById("name").value.trim();

const phone =
document.getElementById("phone").value.trim();

if(!name || !phone){

alert("هەموو خانەکان پڕ بکە");
return;

}

const { data: existing } = await supabase
.from("participants")
.select("id")
.eq("phone", phone);

if(existing && existing.length > 0){

alert("ئەم ژمارەیە پێشتر تۆمارکراوە");
return;

}

const { error } = await supabase
.from("participants")
.insert([{
full_name:name,
phone:phone
}]);

if(error){

alert(error.message);
return;

}

document.getElementById("name").value = "";
document.getElementById("phone").value = "";

alert("بە سەرکەوتوویی تۆمارکرا");

loadParticipants();

}

loadCompanies();
loadParticipants();

</script>

</body>
</html>
