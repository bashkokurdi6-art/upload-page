<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پڕۆژەی دیاری عمرە حاجی کاروان ستونی</title>

<style>
body{
font-family:sans-serif;
background:#f5f7fa;
padding:20px;
direction:rtl;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 0 15px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:bold;
text-align:center;
color:#0f766e;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#0f766e;
color:white;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

.item{
padding:10px;
border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<div class="card">
<div class="title">
پڕۆژەی دیاری عمرە حاجی کاروان ستونی
</div>
</div>

<div class="card">
<h3>کۆمپانیا بەشداربووەکان</h3>
<div id="companies"></div>
</div>

<div class="card">
<h3>فۆڕمی تۆمارکردن</h3>

<input id="name" placeholder="ناوی سیانی">

<input id="phone" placeholder="ژمارە مۆبایل">

<button onclick="saveParticipant()">
ناردن
</button>

</div>

<div class="card">
<h3>ناوە تۆمارکراوەکان</h3>
<div id="participants"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabase = window.supabase.createClient(
"https://slllcibigutjivauryvc.supabase.co",
"sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH"
);

async function loadCompanies(){

const {data,error}=await supabase
.from("companies")
.select("*")
.order("id");

if(error){
console.log(error);
return;
}

let html="";

data.forEach(x=>{

html+=`
<div class="item">
<b>${x.company_name}</b><br>
🎁 ${x.umrah_count} عمرەی هدیە<br>
📞 ${x.phone}
</div>
`;

});

document.getElementById("companies").innerHTML=html;

}

async function loadParticipants(){

const {data,error}=await supabase
.from("participants")
.select("*")
.order("id");

if(error){
console.log(error);
document.getElementById("participants").innerHTML="";
return;
}

let html="";

if(data && data.length){

data.forEach(x=>{

html+=`
<div class="item">
${x.full_name}
</div>
`;

});

}

document.getElementById("participants").innerHTML=html;

}

async function saveParticipant(){

let name=document.getElementById("name").value.trim();
let phone=document.getElementById("phone").value.trim();

if(!name || !phone){

alert("هەموو خانەکان پڕ بکە");
return;

}

const {data:existing,error:checkError}=await supabase
.from("participants")
.select("id")
.eq("phone",phone);

if(checkError){
alert("هەڵەیەک ڕوویدا");
return;
}

if(existing && existing.length>0){

alert("ئەم ژمارەیە پێشتر تۆمارکراوە");
return;

}

const {error}=await supabase
.from("participants")
.insert([{
full_name:name,
phone:phone
}]);

if(error){
alert(error.message);
return;
}

alert("بە سەرکەوتوویی تۆمارکرا");

document.getElementById("name").value="";
document.getElementById("phone").value="";

loadParticipants();

}

loadCompanies();
loadParticipants();

</script>

</body>
</html>
