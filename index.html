<style>
:root{--g:#006C35;--gd:#00502a;--gold:#B8975A;--ink:#1c2b24;--mut:#5b6b63;--bd:#e1e6e3;--bg:#f6f8f7}
*{box-sizing:border-box;margin:0}body{font-family:'IBM Plex Sans Arabic',Tajawal,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
button{font:inherit;cursor:pointer}
.bar{background:var(--gd);color:#dfeee5;font-size:12.5px;direction:ltr;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 16px;padding-top:calc(6px + env(safe-area-inset-top))}
.bar b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.5px}
header{background:#fff;border-bottom:1px solid var(--bd);position:relative;z-index:20;box-shadow:0 1px 0 var(--gold)}
.hi{direction:ltr;max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;direction:rtl;text-align:center}.brand img{height:78px;max-width:60vw;object-fit:contain}
.lg{width:38px;height:38px;border-radius:8px;background:var(--g);display:grid;place-items:center;flex:none}
.brand h1{font-size:16px;font-weight:700;color:var(--g)}
.ib{background:#fff;border:1px solid var(--bd);color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;position:relative;display:flex;align-items:center;gap:6px}
.ib:hover{border-color:var(--g)}
.dd{position:absolute;top:100%;margin-top:4px;background:#fff;color:var(--ink);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px #0000001f;min-width:190px;max-width:86vw;display:none;overflow:hidden;z-index:30}
.dd.on{display:block}.dd button,.dd div{display:block;width:100%;text-align:start;padding:10px 14px;border:0;background:none;border-bottom:1px solid #eef1ef;font-size:14px}.dd button:hover{background:#f1f6f3}
#lg{left:12px}#bl{right:12px}
.bd{position:absolute;top:-6px;right:-6px;background:#c62828;color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
.sl{position:relative;overflow:hidden;margin:18px 0;border-radius:10px;aspect-ratio:16/7;cursor:pointer;direction:ltr;background:#dfe7e2}
.tr{display:flex;height:100%;transition:transform .7s ease}.s{min-width:100%;height:100%;background-size:cover;background-position:center;display:flex;align-items:flex-end}
.ph{background:linear-gradient(135deg,#e3ebe6,#cfdcd4)}
.s span{width:100%;padding:44px 22px 20px;color:#fff;font-weight:700;font-size:clamp(16px,3.4vw,26px);background:linear-gradient(transparent,#000b);direction:rtl;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.s em{font-style:normal;font-size:13px;font-weight:500;border:1px solid #fffa;border-radius:6px;padding:4px 12px;white-space:nowrap}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px}.dots i{width:7px;height:7px;border-radius:9px;background:#fff8}.dots i.on{background:#fff;width:20px}
h2{font-size:20px;font-weight:700;margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--bd);position:relative}
h2:after{content:"";position:absolute;bottom:-2px;inset-inline-start:0;width:64px;height:2px;background:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--bd);display:flex;flex-direction:column;transition:border-color .2s}
.card:hover{border-color:var(--g)}
.card .im{aspect-ratio:16/10;background-size:cover;background-position:center}
.card .bd2{padding:16px;display:flex;flex-direction:column;flex:1}.card h3{font-size:17px;font-weight:700;margin-bottom:6px}
.card p{font-size:14px;color:var(--mut);line-height:1.8;white-space:pre-line;flex:1}
.btn{background:var(--g);color:#fff;border:1px solid var(--g);border-radius:8px;padding:10px 20px;font-weight:600}
.btn:hover{background:var(--gd)}.card .btn{width:100%;margin-top:14px}
#info{display:grid;gap:12px;margin-bottom:10px}.inf{background:#fff;border:1px solid var(--bd);border-inline-start:4px solid var(--g);border-radius:8px;padding:16px;line-height:1.9;white-space:pre-line;color:#33423a}.inf b{color:var(--g)}.inf.hl{box-shadow:0 0 0 2px var(--g)}
.sl{aspect-ratio:16/8}
.s{position:relative;overflow:hidden}
.s:before{content:"";position:absolute;inset:-20px;background:var(--u) center/cover;filter:blur(16px) brightness(.8)}
.s img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.s span{position:relative;z-index:2;width:100%;padding:44px 22px 20px;color:#fff;font-weight:700;font-size:clamp(16px,3.4vw,26px);background:linear-gradient(transparent,#000b);direction:rtl;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.s em{font-style:normal;font-size:13px;font-weight:500;border:1px solid #fffa;border-radius:6px;padding:4px 12px;white-space:nowrap}
.im2{display:block;width:100%;height:auto}
.lk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.sc{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:22px 20px;border-radius:12px;color:#fff;text-decoration:none;background:linear-gradient(135deg,#007a3d,#00502a);border-bottom:3px solid var(--gold);box-shadow:0 6px 18px #00502a30;transition:transform .2s,box-shadow .2s}
.sc:before{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:#ffffff10}
.sc:hover{transform:translateY(-3px);box-shadow:0 10px 24px #00502a45}
.sc svg{flex:none;background:#ffffff14;border-radius:12px;padding:8px;width:58px;height:58px}
.sc span{flex:1;display:flex;flex-direction:column;gap:3px;position:relative}.sc b{font-size:17px;font-weight:700}.sc small{font-size:13px;color:#cfe6d8}

footer{background:#f0f1ee;color:var(--ink);text-align:center;padding:26px 16px 22px;margin-top:40px;border-top:1px solid var(--bd)}
footer h3{font-size:20px;font-weight:700;max-width:560px;margin:0 auto 14px;padding-bottom:12px;border-bottom:1px solid #c4c6c2}
footer a{display:block;color:var(--ink);text-decoration:none;font-size:15px;padding:7px 0}footer a:hover{color:var(--g)}
footer .fs{margin-bottom:26px}footer .cp{max-width:560px;margin:10px auto 0;padding-top:18px;border-top:1px solid #dcdedb;color:#8a8f8b;font-size:13px;line-height:1.9}
.md{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}.md.on{display:flex}
.sh{background:#fff;width:100%;max-width:500px;max-height:92vh;overflow:auto;border-radius:12px;padding:22px}
.sh h3{font-size:18px;color:var(--g);padding-bottom:10px;border-bottom:1px solid var(--bd)}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px;color:#33423a}
input{width:100%;padding:11px 12px;border:1px solid #c5d0ca;border-radius:8px;font:inherit;background:#fff}input:focus{outline:2px solid #006c3533;border-color:var(--g)}
.row{display:flex;gap:8px;margin-top:20px}.row .btn{flex:1}.gh{background:#fff;color:var(--ink);border-color:#c5d0ca}.gh:hover{background:#f1f4f2}
.pay{background:#f6f8f7;border:1px solid var(--bd);border-radius:8px;padding:6px 14px;margin-top:14px}
.pay div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;direction:ltr;word-break:break-all;border-bottom:1px solid var(--bd);font-size:14px}.pay div:last-child{border:0}.pay small{color:var(--mut);margin-inline-end:6px}
.pay button{background:#fff;color:var(--g);border:1px solid var(--g);border-radius:6px;padding:3px 10px;font-size:13px}
.ok{text-align:center;padding:24px 8px;font-size:17px;font-weight:600;line-height:2}
.sl{aspect-ratio:auto;height:auto;transition:height .4s}
.tr{align-items:flex-start;height:auto}
.s{height:auto;display:block;position:relative}
.s:before{display:none}
.s img{position:static;display:block;width:100%;height:auto}
.s.ph{aspect-ratio:16/8}
.s span{position:absolute;left:0;right:0;bottom:0;width:auto}
</style></head>
<body>
<div class="bar"><span id="gr"></span><b id="clk"></b><span id="hj"></span></div>
<header><div class="hi"><button class="ib" id="lb"></button>
<div class="brand"><img id="lgo" src="IMG_0200.png" alt="" onerror="this.hidden=true"><h1 id="ti"></h1></div>
<button class="ib" id="bb" aria-label="notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1112 0c0 6 2 7 2 7H4s2-1 2-7zM10 20a2 2 0 004 0"/></svg><span class="bd" id="bc" hidden></span></button></div>

<h2 id="h3"></h2><div class="lk"><a class="sc" target="_blank" rel="noopener" href="https://prh.gov.sa/ar/almasjed_alharam/imem-muadhen-makka"><svg width="50" height="50" viewBox="0 0 48 48" fill="none" stroke="#e9d9ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 42V29h28v13M13 29c0-7 5-11 11-11s11 4 11 11M24 18v-6M22 12h4M4 42h40M7 42V22M41 42V22M5.5 22h3M39.5 22h3"/></svg><span><b id="mk"></b><small id="mk2"></small></span></a><a class="sc" target="_blank" rel="noopener" href="https://prh.gov.sa/ar/almasjed_alnabawi/imem-muadhen-madina"><svg width="50" height="50" viewBox="0 0 48 48" fill="none" stroke="#e9d9ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 42V29h28v13M13 29c0-7 5-11 11-11s11 4 11 11M24 18v-6M22 12h4M4 42h40M7 42V22M41 42V22M5.5 22h3M39.5 22h3"/></svg><span><b id="mn"></b><small id="mn2"></small></span></a></div>
<h2 id="h2"></h2><div id="info"></div></div>
<footer id="ft"></footer>
<div class="md" id="md"><div class="sh" id="sh"></div></div>
<script>
const sb=supabase.createClient('https://aptycuncoovqbjbuyjhm.supabase.co','sb_publishable_RgOL_VRlz1yf_lqV-yMrdA_01Jh0EMe');
const T={
ar:{more:'المزيد',sch:'جداول الأئمة والمؤذنين',mk:'المسجد الحرام – مكة المكرمة',vw:'عرض الجدول الرسمي',mn:'المسجد النبوي – المدينة المنورة',t:'فرص العمل',jobs:'الوظائف المتاحة',info:'معلومات إضافية',apply:'التقديم',name:'الاسم الثلاثي',nat:'الجنسية',phone:'رقم الجوال',email:'البريد الإلكتروني',selfie:'صورة سيلفي',next:'التالي',back:'رجوع',pay:'لإنشاء السيرة الذاتية يرجى دفع الرسوم',fee:'الرسوم',receipt:'صورة إيصال الدفع',send:'إرسال الطلب',done:'تم استلام طلبك بنجاح، سنتواصل معك قريباً',copy:'نسخ',no:'لا توجد وظائف حالياً',nn:'لا جديد',fill:'يرجى تعبئة جميع الحقول',err:'حدث خطأ، حاول مرة أخرى',auto:'تم تحديد الدولة تلقائياً'},
en:{more:'More',sch:'Imam & Muezzin Schedules',mk:'Masjid al-Haram – Makkah',vw:'View official schedule',mn:'Prophet’s Mosque – Madinah',t:'Job Opportunities',jobs:'Available Jobs',info:'More Information',apply:'Apply',name:'Full name (3 names)',nat:'Nationality',phone:'Mobile number',email:'Email',selfie:'Selfie photo',next:'Next',back:'Back',pay:'To create your CV please pay the fee',fee:'Fee',receipt:'Payment receipt photo',send:'Submit application',done:'Your application was received. We will contact you soon.',copy:'Copy',no:'No jobs yet',nn:'Nothing new',fill:'Please fill in all fields',err:'Something went wrong, try again',auto:'Country detected automatically'},
tr:{more:'Daha fazla',t:'İş Fırsatları',jobs:'Mevcut İşler',info:'Daha Fazla Bilgi',apply:'Başvur',name:'Ad soyad (3 isim)',nat:'Uyruk',phone:'Cep telefonu',email:'E-posta',selfie:'Selfie fotoğrafı',next:'İleri',back:'Geri',pay:'CV oluşturmak için ücreti ödeyin',fee:'Ücret',receipt:'Ödeme dekontu',send:'Başvuruyu gönder',done:'Başvurunuz alındı, sizinle iletişime geçeceğiz.',copy:'Kopyala',no:'Henüz ilan yok',nn:'Yeni bir şey yok',fill:'Tüm alanları doldurun',err:'Hata oluştu, tekrar deneyin',auto:'Ülke otomatik algılandı'},
fa:{more:'بیشتر',t:'فرصت‌های شغلی',jobs:'مشاغل موجود',info:'اطلاعات بیشتر',apply:'ثبت‌نام',name:'نام کامل (۳ نام)',nat:'ملیت',phone:'شماره موبایل',email:'ایمیل',selfie:'عکس سلفی',next:'بعدی',back:'بازگشت',pay:'برای ساخت رزومه هزینه را پرداخت کنید',fee:'هزینه',receipt:'تصویر رسید پرداخت',send:'ارسال درخواست',done:'درخواست شما دریافت شد، به زودی تماس می‌گیریم.',copy:'کپی',no:'شغلی موجود نیست',nn:'مورد جدیدی نیست',fill:'همه فیلدها را پر کنید',err:'خطا رخ داد، دوباره تلاش کنید',auto:'کشور به صورت خودکار تشخیص داده شد'},
ur:{more:'مزید',t:'ملازمت کے مواقع',jobs:'دستیاب ملازمتیں',info:'مزید معلومات',apply:'درخواست دیں',name:'پورا نام (3 نام)',nat:'قومیت',phone:'موبائل نمبر',email:'ای میل',selfie:'سیلفی تصویر',next:'اگلا',back:'واپس',pay:'سی وی بنانے کے لیے فیس ادا کریں',fee:'فیس',receipt:'ادائیگی کی رسید',send:'درخواست بھیجیں',done:'آپ کی درخواست موصول ہو گئی، ہم جلد رابطہ کریں گے۔',copy:'کاپی',no:'ابھی کوئی ملازمت نہیں',nn:'کچھ نیا نہیں',fill:'تمام خانے پُر کریں',err:'خرابی ہوئی، دوبارہ کوشش کریں',auto:'ملک خودکار طور پر معلوم ہوا'}};
const LG=[['ar','🇸🇦','AR'],['en','🇬🇧','EN'],['tr','🇹🇷','TR'],['fa','🇮🇷','FA'],['ur','🇵🇰','UR']];
const FOOT=[['روابط مهمة',[['سياسة الخصوصية','#'],['سياسة الاستخدام','#']]],['الاتصال والدعم',[['تواصل معنا','#'],['الأسئلة الشائعة','#']]]];
function ft(){const y=new Date().getFullYear();$('ft').innerHTML=FOOT.map(([h,l])=>`<div class="fs"><h3>${h}</h3>${l.map(([n,u])=>`<a href="${u}">${n}</a>`).join('')}</div>`).join('')+`<div class="cp">جميع الحقوق محفوظة © ${y} | ${e($('ti').textContent)}</div>`}
let L=localStorage.lang||'ar',S={},SL=[],PAY={},J=[],cur=null,F={},idx=0,tm,country='';
const $=id=>document.getElementById(id),t=k=>T[L][k]||T.en[k]||k;
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bg=u=>u?`style="background-image:url('${e(u)}')"`:'';
function flag(c){return c&&c.length==2?String.fromCodePoint(...[...c.toUpperCase()].map(x=>127397+x.charCodeAt())):'🌍'}
async function load(){
 const [a,b]=await Promise.all([sb.from('settings').select('*'),sb.from('jobs').select('*').order('created_at',{ascending:false})]);
 (a.data||[]).forEach(r=>{if(r.key=='site')S=r.value;if(r.key=='slides')SL=r.value;if(r.key=='pay')PAY=r.value});
 J=b.data||[];render();
}
function render(){
 const lg=LG.find(x=>x[0]==L);document.documentElement.lang=L;document.documentElement.dir=['ar','fa','ur'].includes(L)?'rtl':'ltr';
 $('lb').textContent=lg[1]+' '+lg[2];$('ti').textContent=S.title||t('t');if(S.logo){$('lgo').src=S.logo;$('lgo').hidden=false}document.title=$('ti').textContent;ft();
 $('lg').innerHTML=LG.map(x=>`<button onclick="setL('${x[0]}')">${x[1]} ${x[2]}</button>`).join('');
 $('h1').textContent=t('jobs');$('h2').textContent=t('info');$('h3').textContent=t('sch');$('mk').textContent=t('mk');$('mn').textContent=t('mn');$('mk2').textContent=$('mn2').textContent=t('vw');
 const sl=[0,1,2].map(i=>SL[i]||{});
 $('tr').innerHTML=sl.map(s=>`<div class="s ${s.img?'':'ph'}" ${s.img?`style="--u:url('${e(s.img)}')"`:''}>${s.img?`<img src="${e(s.img)}" alt="" onload="go(idx)">`:''}<span>${e(s.title||'')}<em>${t('more')} ‹</em></span></div>`).join('');
 $('dt').innerHTML=sl.map((_,i)=>`<i class="${i==idx?'on':''}"></i>`).join('');go(idx);
 $('info').innerHTML=(S.about?`<div class="inf">${e(S.about)}</div>`:'')+sl.map((s,i)=>s.title||s.text?`<div class="inf" id="inf${i}"><b>${e(s.title||'')}</b><br>${e(s.text||'')}</div>`:'').join('');
 $('jb').innerHTML=J.length?J.map(j=>`<div class="card">${j.image?`<img class="im2" src="${e(j.image)}" alt="">`:'<div class="im ph"></div>'}<div class="bd2"><h3>${e(j.title)}</h3><p>${e(j.description)}</p><button class="btn" onclick="openApply('${j.id}')">${t('apply')}</button></div></div>`).join(''):`<p style="padding:10px">${t('no')}</p>`;
 notif();
}
function go(i){idx=i;$('tr').style.transform=`translateX(-${i*100}%)`;const c=$('tr').children[i];if(c)$('sl').style.height=c.offsetHeight+'px';[...$('dt').children].forEach((d,k)=>d.className=k==i?'on':'')}
function setL(l){L=l;localStorage.lang=l;$('lg').classList.remove('on');closeM();render();tick()}
$('sl').onclick=()=>{const el=$('inf'+idx)||$('info');el.scrollIntoView({behavior:'smooth',block:'center'});document.querySelectorAll('.inf').forEach(x=>x.classList.remove('hl'));el.classList.add('hl')};
$('lb').onclick=ev=>{ev.stopPropagation();$('bl').classList.remove('on');$('lg').classList.toggle('on')};
$('bb').onclick=ev=>{ev.stopPropagation();$('lg').classList.remove('on');const n=newJobs();$('bl').innerHTML=(n.length?n:J.slice(0,3)).map(j=>`<div>${e(j.title)}</div>`).join('')||`<div>${t('nn')}</div>`;$('bl').classList.toggle('on');localStorage.seen=new Date().toISOString();$('bc').hidden=true};
document.onclick=()=>{$('lg').classList.remove('on');$('bl').classList.remove('on')};
function newJobs(){const s=new Date(localStorage.seen||0);return J.filter(j=>new Date(j.created_at)>s)}
function notif(){const n=newJobs().length;$('bc').hidden=!n;$('bc').textContent=n}
setInterval(()=>go((idx+1)%3),4000);addEventListener('resize',()=>go(idx));
function tick(){const d=new Date(),z='Asia/Riyadh',l=L=='ar'?'ar-SA':L;
 $('clk').textContent=d.toLocaleTimeString('en-GB',{timeZone:z});

 try{$('hj').textContent=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{timeZone:z,dateStyle:'medium'}).format(d)}catch(x){}}
setInterval(tick,1000);tick();
function closeM(){$('md').classList.remove('on')}
$('md').onclick=ev=>{if(ev.target==$('md'))closeM()};
async function openApply(id){cur=J.find(j=>j.id==id);F={};step1();$('md').classList.add('on');
 if(!country){try{const d=await (await fetch('https://ipapi.co/json/')).json();country=d.country_name||'';F.cc=d.country_code;if(!$('f_nat').value){$('f_nat').value=country;$('au').textContent=flag(d.country_code)+' '+t('auto')}}catch(x){}}}
function step1(){$('sh').innerHTML=`<h3>${e(cur.title)}</h3>
<label>${t('name')}</label><input id="f_name" value="${e(F.name||'')}">

<label>${t('email')}</label><input id="f_em" type="email" value="${e(F.em||'')}">
<label>${t('selfie')}</label><input id="f_self" type="file" accept="image/*" capture="user">
<div class="row"><button class="btn gh" onclick="closeM()">✕</button><button class="btn" onclick="next()">${t('next')}</button></div>`}
function next(){F.name=$('f_name').value.trim();F.nat=$('f_nat').value.trim();F.ph=$('f_ph').value.trim();F.em=$('f_em').value.trim();F.self=$('f_self').files[0]||F.self;
 if(!F.name||!F.nat||!F.ph||!F.em||!F.self)return alert(t('fill'));
 const p=PAY||{},r=(k,v)=>v?`<div><button onclick="navigator.clipboard.writeText('${e(v)}');this.textContent='✓'">${t('copy')}</button><span><small>${k}</small> ${e(v)}</span></div>`:'';
 $('sh').innerHTML=`<h3>${t('pay')}</h3><div class="pay"><div><span>${t('fee')}</span><b>${e(p.fee||'')}</b></div>${r('FIB',p.fib)}${r('IBAN',p.iban)}${r('KiCard',p.kicard)}${p.note?`<p>${e(p.note)}</p>`:''}</div>
<label>${t('receipt')}</label><input id="f_rec" type="file" accept="image/*">
<div class="row"><button class="btn gh" onclick="step1()">${t('back')}</button><button class="btn" id="sb" onclick="submit()">${t('send')}</button></div>`}
async function up(f,dir){const p=`${dir}/${Date.now()}-${Math.random().toString(36).slice(2)}.${(f.name.split('.').pop()||'jpg').toLowerCase()}`;
 const r=await sb.storage.from('uploads').upload(p,f);if(r.error)throw r.error;return sb.storage.from('uploads').getPublicUrl(p).data.publicUrl}
async function submit(){const rf=$('f_rec').files[0];if(!rf)return alert(t('fill'));const b=$('sb');b.disabled=true;b.textContent='...';
 try{const [s,r]=await Promise.all([up(F.self,'selfies'),up(rf,'receipts')]);
  const x=await sb.from('applications').insert({job_id:cur.id,job_title:cur.title,full_name:F.name,nationality:F.nat,phone:F.ph,email:F.em,selfie:s,receipt:r});
  if(x.error)throw x.error;$('sh').innerHTML=`<div class="ok"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#006C35" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg><br>${t('done')}</div><button class="btn" style="width:100%" onclick="closeM()">OK</button>`}
 catch(x){alert(t('err'));b.disabled=false;b.textContent=t('send')}}
load();
</script></body></html>
