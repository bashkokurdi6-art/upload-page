
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خزمەتگوزاری ڕەوزە</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial,sans-serif}
body{
  background:#fff;
  color:#123;
  padding:18px;
}
.container{max-width:520px;margin:auto}
.card{
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(14px);
  border:1px solid rgba(0,120,70,.18);
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}
.title{
  text-align:center;
  color:#0b6b3a;
  font-size:24px;
  font-weight:bold;
  border:2px solid #d4af37;
}
.price{
  text-align:center;
  font-size:22px;
  color:#b00000;
  font-weight:bold;
}
label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
  color:#0b6b3a;
}
input,select,textarea{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:1px solid #ddd;
  outline:none;
  background:#fff;
  font-size:15px;
}
textarea{min-height:95px;resize:none}
.row{display:flex;gap:8px}
.row>*{flex:1}
.payments{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:10px;
}
.pay{
  padding:14px 6px;
  border-radius:16px;
  color:white;
  font-weight:bold;
  text-align:center;
  cursor:pointer;
  border:3px solid transparent;
}
.fastpay{background:#c90000}
.fib{background:#00884a}
.qicard{background:#d4a900;color:#111}
.pay.active{border-color:#111;transform:scale(.97)}
.pay-number{
  margin-top:12px;
  background:#f7f7f7;
  border:1px dashed #0b6b3a;
  border-radius:14px;
  padding:13px;
  text-align:center;
  font-weight:bold;
}
.preview{
  width:100%;
  max-height:210px;
  object-fit:cover;
  border-radius:16px;
  margin-top:10px;
  display:none;
  border:1px solid #ddd;
}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:18px;
  background:linear-gradient(135deg,#0b6b3a,#d4af37);
  color:white;
  font-size:18px;
  font-weight:bold;
  margin-top:18px;
  cursor:pointer;
}
button:disabled{opacity:.6}
.msg{text-align:center;margin-top:12px;font-weight:bold}
</style>
</head>

<body>

<div class="container">

  <div class="card title">خزمەتگوزاری ڕەوزە</div>

  <div class="card">
    <div style="text-align:center;color:#0b6b3a;font-weight:bold">نرخی خزمەتگوزاری</div>
    <div class="price" id="priceBox">...</div>
  </div>

  <div class="card">
    <h3 style="text-align:center;color:#b00000;margin-bottom:10px">فۆڕمی پڕکردنەوەی زانیاری</h3>

    <label>ناوی سیانی</label>
    <input id="fullName" type="text" placeholder="ناوی سیانی بنووسە">

    <label>ژمارەی مۆبایل</label>
    <input id="mobile" type="tel" placeholder="07xxxxxxxxx">

    <label>ساڵ و مانگ و ڕۆژ</label>
    <input id="dateGo" type="date">

    <label>کاتژمێر</label>
    <div class="row">
      <select id="hour"></select>
      <select id="minute"></select>
      <select id="ampm">
        <option value="AM">بەیانی</option>
        <option value="PM">شەو</option>
      </select>
    </div>

    <label>جۆر</label>
    <select id="gender">
      <option value="">هەڵبژێرە</option>
      <option value="پیاو">پیاو</option>
      <option value="ئافرەت">ئافرەت</option>
    </select>

    <label>وێنەی ڤیزە</label>
    <input id="visaImg" type="file" accept="image/*">
    <img id="visaPreview" class="preview">

    <label>وێنەی کەسی</label>
    <input id="personImg" type="file" accept="image/*">
    <img id="personPreview" class="preview">

    <label>پارەدان</label>
    <div class="payments">
      <div class="pay fastpay" onclick="selectPay('fastpay',this)">FastPay</div>
      <div class="pay fib" onclick="selectPay('fib',this)">FIB</div>
      <div class="pay qicard" onclick="selectPay('qicard',this)">QiCard</div>
    </div>

    <div class="pay-number" id="payNumber">ژمارەی پارەدان لێرە دەردەکەوێت</div>

    <label>وێنەی پارەدان</label>
    <input id="paymentImg" type="file" accept="image/*">
    <img id="paymentPreview" class="preview">

    <label>تێبینی</label>
    <textarea id="note" placeholder="تێبینی بنووسە..."></textarea>

    <button id="sendBtn" onclick="sendRequest()">ناردن</button>
    <div class="msg" id="msg"></div>
  </div>

</div>

<script>
const SUPABASE_URL = "https://slllcibigutjivauryvc.supabase.co";
const SUPABASE_KEY = "sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let paymentNumbers = {};
let selectedPay = "";

for(let i=1;i<=12;i++){
  hour.innerHTML += `<option value="${i}">${i}</option>`;
}
for(let i=0;i<60;i++){
  let v = String(i).padStart(2,"0");
  minute.innerHTML += `<option value="${v}">${v}</option>`;
}

function preview(input,img){
  input.addEventListener("change",()=>{
    const file=input.files[0];
    if(file){
      img.src=URL.createObjectURL(file);
      img.style.display="block";
    }
  });
}
preview(visaImg,visaPreview);
preview(personImg,personPreview);
preview(paymentImg,paymentPreview);

async function loadData(){
  const {data:priceData} = await db.from("rawda_prices").select("*").limit(1).single();
  priceBox.innerText = priceData?.price || "نرخ دانەنراوە";

  const {data:payData} = await db.from("payment_numbers").select("*").limit(1).single();
  paymentNumbers = payData || {};
}
loadData();

function selectPay(type,el){
  selectedPay = type;
  document.querySelectorAll(".pay").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");

  if(type==="fastpay") payNumber.innerText = paymentNumbers.fastpay || "ژمارەی FastPay دانەنراوە";
  if(type==="fib") payNumber.innerText = paymentNumbers.fib || "ژمارەی FIB دانەنراوە";
  if(type==="qicard") payNumber.innerText = paymentNumbers.qicard || "ژمارەی QiCard دانەنراوە";
}

async function uploadImage(file,folder){
  if(!file) return "";
  const name = folder + "/" + Date.now() + "-" + file.name;
  const {error} = await db.storage.from("rawda-images").upload(name,file);
  if(error) throw error;
  const {data} = db.storage.from("rawda-images").getPublicUrl(name);
  return data.publicUrl;
}

async function sendRequest(){
  msg.innerText="";
  sendBtn.disabled=true;
  sendBtn.innerText="چاوەڕوان بە...";

  try{
    const full_name = fullName.value.trim();
    const phone = mobile.value.trim();
    const date_go = dateGo.value;
    const time_go = `${hour.value}:${minute.value} ${ampm.value}`;
    const genderVal = gender.value;
    const noteVal = note.value.trim();

    if(!full_name || !phone || !date_go || !genderVal || !selectedPay){
      throw new Error("تکایە هەموو خانە پێویستەکان پڕبکەوە");
    }

    const visa_url = await uploadImage(visaImg.files[0],"visa");
    const person_url = await uploadImage(personImg.files[0],"person");
    const payment_url = await uploadImage(paymentImg.files[0],"payment");

    const {error} = await db.from("rawda_requests").insert([{
      naw_syani: full_name,
      mobile: phone,
      katzhmer: time_go,
      date_go: date_go,
      jor: genderVal,
      payment_method: selectedPay,
      visa_image: visa_url,
      personal_image: person_url,
      payment_image: payment_url,
      tebini: noteVal
    }]);

    if(error) throw error;

    msg.style.color="green";
    msg.innerText="داواکارییەکەت بەسەرکەوتوویی نێردرا ✅";
    document.querySelectorAll("input,textarea,select").forEach(e=>e.value="");
    document.querySelectorAll(".preview").forEach(e=>e.style.display="none");
    document.querySelectorAll(".pay").forEach(e=>e.classList.remove("active"));
    payNumber.innerText="ژمارەی پارەدان لێرە دەردەکەوێت";
    selectedPay="";

  }catch(err){
    msg.style.color="red";
    msg.innerText=err.message;
  }

  sendBtn.disabled=false;
  sendBtn.innerText="ناردن";
}
</script>

</body>
</html>
