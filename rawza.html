<!DOCTYPE html>
<html lang="ckb" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>خزمەتگوزاری ڕەوزە | SIWAK</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Noto Sans Arabic', sans-serif;

      background:
      linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
      url('https://images.unsplash.com/photo-1564769625905-50e93615e769?q=80&w=1200');

      background-size:cover;
      background-position:center;

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:20px;

      color:white;
    }

    .card{

      width:100%;
      max-width:800px;

      background:rgba(8,25,18,0.92);

      border:2px solid #d4af37;

      border-radius:28px;

      padding:28px;

      backdrop-filter:blur(10px);

      box-shadow:
      0 0 30px rgba(212,175,55,0.25),
      0 0 80px rgba(0,0,0,0.5);

    }

    .title{

      text-align:center;
      margin-bottom:25px;

    }

    .title h1{

      color:#d4af37;
      font-size:32px;
      margin-bottom:8px;

    }

    .title p{

      color:#ccc;
      font-size:14px;

    }

    .price-box{

      background:#0f3827;

      border:1px solid #d4af37;

      border-radius:18px;

      padding:14px;

      text-align:center;

      margin-bottom:25px;

    }

    .price-box span{

      color:#d4af37;
      font-size:24px;
      font-weight:bold;

    }

    .grid{

      display:grid;

      grid-template-columns:1fr 1fr;

      gap:16px;

    }

    .group{

      margin-bottom:16px;

    }

    label{

      display:block;

      margin-bottom:8px;

      color:#d4af37;

      font-size:14px;

    }

    input,
    select,
    textarea{

      width:100%;

      padding:14px;

      border:none;

      border-radius:16px;

      background:#10251c;

      color:white;

      font-size:15px;

      border:1px solid transparent;

      outline:none;

      transition:.3s;

    }

    input:focus,
    select:focus,
    textarea:focus{

      border-color:#d4af37;

      box-shadow:0 0 10px rgba(212,175,55,0.4);

    }

    textarea{

      resize:none;
      height:120px;

    }

    .upload{

      background:#10251c;

      border:1px dashed #d4af37;

      border-radius:16px;

      padding:15px;

    }

    .submit-btn{

      width:100%;

      padding:16px;

      border:none;

      border-radius:18px;

      background:linear-gradient(135deg,#d4af37,#f7d978);

      color:#062015;

      font-size:17px;

      font-weight:bold;

      cursor:pointer;

      margin-top:10px;

      transition:.3s;

    }

    .submit-btn:hover{

      transform:translateY(-2px);

    }

    .success{

      margin-top:15px;

      text-align:center;

      color:#79ffb0;

      display:none;

    }

    .loading{

      display:none;

      text-align:center;

      margin-top:12px;

      color:#d4af37;

    }

    @media(max-width:768px){

      .grid{

        grid-template-columns:1fr;

      }

      .card{

        padding:20px;

      }

      .title h1{

        font-size:26px;

      }

    }

  </style>
</head>

<body>

<div class="card">

  <div class="title">

    <h1>خزمەتگوزاری ڕەوزە</h1>

    <p>SIWAK | حج و عومرە</p>

  </div>

  <div class="price-box">

    نرخی ئەمڕۆ

    <br><br>

    <span id="price">...</span>

  </div>

  <form id="form">

    <div class="grid">

      <div class="group">

        <label>ناوی سیانی</label>

        <input type="text" id="naw" required>

      </div>

      <div class="group">

        <label>ژمارەی مۆبایل</label>

        <input type="text" id="mobile" required>

      </div>

    </div>

    <div class="grid">

      <div class="group">

        <label>کاتژمێر</label>

        <input type="time" id="katzhmer">

      </div>

      <div class="group">

        <label>ڕۆژ / مانگ / ساڵ</label>

        <input type="date" id="roj">

      </div>

    </div>

    <div class="grid">

      <div class="group">

        <label>ڕەگەز</label>

        <select id="gender">

          <option value="پیاو">پیاو</option>

          <option value="ئافرەت">ئافرەت</option>

        </select>

      </div>

      <div class="group">

        <label>پارەدان</label>

        <select id="paradan">

          <option value="FastPay">FastPay</option>

          <option value="FIB">FIB</option>

          <option value="Qi Card">Qi Card</option>

        </select>

      </div>

    </div>

    <div class="group upload">

      <label>وێنەی پاسپۆرت</label>

      <input type="file" id="passport" accept="image/*" required>

    </div>

    <br>

    <div class="group upload">

      <label>وێنەی پارەدان</label>

      <input type="file" id="payment" accept="image/*" required>

    </div>

    <br>

    <div class="group">

      <label>تێبینی</label>

      <textarea id="tebini"></textarea>

    </div>

    <button class="submit-btn" type="submit">

      ناردنی داواکاری

    </button>

    <div class="loading" id="loading">

      تکایە چاوەڕێ بکە...

    </div>

    <div class="success" id="success">

      داواکاریەکەت بەسەرکەوتوویی نێردرا ✨

    </div>

  </form>

</div>

<script>

const SUPABASE_URL =
"https://slllcibigutjivauryvc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);



// ======================
// GET PRICE
// ======================

async function loadPrice(){

  const { data } = await client
  .from('rawda_prices')
  .select('*')
  .limit(1)
  .single();

  if(data){

    document.getElementById('price').innerText =
    data.price;

  }

}

loadPrice();



// ======================
// IMAGE UPLOAD
// ======================

async function uploadImage(file){

  const fileName =
  Date.now() + "-" + file.name;

  const { error } = await client
  .storage
  .from('rawda-images')
  .upload(fileName,file);

  if(error){

    alert("هەڵە لە upload");

    return null;

  }

  const { data } = client
  .storage
  .from('rawda-images')
  .getPublicUrl(fileName);

  return data.publicUrl;

}



// ======================
// FORM SUBMIT
// ======================

const form = document.getElementById("form");

form.addEventListener("submit", async(e)=>{

  e.preventDefault();

  document.getElementById("loading").style.display = "block";



  const passportFile =
  document.getElementById("passport").files[0];

  const paymentFile =
  document.getElementById("payment").files[0];



  const passportUrl =
  await uploadImage(passportFile);

  const paymentUrl =
  await uploadImage(paymentFile);



  const { error } = await client
  .from("rawda_requests")
  .insert([{

    naw_syani:
    document.getElementById("naw").value,

    mobile:
    document.getElementById("mobile").value,

    katzhmer:
    document.getElementById("katzhmer").value,

    roj:
    document.getElementById("roj").value,

    gender:
    document.getElementById("gender").value,

    paradan:
    document.getElementById("paradan").value,

    passport_image:
    passportUrl,

    payment_image:
    paymentUrl,

    tebini:
    document.getElementById("tebini").value

  }]);



  document.getElementById("loading").style.display = "none";



  if(error){

    alert("هەڵەیەک ڕوویدا");

    console.log(error);

    return;

  }



  document.getElementById("success").style.display = "block";

  form.reset();

});

</script>

</body>
</html>
