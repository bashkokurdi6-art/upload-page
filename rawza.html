<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خزمەتگوزاری ڕەوزە</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Noto Sans Arabic', Tahoma, Arial, sans-serif !important;
}

body{
  min-height:100vh;
  background:
    linear-gradient(rgba(0,50,25,.55),rgba(0,50,25,.65)),
    url("Rawdah.png") center/cover fixed no-repeat;
  color:#17453a;
  padding:14px;
  direction:rtl;
}

.container{
  max-width:520px;
  margin:auto;
}

.card{
  background:rgba(255,255,255,.16);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:2px solid rgba(212,175,55,.7);
  border-radius:24px;
  padding:15px;
  margin-bottom:13px;
  box-shadow:
    0 8px 30px rgba(0,0,0,.25),
    inset 0 0 18px rgba(255,255,255,.18);
}

.title{
  text-align:center;
  color:#ffd86b;
  font-size:24px;
  font-weight:800;
  border:2px solid #d4af37;
  text-shadow:0 2px 6px rgba(0,0,0,.5);
}

.price-title{
  text-align:center;
  color:#fff3b0;
  font-weight:700;
  font-size:16px;
}

.price{
  text-align:center;
  font-size:28px;
  color:#ff3030;
  font-weight:800;
  margin-top:3px;
  text-shadow:0 1px 4px rgba(0,0,0,.45);
}

h3{
  text-align:center;
  color:#ff3030;
  margin-bottom:12px;
  font-size:20px;
  font-weight:800;
}

label{
  display:block;
  margin:8px 0 5px;
  font-size:14px;
  font-weight:800;
  color:#ffe27a;
}

input,select,textarea{
  width:100%;
  min-height:43px;
  padding:10px;
  border-radius:14px;
  border:1.5px solid rgba(212,175,55,.85);
  outline:none;
  background:rgba(255,255,255,.88);
  font-size:14px;
  font-weight:700;
  direction:rtl;
  text-align:right;
  color:#064225;
}

textarea{
  min-height:58px;
  resize:none;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.row{
  display:flex;
  gap:8px;
}

.row>*{
  flex:1;
}

.upload-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:10px;
}

.upload-box,
.payment-glass{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1.5px solid rgba(212,175,55,.55);
  border-radius:18px;
  padding:10px;
}

.payments{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:9px;
  margin-top:8px;
}

.pay{
  padding:12px 5px;
  border-radius:16px;
  font-weight:800;
  text-align:center;
  cursor:pointer;
  border:2px solid #d4af37;
  font-size:13px;
  box-shadow:0 6px 15px rgba(0,0,0,.22);
}

.fastpay{background:#b00000;color:white}
.fib{background:#006b3a;color:white}
.qicard{background:#d4af37;color:#111}

.pay.active{
  border-color:#fff;
  transform:scale(.96);
  box-shadow:0 0 0 3px rgba(255,255,255,.25);
}

.pay-number{
  margin:10px 0;
  background:rgba(255,255,255,.75);
  border:2px dashed #d4af37;
  border-radius:14px;
  padding:11px;
  text-align:center;
  font-weight:800;
  color:#b00000;
  font-size:14px;
}

.preview{
  width:100%;
  max-height:120px;
  object-fit:cover;
  border-radius:14px;
  margin-top:8px;
  display:none;
  border:2px solid #d4af37;
}

button{
  width:100%;
  padding:14px;
  border:2px solid #d4af37;
  border-radius:20px;
  background:linear-gradient(135deg,#004d2b,#008f4c);
  color:white;
  font-size:18px;
  font-weight:800;
  margin-top:13px;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.28);
}

button:disabled{
  opacity:.6;
}

.msg{
  text-align:center;
  margin-top:12px;
  font-weight:800;
  color:white;
}

@media(max-width:430px){
  body{padding:10px}
  .card{padding:13px;border-radius:20px}
  .title{font-size:22px}
  .grid{grid-template-columns:1fr;gap:3px}
  .upload-grid{grid-template-columns:1fr 1fr}
  .pay{font-size:12px;padding:10px 3px}
}
</style>
</head>

<body>

<div class="container">

  <div class="card title">خزمەتگوزاری ڕەوزە</div>

  <div class="card">
    <div class="price-title">نرخی خزمەتگوزاری</div>
    <div class="price" id="priceBox">...</div>
  </div>

  <div class="card">
    <h3>فۆڕمی پڕکردنەوەی زانیاری</h3>

    <div class="grid">
      <div>
        <label>ناوی سیانی</label>
        <input id="fullName" type="text" placeholder="ناوی سیانی بنووسە">
      </div>

      <div>
        <label>ژمارەی مۆبایل</label>
        <input id="mobile" type="tel" placeholder="07xxxxxxxxx">
      </div>

      <div>
        <label>ساڵ و مانگ و ڕۆژ</label>
        <input id="dateGo" type="date">
      </div>

      <div>
        <label>جۆر</label>
        <select id="gender">
          <option value="">هەڵبژێرە</option>
          <option value="پیاو">پیاو</option>
          <option value="ئافرەت">ئافرەت</option>
        </select>
      </div>
    </div>

    <label>کاتژمێر</label>
    <div class="row">
      <select id="hour"></select>
      <select id="minute"></select>
      <select id="ampm">
        <option value="AM">بەیانی</option>
        <option value="PM">شەو</option>
      </select>
    </div>

    <div class="upload-grid">
      <div class="upload-box">
        <label>وێنەی ڤیزە</label>
        <input id="visaImg" type="file" accept="image/*">
        <img id="visaPreview" class="preview">
      </div>

      <div class="upload-box">
        <label>وێنەی پاسپۆرت</label>
        <input id="passportImg" type="file" accept="image/*">
        <img id="passportPreview" class="preview">
      </div>
    </div>

    <label>شێوازی پارەدان</label>
    <div class="payments">
      <div class="pay fastpay" onclick="selectPay('fastpay',this)">FastPay</div>
      <div class="pay fib" onclick="selectPay('fib',this)">FIB</div>
      <div class="pay qicard" onclick="selectPay('qicard',this)">QiCard</div>
    </div>

    <div class="payment-glass">
      <div class="pay-number" id="payNumber">ژمارەی پارەدان لێرە دەردەکەوێت</div>

      <label>وێنەی پارەدان</label>
      <input id="paymentImg" type="file" accept="image/*">
      <img id="paymentPreview" class="preview">
    </div>

    <label>تێبینی</label>
    <textarea id="note" placeholder="تێبینی بنووسە..."></textarea>

    <button id="sendBtn" onclick="sendRequest()">ناردنی داواکاری</button>
    <div class="msg" id="msg"></div>
  </div>

</div>

<script>
const SUPABASE_URL = "https://slllcibigutjivauryvc.supabase.co";
const SUPABASE_KEY = "sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let paymentNumbers = {};
let selectedPay = "";

for(let i=1;i<=12;i++){
  hour.innerHTML += `<option value="${i}">${i}</option>`;
}

for(let i=0;i<60;i++){
  let v = String(i).padStart(2,"0");
  minute.innerHTML += `<option value="${v}">${v}</option>`;
}

function preview(input,img){
  input.addEventListener("change",()=>{
    const file=input.files[0];
    if(file){
      img.src=URL.createObjectURL(file);
      img.style.display="block";
    }
  });
}

preview(visaImg,visaPreview);
preview(passportImg,passportPreview);
preview(paymentImg,paymentPreview);

async function loadData(){
  const {data:priceData} = await db.from("rawda_prices").select("*").limit(1).single();
  priceBox.innerText = priceData?.price || "3500 دینار";

  const {data:payData} = await db.from("payment_numbers").select("*").limit(1).single();
  paymentNumbers = payData || {};
}

loadData();

function selectPay(type,el){
  selectedPay = type;
  document.querySelectorAll(".pay").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");

  if(type==="fastpay") payNumber.innerText = paymentNumbers.fastpay || "ژمارەی FastPay دانەنراوە";
  if(type==="fib") payNumber.innerText = paymentNumbers.fib || "ژمارەی FIB دانەنراوە";
  if(type==="qicard") payNumber.innerText = paymentNumbers.qicard || "ژمارەی QiCard دانەنراوە";
}

async function uploadImage(file,folder){
  if(!file) return "";
  const safeName = file.name.replaceAll(" ","-");
  const name = folder + "/" + Date.now() + "-" + safeName;

  const {error} = await db.storage.from("rawda-images").upload(name,file);
  if(error) throw error;

  const {data} = db.storage.from("rawda-images").getPublicUrl(name);
  return data.publicUrl;
}

async function sendRequest(){
  msg.innerText="";
  sendBtn.disabled=true;
  sendBtn.innerText="چاوەڕوان بە...";

  try{
    const full_name = fullName.value.trim();
    const phone = mobile.value.trim();
    const date_go = dateGo.value;
    const time_go = `${hour.value}:${minute.value} ${ampm.value}`;
    const genderVal = gender.value;
    const noteVal = note.value.trim();

    if(!full_name || !phone || !date_go || !genderVal || !selectedPay){
      throw new Error("تکایە هەموو خانە پێویستەکان پڕبکەوە");
    }

    const visa_url = await uploadImage(visaImg.files[0],"visa");
    const passport_url = await uploadImage(passportImg.files[0],"passport");
    const payment_url = await uploadImage(paymentImg.files[0],"payment");

    const {error} = await db.from("rawda_requests").insert([{
      naw_syani: full_name,
      mobile: phone,
      katzhmer: time_go,

      date_go: date_go,
      gender: genderVal,
      payment_method: selectedPay,
      visa_url: visa_url,
      passport_url: passport_url,
      payment_url: payment_url,
      note: noteVal
    }]);

    if(error) throw error;

    msg.style.color="#00ff8a";
    msg.innerText="داواکارییەکەت بەسەرکەوتوویی نێردرا ✅";

    fullName.value="";
    mobile.value="";
    dateGo.value="";
    gender.value="";
    note.value="";
    visaImg.value="";
    passportImg.value="";
    paymentImg.value="";
    visaPreview.style.display="none";
    passportPreview.style.display="none";
    paymentPreview.style.display="none";
    payNumber.innerText="ژمارەی پارەدان لێرە دەردەکەوێت";
    selectedPay="";
    document.querySelectorAll(".pay").forEach(x=>x.classList.remove("active"));

  }catch(err){
    msg.style.color="#ffdddd";
    msg.innerText=err.message;
  }

  sendBtn.disabled=false;
  sendBtn.innerText="ناردنی داواکاری";
}
</script>

</body>
</html>
