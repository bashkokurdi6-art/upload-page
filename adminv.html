<!DOCTYPE html>
<html lang="ckb" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIWAK VISA ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Noto Sans Arabic',sans-serif;

background:
linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.85)),
url('https://images.unsplash.com/photo-1542816417-0983670d7f62?q=80&w=1200');

background-size:cover;
background-position:center;

min-height:100vh;

padding:20px;

color:white;

}

.login-box,
.dashboard{

max-width:1300px;

margin:auto;

background:rgba(7,20,15,.94);

border:2px solid #d4af37;

border-radius:28px;

padding:25px;

backdrop-filter:blur(10px);

box-shadow:
0 0 30px rgba(212,175,55,.2);

}

.dashboard{
display:none;
}

h1{

text-align:center;

color:#d4af37;

margin-bottom:25px;

}

.login-input{

width:100%;

padding:15px;

border:none;

border-radius:16px;

background:#10251c;

color:white;

font-size:16px;

margin-bottom:15px;

outline:none;

}

.login-btn{

width:100%;

padding:15px;

border:none;

border-radius:16px;

background:linear-gradient(135deg,#d4af37,#f5d67a);

color:#062015;

font-weight:bold;

font-size:16px;

cursor:pointer;

}

.top-box{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

margin-bottom:25px;

}

.card-box{

background:#0f3827;

padding:20px;

border-radius:20px;

border:1px solid #d4af37;

}

.card-box h3{

margin-bottom:15px;

color:#d4af37;

}

.input{

width:100%;

padding:14px;

border:none;

border-radius:14px;

background:#10251c;

color:white;

margin-bottom:10px;

}

.save-btn{

padding:12px 20px;

border:none;

border-radius:14px;

background:#d4af37;

color:#062015;

font-weight:bold;

cursor:pointer;

width:100%;

}

.requests{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(320px,1fr));

gap:20px;

}

.card{

background:#0f241b;

border:1px solid rgba(212,175,55,.25);

border-radius:24px;

padding:18px;

}

.card h3{

color:#d4af37;

margin-bottom:15px;

}

.item{

margin-bottom:10px;

font-size:14px;

line-height:1.8;

}

.images{

display:flex;

gap:10px;

margin-top:15px;

flex-wrap:wrap;

}

.images img{

width:100px;

height:100px;

object-fit:cover;

border-radius:14px;

border:1px solid #d4af37;

}

.delete-btn{

margin-top:15px;

width:100%;

padding:13px;

border:none;

border-radius:14px;

background:#b3261e;

color:white;

font-weight:bold;

cursor:pointer;

}

@media(max-width:768px){

.top-box{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>



<div class="login-box" id="loginBox">

<h1>SIWAK VISA ADMIN</h1>

<input
type="password"
id="password"
class="login-input"
placeholder="وشەی نهێنی">

<button
class="login-btn"
onclick="login()">

چوونە ژوورەوە

</button>

</div>



<div class="dashboard" id="dashboard">

<h1>بەڕێوەبردنی ڤیزە</h1>



<div class="top-box">



<div class="card-box">

<h3>نرخەکانی ڤیزە</h3>

<input
type="text"
id="yearVisa"
class="input"
placeholder="1 Year Visa">

<input
type="text"
id="monthVisa"
class="input"
placeholder="3 Months Visa">

<button
class="save-btn"
onclick="updatePrices()">

پاشەکەوتکردن

</button>

</div>



<div class="card-box">

<h3>ژمارەکانی پارەدان</h3>

<input
type="text"
id="fastpay"
class="input"
placeholder="FastPay">

<input
type="text"
id="fib"
class="input"
placeholder="FIB">

<input
type="text"
id="qi"
class="input"
placeholder="Qi Card">

<button
class="save-btn"
onclick="saveNumbers()">

پاشەکەوتکردن

</button>

</div>



</div>



<div class="requests" id="requests"></div>

</div>



<script>

const ADMIN_PASSWORD = "SIWAK2026";



function login(){

const pass =
document.getElementById("password").value;

if(pass === ADMIN_PASSWORD){

document.getElementById("loginBox").style.display = "none";

document.getElementById("dashboard").style.display = "block";



loadRequests();

loadPrices();

loadNumbers();

}else{

alert("وشەی نهێنی هەڵەیە");

}

}



// ======================
// SUPABASE
// ======================

const SUPABASE_URL =
"https://slllcibigutjivauryvc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



// ======================
// LOAD PRICES
// ======================

async function loadPrices(){

const { data } =
await client
.from("visa_prices")
.select("*")
.limit(1)
.single();

if(data){

document.getElementById("yearVisa").value =
data.visa_1year;

document.getElementById("monthVisa").value =
data.visa_3months;

}

}



// ======================
// UPDATE PRICES
// ======================

async function updatePrices(){

await client
.from("visa_prices")
.update({

visa_1year:
document.getElementById("yearVisa").value,

visa_3months:
document.getElementById("monthVisa").value

})
.eq("id",1);

alert("نرخەکان نوێکرانەوە");

}



// ======================
// LOAD PAYMENT NUMBERS
// ======================

async function loadNumbers(){

const { data } =
await client
.from("payment_numbers")
.select("*")
.limit(1)
.single();

if(data){

document.getElementById("fastpay").value =
data.fastpay;

document.getElementById("fib").value =
data.fib;

document.getElementById("qi").value =
data.qi;

}

}



// ======================
// SAVE PAYMENT NUMBERS
// ======================

async function saveNumbers(){

await client
.from("payment_numbers")
.update({

fastpay:
document.getElementById("fastpay").value,

fib:
document.getElementById("fib").value,

qi:
document.getElementById("qi").value

})
.eq("id",1);

alert("ژمارەکان نوێکرانەوە");

}



// ======================
// LOAD REQUESTS
// ======================

async function loadRequests(){

const { data } =
await client
.from("visa_requests")
.select("*")
.order("id",{ascending:false});

const requests =
document.getElementById("requests");

requests.innerHTML = "";



data.forEach(item=>{

requests.innerHTML += `

<div class="card">

<h3>${item.full_name}</h3>

<div class="item">
📱 ${item.mobile}
</div>

<div class="item">
🛂 ${item.visa_type}
</div>

<div class="item">
💳 ${item.payment_method}
</div>

<div class="item">
📝 ${item.notes || "-"}
</div>

<div class="item">
🎫 ${item.tracking_code}
</div>

<div class="images">

<a href="${item.passport_image}" target="_blank">

<img src="${item.passport_image}">

</a>

<a href="${item.personal_image}" target="_blank">

<img src="${item.personal_image}">

</a>

<a href="${item.payment_image}" target="_blank">

<img src="${item.payment_image}">

</a>

</div>

<button
class="delete-btn"
onclick="deleteRequest(${item.id})">

سڕینەوە

</button>

</div>

`;

});

}



// ======================
// DELETE
// ======================

async function deleteRequest(id){

const ok =
confirm("دڵنیایت؟");

if(!ok) return;

await client
.from("visa_requests")
.delete()
.eq("id",id);

loadRequests();

}

</script>

</body>
</html>
