<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07110d"><title>KR Exchange Admin</title>
<link rel="icon" href="KR.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#050a08;--panel:rgba(12,25,19,.75);--line:rgba(255,255,255,.10);--txt:#f5fff8;--muted:#91a49a;--g:#22c55e;--r:#ef4444}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,rgba(34,197,94,.16),transparent 30%),radial-gradient(circle at 95% 0,rgba(239,68,68,.11),transparent 25%),#050a08;color:var(--txt);font-family:"Noto Kufi Arabic",sans-serif;min-height:100vh}
.wrap{width:min(1080px,calc(100% - 18px));margin:auto}.glass{background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);box-shadow:0 22px 65px rgba(0,0,0,.38);backdrop-filter:blur(18px)}
header{position:sticky;top:0;z-index:10;background:rgba(3,8,6,.72);backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,255,255,.07)}.top{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px}.brand img{width:42px;height:42px;object-fit:contain;background:rgba(255,255,255,.05);border-radius:12px;padding:4px}.brand b{font:800 13px Inter}
button,input,select{font:inherit}.ghost{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;border-radius:12px;padding:9px 12px;cursor:pointer}
main{padding:18px 0 34px}.login{max-width:430px;margin:8vh auto 0;border-radius:24px;padding:22px}.login h1{font-size:20px;margin:0 0 6px}.muted{color:var(--muted);font-size:11px;line-height:1.9}
label{display:block;color:#a8bbb1;font-size:11px;margin:12px 0 6px}input,select{width:100%;border:1px solid var(--line);background:rgba(2,9,6,.8);color:#fff;border-radius:13px;padding:12px;outline:none}.primary{width:100%;margin-top:14px;border:0;border-radius:14px;padding:13px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#031309;font-weight:800;cursor:pointer}
#app{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{border-radius:18px;padding:15px}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{display:block;font:800 22px Inter;margin-top:5px}
.panel{border-radius:22px;padding:16px;margin-bottom:14px}.panel h2{font-size:16px;margin:0 0 12px}.wallets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.wallet{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);border-radius:17px;padding:12px}.wtop{display:flex;align-items:center;gap:9px}.wtop img{width:43px;height:43px;object-fit:contain;border-radius:12px;background:#fff;padding:4px}.wtop b{font-size:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save{margin-top:10px;width:100%;border:1px solid rgba(34,197,94,.25);background:rgba(34,197,94,.1);color:#7df2a3;border-radius:12px;padding:10px;cursor:pointer;font-weight:800}
.tablewrap{overflow:auto;border:1px solid rgba(255,255,255,.07);border-radius:15px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:right;padding:10px;border-bottom:1px solid rgba(255,255,255,.06);font-size:10px}th{color:#97a99f;background:rgba(255,255,255,.025);position:sticky;top:0}td{color:#eaf5ee}.code{font:700 11px Inter}.status{min-width:105px;padding:7px;border-radius:9px}.refresh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.danger{color:#f87171}.ok{color:#4ade80}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;background:#eefbf3;color:#06100a;padding:10px 14px;border-radius:12px;font-size:11px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.wallets{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.brand b{display:none}}
</style>
</head>
<body>
<header><div class="wrap top"><div class="brand"><img src="KR.png" alt=""><b>KR EXCHANGE ADMIN</b></div><button id="logout" class="ghost" style="display:none">چوونەدەرەوە</button></div></header>
<main class="wrap">
<section id="login" class="login glass">
<h1>بەڕێوەبەرایەتی KR Exchange</h1><div class="muted">بە ئیمەیڵ و وشەی نهێنی Supabase Auth بچۆ ژوورەوە.</div>
<label>ئیمەیڵ</label><input id="email" type="email" autocomplete="username">
<label>وشەی نهێنی</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn" class="primary">چوونەژوورەوە</button>
<div id="loginMsg" class="muted" style="margin-top:10px"></div>
</section>

<section id="app">
<div class="grid">
<div class="stat glass"><small>هەموو داواکاری</small><b id="sAll">0</b></div>
<div class="stat glass"><small>چاوەڕوان</small><b id="sPending">0</b></div>
<div class="stat glass"><small>تەواوکراو</small><b id="sDone">0</b></div>
<div class="stat glass"><small>ڕەتکراو</small><b id="sRejected">0</b></div>
</div>

<div class="panel glass">
<h2>نرخ و ژمارەی وەلێتەکان</h2>
<div id="wallets" class="wallets"></div>
</div>

<div class="panel glass">
<div class="refresh"><h2 style="margin:0">داواکارییەکان</h2><button class="ghost" id="refresh">نوێکردنەوە</button></div>
<div class="tablewrap"><table><thead><tr><th>کۆد</th><th>لە</th><th>بۆ</th><th>بڕ</th><th>وەرگرتن</th><th>ئەکاونتی وەرگر</th><th>کات</th><th>دۆخ</th></tr></thead><tbody id="requests"></tbody></table></div>
</div>
</section>
</main>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL="https://xeslocltzfapocwrssst.supabase.co";
const SUPABASE_KEY="sb_publishable_tVNj4U0o80SENtjRyYsf_w_W_RrTC0O";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function toast(m){$("toast").textContent=m;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

$("loginBtn").onclick=async()=>{
 const email=$("email").value.trim(),password=$("password").value;
 $("loginBtn").disabled=true;
 const {error}=await sb.auth.signInWithPassword({email,password});
 $("loginBtn").disabled=false;
 if(error){$("loginMsg").textContent=error.message;return}
 await boot();
};
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("refresh").onclick=()=>loadRequests();

async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){$("login").style.display="block";$("app").style.display="none";return}
 const {data:admin,error}=await sb.from("admin_users").select("user_id").eq("user_id",session.user.id).maybeSingle();
 if(error||!admin){
   await sb.auth.signOut();
   $("loginMsg").innerHTML='<span class="danger">ئەم هەژمارە وەک ئەدمین تۆمار نەکراوە. UID ـەکەی لە admin_users زیاد بکە.</span>';
   return;
 }
 $("login").style.display="none";$("app").style.display="block";$("logout").style.display="inline-block";
 await Promise.all([loadWallets(),loadRequests()]);
}

async function loadWallets(){
 const {data,error}=await sb.from("wallets").select("*").order("sort_order");
 if(error){toast(error.message);return}
 $("wallets").innerHTML=(data||[]).map(w=>`<div class="wallet">
  <div class="wtop"><img src="${esc(w.image_file)}"><div><b>${esc(w.name)}</b><div class="muted">${esc(w.slug)}</div></div></div>
  <div class="fields">
   <div><label>نرخ بۆ 1 USD (IQD)</label><input id="rate_${w.id}" type="number" step="0.01" value="${Number(w.rate_iqd_per_usd)}"></div>
   <div><label>ژمارە / Account</label><input id="acc_${w.id}" value="${esc(w.account_number||"")}"></div>
  </div>
  <button class="save" onclick="saveWallet('${w.id}')">پاشەکەوتکردن</button>
 </div>`).join("");
}
window.saveWallet=async(id)=>{
 const rate=Number($("rate_"+id).value),account_number=$("acc_"+id).value.trim();
 const {error}=await sb.from("wallets").update({rate_iqd_per_usd:rate,account_number,updated_at:new Date().toISOString()}).eq("id",id);
 if(error)toast(error.message);else toast("پاشەکەوت کرا");
};

async function loadRequests(){
 const {data,error}=await sb.from("exchange_requests").select("*").order("created_at",{ascending:false}).limit(200);
 if(error){toast(error.message);return}
 const rows=data||[];$("sAll").textContent=rows.length;$("sPending").textContent=rows.filter(x=>x.status==="pending").length;
 $("sDone").textContent=rows.filter(x=>x.status==="completed").length;$("sRejected").textContent=rows.filter(x=>x.status==="rejected").length;
 $("requests").innerHTML=rows.map(r=>`<tr>
 <td class="code">${esc(r.receipt_code)}</td><td>${esc(r.from_wallet)}</td><td>${esc(r.to_wallet)}</td>
 <td>${Number(r.amount).toLocaleString()}</td><td>${Number(r.estimated_receive||0).toLocaleString()}</td>
 <td class="code">${esc(r.receive_account)}</td><td>${new Date(r.created_at).toLocaleString()}</td>
 <td><select class="status" onchange="changeStatus('${esc(r.receipt_code)}',this.value)">
  ${["pending","approved","completed","rejected"].map(s=>`<option value="${s}" ${r.status===s?"selected":""}>${s}</option>`).join("")}
 </select></td></tr>`).join("");
}
window.changeStatus=async(code,status)=>{
 const {error}=await sb.from("exchange_requests").update({status,updated_at:new Date().toISOString()}).eq("receipt_code",code);
 if(error)toast(error.message);else{toast("دۆخ نوێکرایەوە");loadRequests()}
};

sb.auth.onAuthStateChange(()=>{});
boot();
</script>
</body>
</html>
