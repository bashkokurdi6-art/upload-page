<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چەرخی دیاری عومرە | سروشتی عەرەفە</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --teal-deep:   #0e6b66;
    --teal-dark:   #073b38;
    --teal-mid:    #12817b;
    --gold:        #d4af37;
    --gold-light:  #f0d377;
    --gold-dark:   #a8791f;
    --cream:       #fdf8ec;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, rgba(212,175,55,0.10), transparent 55%),
      var(--teal-dark);
    color:var(--cream);
    font-family:'Tajawal', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 30px 16px 50px;
  }

  .logo{
    width:88px; height:88px;
    border-radius:50%;
    margin-bottom:10px;
    box-shadow:0 0 0 3px var(--gold), 0 8px 24px rgba(0,0,0,0.4);
  }

  .brand-en{
    font-size:11px;
    letter-spacing:3px;
    color:var(--gold-light);
    margin-bottom:2px;
  }

  h1{
    font-family:'Amiri', serif;
    font-size:28px;
    text-align:center;
    color:var(--cream);
    margin-bottom:4px;
  }

  .sub{
    font-size:13px;
    color:rgba(253,248,236,0.6);
    text-align:center;
    margin-bottom:26px;
  }

  /* ---------- wheel ---------- */
  .wheel-frame{
    position:relative;
    width:min(360px, 86vw);
    aspect-ratio:1/1;
    margin-bottom:22px;
  }

  .wheel-frame::before{
    content:"";
    position:absolute;
    inset:-14px;
    border-radius:50%;
    border:3px solid var(--gold);
    background:
      repeating-conic-gradient(var(--gold-light) 0deg 4deg, transparent 4deg 18deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
    opacity:0.85;
  }

  .pointer{
    position:absolute;
    top:-22px; left:50%;
    transform:translateX(-50%);
    font-size:34px;
    color:var(--gold-light);
    filter:drop-shadow(0 3px 5px rgba(0,0,0,0.5));
    z-index:5;
  }

  .wheel-wrap{
    width:100%; height:100%;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 0 4px var(--teal-dark), 0 0 0 7px var(--gold), 0 14px 40px rgba(0,0,0,0.55);
  }

  #wheelCanvas{ display:block; width:100%; height:100%; }

  .spins-count{
    font-size:13px;
    color:rgba(253,248,236,0.65);
    margin-bottom:16px;
    text-align:center;
  }
  .spins-count b{ color:var(--gold-light); }

  button#spinBtn{
    display:block;
    width:min(360px,86vw);
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    color:var(--teal-dark);
    font-family:'Tajawal', sans-serif;
    font-weight:900;
    font-size:16.5px;
    letter-spacing:0.5px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(212,175,55,0.25);
    transition:transform .15s ease, opacity .15s ease;
  }
  button#spinBtn:hover:not(:disabled){ transform:translateY(-1px); }
  button#spinBtn:disabled{ opacity:0.5; cursor:not-allowed; }

  .msg{
    margin-top:12px;
    font-size:13px;
    text-align:center;
    color:rgba(253,248,236,0.55);
    word-break: break-word;
    padding: 0 10px;
  }
  .msg.error{ color:#f87171; font-weight: bold; }

  /* ---------- winners board ---------- */
  .board{
    width:min(460px,92vw);
    margin-top:34px;
  }

  .board-title{
    font-family:'Amiri', serif;
    font-size:19px;
    text-align:center;
    color:var(--gold-light);
    margin-bottom:14px;
  }

  .winner-card{
    position:relative;
    background:linear-gradient(180deg, var(--teal-mid), var(--teal-deep));
    border:1.5px solid var(--gold);
    border-radius:12px;
    padding:14px 44px 14px 16px;
    margin-bottom:12px;
    animation:pop .35s ease;
  }

  @keyframes pop{ from{opacity:0; transform:scale(0.94);} to{opacity:1; transform:scale(1);} }

  .winner-card .name{
    font-family:'Amiri', serif;
    font-size:18px;
    color:var(--cream);
    margin-bottom:6px;
  }

  .winner-card .meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px 16px;
    font-size:12.5px;
    color:rgba(253,248,236,0.75);
  }

  .winner-card .meta span{ display:flex; align-items:center; gap:4px; }
  .winner-card .meta .phone{ direction:ltr; }

  .winner-card .delete-btn{
    position:absolute;
    top:10px; left:10px;
    width:26px; height:26px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,0.25);
    color:var(--gold-light);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease;
  }
  .winner-card .delete-btn:hover{ background:rgba(0,0,0,0.45); }

  .board-empty{
    text-align:center;
    font-size:12.5px;
    color:rgba(253,248,236,0.4);
  }

  footer{
    margin-top:30px;
    font-size:11px;
    color:rgba(253,248,236,0.3);
    text-align:center;
  }

  /* ---------- winner reveal overlay ---------- */
  .winner-reveal{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    pointer-events:none;
    background:rgba(7,59,56,0);
    transition: background .5s ease;
  }
  .winner-reveal.show-bg{
    background:rgba(7,59,56,0.55);
  }

  .winner-reveal .reveal-box{
    text-align:center;
    padding:36px 40px;
    max-width:92vw;
    border-radius:18px;
    border:2px solid var(--gold);
    background:linear-gradient(180deg, var(--teal-mid), var(--teal-deep));
    box-shadow:0 0 0 6px rgba(212,175,55,0.18), 0 20px 50px rgba(0,0,0,0.6);
    opacity:0;
    transform: translateY(0) scale(0.3);
    transition: transform .55s cubic-bezier(.2,1.4,.4,1), opacity .35s ease;
  }

  .winner-reveal .reveal-box.pop-in{
    opacity:1;
    transform: translateY(0) scale(1);
  }

  .winner-reveal .reveal-box.fly-down{
    transition: transform .75s cubic-bezier(.5,0,.7,1), opacity .55s ease .2s;
    opacity:0;
  }

  .winner-reveal .reveal-label{
    font-size:16px;
    letter-spacing:2px;
    color:var(--gold-light);
    margin-bottom:14px;
  }

  .winner-reveal .reveal-name{
    font-family:'Amiri', serif;
    font-size:clamp(38px, 10vw, 64px);
    line-height:1.25;
    color:var(--cream);
  }
</style>
</head>
<body>

  <img src="logo.png" alt="سروشتی عەرەفە" class="logo" onerror="this.style.display='none'">
  <div class="brand-en">SRUSHT E ARAFA COMPANY</div>
  <h1>چەرخی دیاری عومرە</h1>
  <div class="sub">چەرخەکە بسوڕێنە و براوە دیاری بکە — تا ٣ جار</div>

  <div class="wheel-frame">
    <div class="pointer">▼</div>
    <div class="wheel-wrap">
      <canvas id="wheelCanvas" width="360" height="360"></canvas>
    </div>
  </div>

  <div class="spins-count">هەڵبژاردنی بەکارهاتوو: <b id="spinsUsedText">0</b> / ٣</div>

  <button id="spinBtn" disabled>🎡 سووڕاندنی چەرخ</button>
  <div class="msg" id="statusMsg">چاوەڕێی هێنانی ناوەکان...</div>

  <div class="board">
    <div class="board-title">🏆 براوەکان</div>
    <div id="winnersList">
      <div class="board-empty" id="boardEmpty">هێشتا براوەیەک دیاری نەکراوە</div>
    </div>
  </div>

  <footer>پڕۆژەی دیاری عومرە — سروشتی عەرەفە © 2026</footer>

  <div class="winner-reveal" id="winnerReveal">
    <div class="reveal-box" id="revealBox">
      <div class="reveal-label">🎉 براوە 🎉</div>
      <div class="reveal-name" id="revealName"></div>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://slllcibigutjivauryvc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH";
  const TABLE_NAME = "registrations";

  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const wheelWrap = document.querySelector('.wheel-wrap');
  const spinBtn = document.getElementById('spinBtn');
  const spinsUsedText = document.getElementById('spinsUsedText');
  const statusMsg = document.getElementById('statusMsg');
  const winnersList = document.getElementById('winnersList');
  const boardEmpty = document.getElementById('boardEmpty');
  const winnerReveal = document.getElementById('winnerReveal');
  const revealBox = document.getElementById('revealBox');
  const revealName = document.getElementById('revealName');

  const MAX_SPINS = 3;
  let pool = [];
  let spinsUsed = 0;
  let spinning = false;

  const segmentColors = ['#12817b', '#0a4f4c'];

  function getName(item) {
    return item.full_name || item.name || item.fullname || item.username || 'بێ ناو';
  }

  /* ---------------- sound effects (Web Audio API, no files needed) ---------------- */
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTick(){
    try{
      const ac = getAudioCtx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(1400, ac.currentTime);
      gain.gain.setValueAtTime(0.12, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.05);
      osc.connect(gain).connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + 0.05);
    }catch(e){ /* audio not available, ignore */ }
  }

  function playWinSound(){
    try{
      const ac = getAudioCtx();
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
      notes.forEach((freq, i)=>{
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ac.currentTime + i*0.11);
        gain.gain.setValueAtTime(0.0001, ac.currentTime + i*0.11);
        gain.gain.exponentialRampToValueAtTime(0.22, ac.currentTime + i*0.11 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + i*0.11 + 0.4);
        osc.connect(gain).connect(ac.destination);
        osc.start(ac.currentTime + i*0.11);
        osc.stop(ac.currentTime + i*0.11 + 0.42);
      });
    }catch(e){ /* audio not available, ignore */ }
  }

  /* schedule ticking sound across the spin duration, slowing down like a real wheel */
  function scheduleSpinTicks(durationMs){
    const totalTicks = 42;
    let elapsed = 0;
    // ease-out spacing: ticks start fast (small gaps) and end slow (big gaps)
    const weights = [];
    let sum = 0;
    for(let i=0;i<totalTicks;i++){
      const w = 1 + Math.pow(i/totalTicks, 2.2) * 6; // grows -> bigger gaps later
      weights.push(w);
      sum += w;
    }
    let t = 0;
    weights.forEach(w=>{
      const gap = (w/sum) * durationMs;
      t += gap;
      setTimeout(playTick, t);
    });
  }

  function drawWheel(items){
    const size = canvas.width;
    const center = size/2;
    const radius = center - 4;
    ctx.clearRect(0,0,size,size);

    if(items.length === 0){
      ctx.fillStyle = '#0a4f4c';
      ctx.beginPath();
      ctx.arc(center,center,radius,0,Math.PI*2);
      ctx.fill();
      return;
    }

    const anglePer = (Math.PI*2)/items.length;

    items.forEach((item, i)=>{
      const start = i*anglePer;
      const end = start+anglePer;

      ctx.beginPath();
      ctx.moveTo(center,center);
      ctx.arc(center,center,radius,start,end);
      ctx.closePath();
      ctx.fillStyle = segmentColors[i % 2];
      ctx.fill();
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.save();
      ctx.translate(center,center);
      ctx.rotate(start + anglePer/2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fdf8ec';
      ctx.font = "600 13px Tajawal, sans-serif";
      let label = getName(item);
      if(label.length > 13) label = label.slice(0,12) + '…';
      ctx.fillText(label, radius - 16, 5);
      ctx.restore();
    });

    // hub
    ctx.beginPath();
    ctx.arc(center,center,20,0,Math.PI*2);
    ctx.fillStyle = '#d4af37';
    ctx.fill();
    ctx.strokeStyle = '#fdf8ec';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function addWinnerCard(winner){
    boardEmpty.style.display = 'none';

    const card = document.createElement('div');
    card.className = 'winner-card';
    card.innerHTML = `
      <button class="delete-btn" title="سڕینەوە">×</button>
      <div class="name">${getName(winner)}</div>
      <div class="meta">
        <span>🏙️ ${winner.city || 'نادیار'}</span>
        <span class="phone">📱 ${winner.phone || winner.mobile || ''}</span>
      </div>
    `;

    card.querySelector('.delete-btn').addEventListener('click', ()=>{
      card.remove();
      if(winnersList.querySelectorAll('.winner-card').length === 0){
        boardEmpty.style.display = 'block';
      }
    });

    winnersList.prepend(card);
  }

  /* big centered reveal of the winner's name, then it shrinks and flies down
     toward the wheel/board area before the real card is added to the list */
  function revealWinner(winner){
    return new Promise(resolve=>{
      revealName.textContent = getName(winner);
      revealBox.classList.remove('fly-down');
      revealBox.style.transform = 'translateY(0) scale(0.3)';
      winnerReveal.classList.add('show-bg');

      playWinSound();

      // pop in, big, centered
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          revealBox.classList.add('pop-in');
        });
      });

      // after a beat, fly it down toward the wheel/board, shrinking and fading
      setTimeout(()=>{
        const wheelRect = wheelWrap.getBoundingClientRect();
        const boxRect = revealBox.getBoundingClientRect();
        const targetY = wheelRect.top + wheelRect.height/2 - (boxRect.top + boxRect.height/2);
        revealBox.classList.add('fly-down');
        revealBox.style.transform = `translateY(${targetY}px) scale(0.15)`;
      }, 1600);

      // clean up and resolve so the real winner card can be added
      setTimeout(()=>{
        winnerReveal.classList.remove('show-bg');
        revealBox.classList.remove('pop-in','fly-down');
        revealBox.style.transform = 'translateY(0) scale(0.3)';
        resolve();
      }, 2400);
    });
  }

  function spin(){
    if(spinning || spinsUsed >= MAX_SPINS || pool.length === 0) return;
    spinning = true;
    spinBtn.disabled = true;
    statusMsg.textContent = '';

    getAudioCtx(); // unlock audio on user gesture

    const n = pool.length;
    const winnerIndex = Math.floor(Math.random() * n);
    const winner = pool[winnerIndex];
    const anglePerDeg = 360 / n;
    const segCenterDeg = winnerIndex * anglePerDeg + anglePerDeg / 2;

    let rotNeeded = (270 - segCenterDeg) % 360;
    if (rotNeeded < 0) rotNeeded += 360;

    const fullTurns = 5 * 360;
    const totalRotation = fullTurns + rotNeeded;
    const SPIN_DURATION = 4400;

    wheelWrap.style.transition = 'none';
    wheelWrap.style.transform = 'rotate(0deg)';
    void wheelWrap.offsetWidth;
    wheelWrap.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(0.12,0.68,0.16,1)`;
    wheelWrap.style.transform = `rotate(${totalRotation}deg)`;

    scheduleSpinTicks(SPIN_DURATION);

    setTimeout(async ()=>{
      spinsUsed++;
      spinsUsedText.textContent = spinsUsed;

      await revealWinner(winner);

      addWinnerCard(winner);
      pool.splice(winnerIndex, 1);
      drawWheel(pool);

      spinning = false;

      if(spinsUsed >= MAX_SPINS){
        spinBtn.disabled = true;
        spinBtn.textContent = 'کۆتایی بە ٣ هەڵبژاردنەکە هات';
      } else if(pool.length === 0){
        spinBtn.disabled = true;
        spinBtn.textContent = 'هیچ ناوێکی دیکە نەماوە';
      } else {
        spinBtn.disabled = false;
      }
    }, SPIN_DURATION + 100);
  }

  async function loadRecords(){
    try{
      if(typeof window.supabase === 'undefined' || !window.supabase.createClient){
        throw new Error('کتێبخانەی Supabase دروست بارنەبووە');
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const { data, error } = await client
        .from(TABLE_NAME)
        .select('*');

      if(error){
        throw error;
      }

      pool = data || [];
      drawWheel(pool);

      if(pool.length === 0){
        statusMsg.textContent = 'خشتەکە بەتاڵە، هیچ ناوێک نەدۆزرایەوە';
      } else {
        statusMsg.textContent = `${pool.length} کەس بارکران بۆ چەرخەکە`;
        spinBtn.disabled = false;
      }
    } catch(err){
      console.error('کێشە لە بارکردن:', err);
      statusMsg.textContent = 'هەڵە: ' + (err.message || 'پەیوەندی لەگەڵ داتابەیس دروست نەبوو');
      statusMsg.classList.add('error');
    }
  }

  spinBtn.addEventListener('click', spin);

  // دڵنیابوونەوە لە باربوونی تەواوی پەڕەکە
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadRecords);
  } else {
    loadRecords();
  }
</script>

</body>
</html>
