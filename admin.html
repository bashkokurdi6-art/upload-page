<!DOCTYPE html>
<html lang="ckb" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIWAK ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Noto Sans Arabic',sans-serif;

background:
linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.85)),
url('https://images.unsplash.com/photo-1542816417-0983670d7f62?q=80&w=1200');

background-size:cover;
background-position:center;

min-height:100vh;

padding:20px;

color:white;

}

.login-box,
.dashboard{

max-width:1200px;

margin:auto;

background:rgba(7,20,15,.94);

border:2px solid #d4af37;

border-radius:28px;

padding:25px;

backdrop-filter:blur(10px);

box-shadow:
0 0 30px rgba(212,175,55,.2);

}

.dashboard{
display:none;
}

h1{

text-align:center;

color:#d4af37;

margin-bottom:25px;

}

.login-input{

width:100%;

padding:15px;

border:none;

border-radius:16px;

background:#10251c;

color:white;

font-size:16px;

margin-bottom:15px;

outline:none;

}

.login-btn{

width:100%;

padding:15px;

border:none;

border-radius:16px;

background:linear-gradient(135deg,#d4af37,#f5d67a);

color:#062015;

font-weight:bold;

font-size:16px;

cursor:pointer;

}

.top-box{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

margin-bottom:25px;

}

.price-card{

background:#0f3827;

padding:20px;

border-radius:20px;

border:1px solid #d4af37;

}

.price-card h3{

margin-bottom:15px;

color:#d4af37;

}

.price-input{

width:100%;

padding:14px;

border:none;

border-radius:14px;

background:#10251c;

color:white;

margin-bottom:10px;

}

.save-btn{

padding:12px 20px;

border:none;

border-radius:14px;

background:#d4af37;

color:#062015;

font-weight:bold;

cursor:pointer;

}

.requests{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(320px,1fr));

gap:20px;

}

.card{

background:#0f241b;

border:1px solid rgba(212,175,55,.25);

border-radius:24px;

padding:18px;

}

.card h3{

color:#d4af37;

margin-bottom:15px;

}

.item{

margin-bottom:10px;

font-size:14px;

line-height:1.8;

}

.images{

display:flex;

gap:10px;

margin-top:15px;

}

.images img{

width:100px;

height:100px;

object-fit:cover;

border-radius:14px;

border:1px solid #d4af37;

}

.delete-btn{

margin-top:15px;

width:100%;

padding:13px;

border:none;

border-radius:14px;

background:#b3261e;

color:white;

font-weight:bold;

cursor:pointer;

}

@media(max-width:768px){

.top-box{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>



<div class="login-box" id="loginBox">

<h1>SIWAK ADMIN</h1>

<input
type="password"
id="password"
class="login-input"
placeholder="وشەی نهێنی">

<button
class="login-btn"
onclick="login()">

چوونە ژوورەوە

</button>

</div>



<div class="dashboard" id="dashboard">

<h1>بەڕێوەبردنی ڕەوزە</h1>



<div class="top-box">

<div class="price-card">

<h3>گۆڕینی نرخ</h3>

<input
type="text"
id="priceInput"
class="price-input">

<button
class="save-btn"
onclick="updatePrice()">

پاشەکەوتکردن

</button>

</div>

</div>



<div class="requests" id="requests"></div>

</div>



<script>

const ADMIN_PASSWORD = "SIWAK2026";



function login(){

const pass =
document.getElementById("password").value;

if(pass === ADMIN_PASSWORD){

document.getElementById("loginBox").style.display = "none";

document.getElementById("dashboard").style.display = "block";

loadRequests();

loadPrice();

}else{

alert("وشەی نهێنی هەڵەیە");

}

}



// ======================
// SUPABASE
// ======================

const SUPABASE_URL =
"https://slllcibigutjivauryvc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



// ======================
// LOAD PRICE
// ======================

async function loadPrice(){

const { data } =
await client
.from("rawda_prices")
.select("*")
.limit(1)
.single();

if(data){

document.getElementById("priceInput").value =
data.price;

}

}



// ======================
// UPDATE PRICE
// ======================

async function updatePrice(){

const newPrice =
document.getElementById("priceInput").value;

await client
.from("rawda_prices")
.update({
price:newPrice
})
.eq("id",1);

alert("نرخ نوێ کرایەوە");

}



// ======================
// LOAD REQUESTS
// ======================

async function loadRequests(){

const { data } =
await client
.from("rawda_requests")
.select("*")
.order("id",{ascending:false});

const requests =
document.getElementById("requests");

requests.innerHTML = "";



data.forEach(item=>{

requests.innerHTML += `

<div class="card">

<h3>${item.naw_syani}</h3>

<div class="item">
📱 ${item.mobile}
</div>

<div class="item">
⏰ ${item.katzhmer}
</div>

<div class="item">
📅 ${item.roj}
</div>

<div class="item">
👤 ${item.gender}
</div>

<div class="item">
💳 ${item.paradan}
</div>

<div class="item">
📝 ${item.tebini || "-"}
</div>

<div class="images">

<a href="${item.passport_image}" target="_blank">

<img src="${item.passport_image}">

</a>

<a href="${item.payment_image}" target="_blank">

<img src="${item.payment_image}">

</a>

</div>

<button
class="delete-btn"
onclick="deleteRequest(${item.id})">

سڕینەوە

</button>

</div>

`;

});

}



// ======================
// DELETE
// ======================

async function deleteRequest(id){

const ok =
confirm("دڵنیایت؟");

if(!ok) return;

await client
.from("rawda_requests")
.delete()
.eq("id",id);

loadRequests();

}

</script>

</body>
</html>
