
<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060c1f">
<title>Top Charge | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<style>
:root {
  --bg:#060c1f;
  --card:#0b1328;
  --line:#193650;
  --field:#08101f;
  --ink:#eff5fc;
  --mut:#98a5b9;
  --blue:#17d4ee;
  --ok:#0ecb81;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px/1.7 Tahoma,Arial,sans-serif;
}
header,main {
  max-width:920px;
  margin:auto;
  padding:20px 16px;
}
.top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand,h2 {color:var(--blue)}
.brand {
  font-weight:700;
  font-size:17px;
}
.box {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  margin-bottom:15px;
}
h1 {font-size:21px}
h2 {font-size:16px;margin:0 0 12px}
label {
  display:block;
  color:var(--mut);
  font-size:13px;
  margin:12px 0 5px;
}
input,select {
  width:100%;
  background:var(--field);
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  color:var(--ink);
  font:14px Tahoma,Arial;
  color-scheme:dark;
}
button {
  cursor:pointer;
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px 14px;
  background:#12223b;
  color:white;
  font:700 14px Tahoma,Arial;
}
.submit {
  background:linear-gradient(90deg,#12c2ff,#2a6bff);
  border:0;
}
.mut {color:var(--mut)}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;
}
.bar {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
.bar select {width:auto;max-width:240px}
.item {
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  margin:10px 0;
  overflow-wrap:anywhere;
}
.row {
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}
.status {color:var(--blue)}
.err {color:#ff6b7d}
.ok {color:var(--ok)}
.hidden {display:none!important}
small {color:var(--mut)}
a {color:var(--blue)}
.photos {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.photos button {font-size:12px}
#msg {min-height:23px}
</style>
</head>
<body>

<header>
  <div class="top">
    <span class="brand">◈ Top Charge | Admin</span>
    <button id="logout" class="hidden">
      چوونەدەرەوە
    </button>
  </div>
  <h1>داشبۆردی ئەدمین</h1>
  <p class="mut">
    تۆمارکردنەکان و داواکارییەکانی پڕکردنەوە
  </p>
</header>

<main>
<section id="login" class="box">
  <h2>چوونەژوورەوەی ئەدمین</h2>

  <label>ئیمەیڵ</label>
  <input id="email" type="email"
         autocomplete="username">

  <label>پاسۆردی تایبەتی ئەدمین</label>
  <input id="password" type="password"
         autocomplete="current-password">

  <p>
    <button class="submit" id="signin">
      چوونەژوورەوە
    </button>
  </p>
</section>

<section id="dashboard" class="hidden">
  <div class="grid">
    <div class="box">
      تۆماربووان
      <div><b id="agent-count">—</b></div>
    </div>
    <div class="box">
      داواکارییەکان
      <div><b id="request-count">—</b></div>
    </div>
    <div class="box">
      چاوەڕوان
      <div><b id="pending-count">—</b></div>
    </div>
  </div>

  <div class="box">
    <div class="bar">
      <button id="show-agents">تۆماربووان</button>
      <button id="show-requests">داواکارییەکان</button>

      <select id="filter">
        <option value="all">هەموو دۆخەکان</option>
        <option value="pending">چاوەڕوان</option>
        <option value="approved">پەسەندکراو</option>
        <option value="rejected">ڕەتکراو</option>
      </select>

      <button id="refresh">نوێکردنەوە</button>
    </div>
  </div>

  <div id="results" class="box"></div>
</section>

<p id="msg" role="status"></p>
</main>

<script>
const $ = id => document.getElementById(id);

const sb = window.supabase?.createClient(
  "https://qieifmpzmenpfewfsssl.supabase.co",
  "sb_publishable_-yOD7PqBzqKuxrhbr7FmVQ_6HPhspI_"
);

let tab = "agents";
let agents = [];
let requests = [];

function say(s, bad=false) {
  $("msg").textContent = s;
  $("msg").className = bad ? "err" : "ok";
}

function node(tag, text, cls) {
  const el = document.createElement(tag);
  el.textContent = String(text ?? "");
  if (cls) el.className = cls;
  return el;
}

function add(parent, tag, text, cls) {
  const e = node(tag, text, cls);
  parent.append(e);
  return e;
}

function line(parent, k, v) {
  const d = node("div");
  add(d, "small", k + " : ");
  add(d, "span", v ?? "—");
  parent.append(d);
}

function updateAuth(authorized) {
  $("login").classList.toggle("hidden", authorized);
  $("dashboard").classList.toggle("hidden", !authorized);
  $("logout").classList.toggle("hidden", !authorized);
}

async function authorize() {
  if (!sb) {
    say("Supabase کار ناکات", true);
    return false;
  }

  const {data:{user}} = await sb.auth.getUser();

  if (!user) {
    updateAuth(false);
    return false;
  }

  const {data,error} = await sb.rpc("is_tc_admin");

  if (error || !data) {
    await sb.auth.signOut();
    updateAuth(false);
    say("ئەم ئەکاونتە مۆڵەتی ئەدمینی نییە.", true);
    return false;
  }

  updateAuth(true);
  return true;
}

async function load() {
  say("داتا دەهێنرێت...");

  try {
    const [a,r,ac,rc,pc] = await Promise.all([
      sb.from("agents")
        .select("*")
        .order("created_at",{ascending:false})
        .limit(200),

      sb.from("tc_requests")
        .select("*")
        .order("created_at",{ascending:false})
        .limit(200),

      sb.from("agents")
        .select("id",{count:"exact",head:true}),

      sb.from("tc_requests")
        .select("id",{count:"exact",head:true}),

      sb.from("tc_requests")
        .select("id",{count:"exact",head:true})
        .eq("status","pending")
    ]);

    for (const response of [a,r,ac,rc,pc]) {
      if (response.error) throw response.error;
    }

    agents = a.data || [];
    requests = r.data || [];

    $("agent-count").textContent = ac.count ?? "—";
    $("request-count").textContent = rc.count ?? "—";
    $("pending-count").textContent = pc.count ?? "—";

    draw();
    say("زانیاری نوێکرایەوە (٢٠٠ تۆماری دواوە بۆ هەر بەش)");

  } catch (e) {
    say("هەڵە: " + e.message, true);
  }
}

function statusPicker(item, table, card) {
  const sel = document.createElement("select");

  for (const [v,n] of [
    ["pending","چاوەڕوان"],
    ["approved","پەسەندکراو"],
    ["rejected","ڕەتکراو"]
  ]) {
    sel.add(new Option(n,v));
  }

  sel.value = item.status || "pending";

  const save = node("button","پاشەکەوتکردنی دۆخ");

  save.onclick = async () => {
    save.disabled = true;

    const {error} = await sb.from(table)
      .update({status:sel.value})
      .eq("id",item.id);

    save.disabled = false;

    if (error) {
      say(error.message,true);
    } else {
      await load();
    }
  };

  card.append(sel,save);
}

async function openPhoto(path) {
  if (!path) return;

  const {data,error} = await sb.storage
    .from("id-photos")
    .createSignedUrl(path,60);

  if (error) {
    say(error.message,true);
    return;
  }

  window.open(
    data.signedUrl,
    "_blank",
    "noopener,noreferrer"
  );
}

function draw() {
  const root = $("results");
  root.replaceChildren();

  add(
    root,
    "h2",
    tab === "agents" ? "تۆماربووان" : "داواکارییەکان"
  );

  const entries = (
    tab === "agents" ? agents : requests
  ).filter(x =>
    $("filter").value === "all" ||
    (x.status || "pending") === $("filter").value
  );

  if (!entries.length) {
    add(root,"p","هیچ تۆمارێک نییە","mut");
    return;
  }

  for (const item of entries) {
    const card = add(root,"div","","item");
    const hd = add(card,"div","","row");

    add(
      hd,
      "b",
      tab === "agents"
        ? (item.full_name || "—")
        : (item.request_reference
            ? "#" + item.request_reference
            : "داواکاری")
    );

    add(
      hd,
      "small",
      item.created_at
        ? new Date(item.created_at).toLocaleString("en-GB")
        : ""
    );

    line(card,"مۆبایل",item.phone);
    line(card,"دۆخ",item.status || "pending");

    if (tab === "agents") {
      line(card,"ئیمەیڵ",item.email);
      line(card,"لەدایکبوون",item.dob);
      line(card,"ڕەگەز",item.gender);
      line(card,"پارێزگا",item.province);
      line(card,"ناونیشان",item.address);

      const photos = add(card,"div","","photos");

      for (const [label,path] of [
        ["پێناسە پێش",item.id_front_path],
        ["پێناسە پشت",item.id_back_path],
        ["سێلفی",item.selfie_path]
      ]) {
        if (path) {
          const b = node("button",label);
          b.onclick = () => openPhoto(path);
          photos.append(b);
        }
      }

    } else {
      line(
        card,
        "بڕی پارە",
        (item.amount ?? 0).toLocaleString("en-US") + " IQD"
      );

      line(
        card,
        "بۆنەس",
        (item.bonus_amount ?? 0).toLocaleString("en-US") + " IQD"
      );

      line(card,"تێبینی",item.address);
    }

    statusPicker(
      item,
      tab === "agents" ? "agents" : "tc_requests",
      card
    );
  }
}

$("signin").onclick = async () => {
  if (!sb) {
    return say("Supabase unavailable",true);
  }

  $("signin").disabled = true;

  const {error} = await sb.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });

  $("signin").disabled = false;

  if (error) {
    return say(error.message,true);
  }

  if (await authorize()) {
    await load();
  }
};

$("logout").onclick = async () => {
  await sb.auth.signOut();
  updateAuth(false);
  say("چوویتە دەرەوە");
};

$("refresh").onclick = load;

$("show-agents").onclick = () => {
  tab = "agents";
  draw();
};

$("show-requests").onclick = () => {
  tab = "requests";
  draw();
};

$("filter").onchange = draw;

(async () => {
  if (await authorize()) {
    await load();
  }
})();
</script>
</body>
</html>
