    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function removeDynamicSchema() {
      document
        .querySelectorAll('script[type="application/ld+json"][data-dynamic]')
        .forEach(function (el) {
          el.remove();
        });
    }

    function injectBreadcrumbSchema(path) {
      if (!path || path === "/") return;

      var cleanPath = path.replace(/\/$/, "");
      var segments = cleanPath.split("/").filter(Boolean);

      if (!segments.length) return;

      var breadcrumbItems = [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": BASE_URL + "/"
        }
      ];

      var currentPath = "";
      segments.forEach(function (seg, index) {
        currentPath += "/" + seg;
        breadcrumbItems.push({
          "@type": "ListItem",
          "position": index + 2,
          "name": capitalize(seg.replace(/-/g, " ")),
          "item": BASE_URL + currentPath
        });
      });

      var pageUrl = BASE_URL + cleanPath;

      var schema = {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebPage",
            "@id": pageUrl + "#webpage",
            "url": pageUrl,
            "name": capitalize(segments[segments.length - 1]),
            "isPartOf": { "@id": SITE_ID },
            "about": { "@id": ORG_ID },
            "breadcrumb": { "@id": pageUrl + "#breadcrumb" }
          },
          {
            "@type": "BreadcrumbList",
            "@id": pageUrl + "#breadcrumb",
            "itemListElement": breadcrumbItems
          }
        ]
      };

      var script = document.createElement("script");
      script.type = "application/ld+json";
      script.setAttribute("data-dynamic", "true");
      script.text = JSON.stringify(schema);
      document.head.appendChild(script);
    }

    function setCanonicalAndSEO() {
      var origin = window.location.origin;
      var path = window.location.pathname.replace(/\/$/, "");
     

      var canonicalUrl = origin + (path || "/");
      var link = document.querySelector("link[rel='canonical']");
      if (!link) {
        link = document.createElement("link");
        link.rel = "canonical";
        document.head.appendChild(link);
      }
      link.href = canonicalUrl;

      // 🔥 Structured data handling
      removeDynamicSchema();
      injectBreadcrumbSchema(path);
    }

    // Initial run
    setCanonicalAndSEO();
  })();
