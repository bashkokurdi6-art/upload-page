*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

html,body{

width:100%;

body{

}

background-size:cover;
background-position:center;

}

.overlay{

}

.header-content{

position:relative;

}

.title{

text-align:center;

}

.city{

}

.sun{

font-size:38px;

}

.card{

width:calc(100% - 30px);

background:white;

margin:auto;

margin-top:-35px;

border-radius:28px;

padding:6px 18px;

position:relative;

z-index:5;

box-shadow:0 5px 18px rgba(0,0,0,0.10);

}

.time{

.bottom{

border-radius:24px;

padding:16px;

display:flex;
justify-content:space-between;
align-items:center;

color:white;

}

.next{

font-size:13px;

opacity:0.8;

}

.clock{

font-size:32px;

}

.sound{

}

</style>
</head>

function updateClock(){

const now = new Date();

document.getElementById("clock").innerHTML =
now.toLocaleTimeString('en-US',{

}

setInterval(updateClock,1000);
