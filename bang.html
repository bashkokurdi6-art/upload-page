<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SIWAK</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

html,body{

width:100%;
height:100%;

overflow:hidden;

background:#f4f4f4;

}

body{

display:flex;

}

.phone{

width:100%;
height:100%;

background:white;

overflow:hidden;

display:flex;
flex-direction:column;

}

.header{

height:24%;

min-height:170px;

background-image:url('bg1.jpg');

background-size:cover;
background-position:center;

position:relative;

padding:22px 18px;

color:white;

flex-shrink:0;

}

.overlay{

position:absolute;
inset:0;

background:rgba(0,70,50,0.55);

}

.header-content{

position:relative;
z-index:2;

}

.title{

text-align:center;

font-size:24px;
font-weight:bold;

margin-bottom:18px;

}

.top{

display:flex;
justify-content:space-between;
align-items:center;

}

.city{

font-size:15px;

line-height:1.8;

}

.sun{

font-size:34px;

}

.card{

flex:1;

background:white;

margin:-25px 14px 12px;

border-radius:26px;

padding:4px 18px;

position:relative;

z-index:5;

box-shadow:0 4px 16px rgba(0,0,0,0.08);

display:flex;
flex-direction:column;
justify-content:center;

}

.prayer{

display:flex;
justify-content:space-between;
align-items:center;

padding:13px 0;

border-bottom:1px solid #eeeeee;

}

.prayer:last-child{

border-bottom:none;

}

.name{

font-size:18px;
font-weight:bold;

color:#111;

}

.time{

font-size:18px;
font-weight:bold;

color:#0b6b4b;

}

.bottom{

margin:0 14px 14px;

background:#0b6b4b;

border-radius:22px;

padding:14px 18px;

display:flex;
justify-content:space-between;
align-items:center;

color:white;

flex-shrink:0;

}

.next{

font-size:12px;

opacity:0.8;

margin-bottom:4px;

}

.clock{

font-size:28px;

font-weight:bold;

}

.sound{

font-size:28px;

}

</style>
</head>

<body>

<div class="phone">

<div class="header">

<div class="overlay"></div>

<div class="header-content">

<div class="title">
كاتەکانی نوێژ
</div>

<div class="top">

<div class="city">

هەولێر <br>

١٥ شوال ١٤٤٦ هـ

</div>

<div class="sun" id="sunIcon">
☀️
</div>

</div>

</div>

</div>

<div class="card" id="prayerList">

</div>

<div class="bottom">

<div>

<div class="next">
بۆ بانگی دواتر
</div>

<div class="clock" id="clock">
6:45 PM
</div>

</div>

<div class="sound">
🔊
</div>

</div>

</div>

<script>

function formatTime24to12(time){

let [hours, minutes] = time.split(':');

hours = parseInt(hours);

const ampm = hours >= 12 ? 'PM' : 'AM';

hours = hours % 12;

hours = hours ? hours : 12;

return `${hours}:${minutes} ${ampm}`;

}

async function loadPrayerTimes(){

const response = await fetch(
'https://api.aladhan.com/v1/timingsByCity?city=Erbil&country=IQ&method=4'
);

const data = await response.json();

const t = data.data.timings;

document.getElementById("prayerList").innerHTML = `

<div class="prayer">
<div class="name">بەیانی</div>
<div class="time">${formatTime24to12(t.Fajr)}</div>
</div>

<div class="prayer">
<div class="name">خۆر هەڵاتن</div>
<div class="time">${formatTime24to12(t.Sunrise)}</div>
</div>

<div class="prayer">
<div class="name">نیوەڕۆ</div>
<div class="time">${formatTime24to12(t.Dhuhr)}</div>
</div>

<div class="prayer">
<div class="name">عەسر</div>
<div class="time">${formatTime24to12(t.Asr)}</div>
</div>

<div class="prayer">
<div class="name">مەغریب</div>
<div class="time">${formatTime24to12(t.Maghrib)}</div>
</div>

<div class="prayer">
<div class="name">عیشا</div>
<div class="time">${formatTime24to12(t.Isha)}</div>
</div>

`;

}

function updateClock(){

const now = new Date();

document.getElementById("clock").innerHTML =

now.toLocaleTimeString('en-US',{

hour:'numeric',
minute:'2-digit',
hour12:true

});

}

function updateDayNight(){

const hour = new Date().getHours();

const icon = document.getElementById("sunIcon");

if(hour >= 6 && hour < 18){

icon.innerHTML = "☀️";

}else{

icon.innerHTML = "🌙";

}

}

loadPrayerTimes();

updateDayNight();

setInterval(updateClock,1000);

updateClock();

</script>

</body>
</html>
